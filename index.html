<style>
  @import url('https://fonts.googleapis.com/css2?family=Righteous&family=Inter:wght@400;500;600;700;800&display=swap');
  html, body {
    margin:0; padding:0; font-family: 'Inter', sans-serif; color: var(--chalk);
    background:
      radial-gradient(circle at 20% 20%, rgba(var(--gold-rgb),0.28), transparent 42%),

  /* Theme: the JS (applyTheme) overrides these base colours; everything else derives from them. */
  :root {

    --gold: #ff2d95;               --gold-rgb: 255,45,149;
    --gold-soft: #ff7ac2;          --gold-light: #ffb3dd;

    --panel-rgb: 32,14,42;         --panel-soft-rgb: 48,20,62;  --deep-rgb: 17,7,23;
    --panel: rgba(var(--panel-rgb),0.78);
    --panel-soft: rgba(var(--panel-soft-rgb),0.65);

    --on-accent: #fff;
    --red: #ff4d6d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  @keyframes bannerPop {
    0% { transform: scale(0.85); opacity: 0; }

    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes glowPulse {

    50% { box-shadow: 0 0 16px 4px rgba(var(--gold-rgb),0.45); }
  }
  @keyframes surpriseFlash {
    0% { transform: scale(0.92); opacity: 0; background: rgba(var(--gold-rgb),0.4); }
    50% { transform: scale(1.03); }
    100% { transform: scale(1); opacity: 1; background: rgba(var(--gold-rgb),0.12); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
  @keyframes shimmerSweep {
    0% { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }
  @keyframes glowPulseRed {
    0%, 100% { box-shadow: 0 0 0 0 rgba(224,122,109,0.45); }
    50% { box-shadow: 0 0 18px 5px rgba(224,122,109,0.5); }
  }
  @keyframes glowPulsePink {
    0%, 100% { box-shadow: 0 0 0 0 rgba(var(--purple-rgb),0.45); }
    50% { box-shadow: 0 0 18px 5px rgba(var(--purple-rgb),0.5); }
  }
  @keyframes chainSwing {
    0%, 100% { transform: rotate(-8deg); }
    50% { transform: rotate(8deg); }
  }
  @keyframes floatSparkle {
    0%, 100% { transform: translateY(0) scale(1) rotate(0deg); opacity: 0.35; }
    50% { transform: translateY(-7px) scale(1.15) rotate(12deg); opacity: 0.9; }
  }
  @keyframes popupOverlayFade {
    0% { opacity: 0; }
    100% { opacity: 1; }
  }
  @keyframes popupCardIn {
    0% { transform: scale(0.6) rotate(-4deg); opacity: 0; }
    60% { transform: scale(1.06) rotate(1deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  @keyframes popupBorderShift {
    0% { background-position: 100% 100%, 0% 50%; }
    100% { background-position: 100% 100%, 320% 50%; }
  }
  @keyframes popupEmojiPulse {
    0%, 100% { transform: scale(1) rotate(-6deg); }
    50% { transform: scale(1.2) rotate(6deg); }
  }
  html, body { min-height: 100%; overflow-x: hidden; -webkit-text-size-adjust: 100%; }
  @keyframes clubGlowDrift {
    0%, 100% { background-position: 20% 20%, 80% 30%, 50% 85%; }
    50% { background-position: 30% 35%, 65% 15%, 55% 70%; }
  }
  .app {

      radial-gradient(circle at 20% 20%, rgba(var(--gold-rgb),0.28), transparent 42%),

  .pick-list-label { font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em; color: var(--chalk-dim); margin-bottom:7px; }

  .anulingus-refuse { width:100%; }

  .edit-modal-overlay {
    position: fixed; inset: 0; z-index: 900;
    background: rgba(4,1,8,0.82);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);

  .stepper { display:flex; align-items:center; gap:14px; }

  .custom-chance-field { margin-bottom: 4px; }

    background: rgba(var(--gold-rgb),0.06);

  .home-top { display:flex; justify-content:flex-end; }
  .home-hero { text-align:center; margin: 0 0 26px; }

  .home-title { font-family:'Righteous'; font-size:50px; line-height:1.05; margin:0; color: var(--gold); text-shadow: 0 0 22px rgba(var(--gold-rgb),0.65); }
  .home-sub { margin:6px 0 0; color: var(--chalk-dim); font-size:14px; letter-spacing:0.04em; }

  .features-panel.flat { background:none; border:none; box-shadow:none; padding:0; margin:0; }

    { label: "Suite 2-3-4-5", points: 400, cost: 4 },
    { label: "Suite 3-4-5-6", points: 450, cost: 4 },
  ],
  3: [
    { label: "Suite 1-2-3", points: 200, cost: 3 },
    { label: "Suite 2-3-4", points: 250, cost: 3 },
    { label: "Suite 3-4-5", points: 300, cost: 3 },
    { label: "Suite 4-5-6", points: 350, cost: 3 },
  ],
};

function getComboRows(diceCount) {
  if (diceCount === 3) {
    return FACE_ROWS.map((row) => {
      if (row.face === 1 || row.face === 5) {
        const tiers = {};
        [1, 2, 3].forEach((k) => { if (row.tiers[k]) tiers[k] = row.tiers[k]; });
        return { face: row.face, tiers };
      }
      const tiers = { 2: row.face * 30 };
      if (row.tiers[3]) tiers[3] = row.tiers[3];
      return { face: row.face, tiers };
    });
  }
  if (diceCount === 4) {
    return FACE_ROWS.map((row) => {
      const tiers = {};
      [1, 2, 3, 4].forEach((k) => { if (row.tiers[k]) tiers[k] = row.tiers[k]; });
      return { face: row.face, tiers };
    }).filter((row) => Object.keys(row.tiers).length > 0);
  }
  const maxTier = diceCount - 1;
  return FACE_ROWS.map((row) => {
    const tiers = {};
    Object.keys(row.tiers).forEach((k) => {
      if (Number(k) <= maxTier) tiers[k] = row.tiers[k];
    });
    return { face: row.face, tiers };
  }).filter((row) => Object.keys(row.tiers).length > 0);
}

function getExtraCombos(diceCount) {
  const combos = [];
  if (diceCount === 4) combos.push({ label: "Deux paires", points: 250, cost: 4 });
  if (SHORT_STRAIGHTS[diceCount]) combos.push(...SHORT_STRAIGHTS[diceCount]);
  return combos;
}

const THEME_FIELDS = [

  ["purple", "Accent 2"],
  ["teal", "Accent 3"],
  ["chalk", "Texte"],
];
const DEFAULT_THEME = THEME_PRESETS[0].colors;

function sameColors(a, b) {
  return THEME_FIELDS.every(([k]) => String(a[k]).toLowerCase() === String(b[k]).toLowerCase());
}
function isHex(v) {
  return typeof v === "string" && /^#[0-9a-fA-F]{6}$/.test(v);
}
function hexToRgb(hx) {
  return [1, 3, 5].map((i) => parseInt(hx.slice(i, i + 2), 16));
}
function rgbToHex(rgb) {
  return "#" + rgb.map((v) => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0")).join("");
}
function mixRgb(a, b, t) {
  return a.map((v, i) => Math.round(v + (b[i] - v) * t));
}
function lum(rgb) {
  return (0.299 * rgb[0] + 0.587 * rgb[1] + 0.114 * rgb[2]) / 255;
}

// Everything the UI needs, derived from the 5 base colours. The default (Néon) theme returns the
// exact original values so nothing changes visually until the user picks another theme.
function deriveTheme(c) {
  const j = (a) => a.join(",");
  const bg = hexToRgb(c.bg), gold = hexToRgb(c.gold), purple = hexToRgb(c.purple);
  const teal = hexToRgb(c.teal), chalk = hexToRgb(c.chalk);
  const white = [255, 255, 255];
  const isDefault = sameColors(c, DEFAULT_THEME);
  const panel = isDefault ? [32, 14, 42] : mixRgb(bg, purple, 0.13);
  const panelSoft = isDefault ? [48, 20, 62] : mixRgb(bg, purple, 0.2);
  const deep = isDefault ? [17, 7, 23] : mixRgb(bg, purple, 0.05);
  const dim = isDefault ? [196, 143, 196] : mixRgb(mixRgb(chalk, purple, 0.25), bg, 0.2);
  const goldSoft = isDefault ? [255, 122, 194] : mixRgb(gold, white, 0.35);
  const goldLight = isDefault ? [255, 179, 221] : mixRgb(gold, white, 0.65);
  const purpleLight = isDefault ? [230, 184, 250] : mixRgb(purple, white, 0.6);
  const onAccent = (lum(gold) + lum(purple)) / 2 > 0.62 ? "#12060f" : "#ffffff";
  const vars = {
    "--bg": c.bg, "--bg-rgb": j(bg),
    "--gold": c.gold, "--gold-rgb": j(gold), "--gold-soft": rgbToHex(goldSoft), "--gold-light": rgbToHex(goldLight),
    "--purple": c.purple, "--purple-rgb": j(purple), "--purple-light": rgbToHex(purpleLight),
    "--teal": c.teal, "--teal-rgb": j(teal),
    "--chalk": c.chalk, "--chalk-rgb": j(chalk), "--chalk-dim": rgbToHex(dim),
    "--panel-rgb": j(panel), "--panel-soft-rgb": j(panelSoft), "--deep-rgb": j(deep),
    "--on-accent": onAccent,
  };
  // palette for the canvas (shared image)
  const P = {
    bg: c.bg, bgRgb: j(bg), gold: c.gold, goldRgb: j(gold), purple: c.purple, purpleRgb: j(purple),
    teal: c.teal, tealRgb: j(teal), chalk: c.chalk, chalkRgb: j(chalk), dim: rgbToHex(dim),
    panelSoftRgb: j(panelSoft),
  };
  return { vars, P, isDefault };
}

function applyTheme(colors) {
  const d = deriveTheme(colors);
  const root = document.documentElement;
  Object.keys(d.vars).forEach((k) => {
    if (d.isDefault) root.style.removeProperty(k);
    else root.style.setProperty(k, d.vars[k]);
  });
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", colors.bg);
  CHART_COLORS[0] = colors.gold;
  CHART_COLORS[1] = colors.teal;
  CHART_COLORS[2] = colors.purple;
  try {
    localStorage.setItem(THEME_KEY, JSON.stringify({ colors, vars: d.isDefault ? {} : d.vars }));
  } catch (e) {}
  return d;
}

function loadTheme() {
  try {
    const saved = JSON.parse(localStorage.getItem(THEME_KEY));
    if (saved && saved.colors && THEME_FIELDS.every(([k]) => isHex(saved.colors[k]))) return { ...saved.colors };
  } catch (e) {}
  return { ...DEFAULT_THEME };
}

// ------------------------------------------------------------------ saved games (mini DB in localStorage)
// One small index (summaries, newest first) + one record per game, so autosaving a game only rewrites
// that game's own record. Only the 10 most recent games are kept.
const GAMES_INDEX_KEY = "rico-games-v1";
const GAME_KEY_PREFIX = "rico-game-v1-";
const MAX_SAVED_GAMES = 10;
let gameIdCounter = 0;

function makeGameId() {
  gameIdCounter += 1;
  return `${Date.now().toString(36)}-${gameIdCounter.toString(36)}-${Math.random().toString(36).slice(2, 6)}`;
}
function readGamesIndex() {
  try {
    const list = JSON.parse(localStorage.getItem(GAMES_INDEX_KEY));
    // always newest first, whatever order the data was written in
    return Array.isArray(list) ? [...list].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)) : [];
  } catch (e) {
    return [];
  }
}
function writeGamesIndex(list) {
  try {
    localStorage.setItem(GAMES_INDEX_KEY, JSON.stringify(list));
    return true;
  } catch (e) {
    return false;
  }
}
function readGameRecord(id) {
  try {
    return JSON.parse(localStorage.getItem(GAME_KEY_PREFIX + id));
  } catch (e) {
    return null;
  }
}
function writeGameRecord(id, rec) {
  try {
    localStorage.setItem(GAME_KEY_PREFIX + id, JSON.stringify(rec));
    return true;
  } catch (e) {
    return false;
  }
}
function deleteGameRecord(id) {
  try {
    localStorage.removeItem(GAME_KEY_PREFIX + id);
  } catch (e) {}
  writeGamesIndex(readGamesIndex().filter((g) => g.id !== id));
}
function saveGameRecord(id, meta, data) {
  const now = Date.now();
  let index = readGamesIndex();
  const existing = index.find((g) => g.id === id);
  const entry = {
    id,
    createdAt: existing ? existing.createdAt : now,
    updatedAt: now,
    status: meta.status,
    summary: meta.summary,
  };
  index = [entry, ...index.filter((g) => g.id !== id)].sort((a, b) => b.updatedAt - a.updatedAt);
  index.slice(MAX_SAVED_GAMES).forEach((g) => {
    try {
      localStorage.removeItem(GAME_KEY_PREFIX + g.id);
    } catch (e) {}
  });
  index = index.slice(0, MAX_SAVED_GAMES);
  let ok = writeGameRecord(id, data);
  // Storage full: drop the oldest other games until this one fits.
  while (!ok && index.length > 1) {
    const oldest = [...index].reverse().find((g) => g.id !== id);
    if (!oldest) break;
    try {
      localStorage.removeItem(GAME_KEY_PREFIX + oldest.id);
    } catch (e) {}
    index = index.filter((g) => g.id !== oldest.id);
    ok = writeGameRecord(id, data);
  }
  writeGamesIndex(index);
  return ok;
}
function fmtGameDate(ts) {
  try {
    return new Date(ts).toLocaleString("fr-FR", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
  } catch (e) {
    return "";
  }
}

            <li><b>L’objectif est atteint.</b> Un bandeau l’annonce ; les joueurs qui n’ont pas encore joué dans la manche sont <b>en défense</b> et jouent leur dernier tour.</li>
            <li><b>La manche se termine.</b> Les surprises de fin de manche se jouent. Aucun gagnant n’est désigné avant.</li>
            <li><b>On compte.</b> Si <b>au moins un joueur est à l’objectif ou au-dessus</b>, même grâce à une surprise de fin de manche, <b>la partie est terminée</b> : le plus haut total gagne.</li>
            <li><b>Sinon, on continue.</b> Si plus personne n’atteint l’objectif, <b>le dernier tour est annulé</b> et la partie reprend.</li>
          </ol>
          <RuleCard title="L’égalité : le départage">
            Plusieurs joueurs à égalité en tête ? Chacun joue <b>un tour</b> (sans surprise) : le meilleur score gagne. Nouvelle égalité ? On recommence entre les ex&nbsp;æquo.
          </RuleCard>

          <h2 className="rules-h">Après la partie</h2>
          <ul className="rules-list">
            <li>Classement avec la <b>lanterne rouge</b>, <b>courbes de score par manche</b>, statistiques et <b>partage</b> des résultats.</li>
            <li>Chaque partie est <b>sauvegardée</b> : les 10 dernières sont dans l’<b>Historique</b>.</li>
            <li>Une erreur de saisie ? Le <b>crayon</b> de l’historique de la partie corrige un tour. Si la partie s’est terminée à tort, « <b>Corriger la partie</b> » la rouvre : après rectification, l’app revérifie la fin de partie et la reprend si plus personne n’est à l’objectif.</li>
          </ul>
          <div className="wizard-nav">
            <button className="primary-btn" onClick={onBack}>← Accueil</button>
          </div>
        </div>
      </div>
    </div>
  );
}

const CHART_COLORS = ["#ff2d95", "#29e7ff", "#b537f2", "#ffd166", "#7cfc9a", "#ff8c42", "#8fa8ff", "#ffffff"];

function niceStep(raw) {
  const steps = [50, 100, 200, 250, 500, 1000, 2000, 2500, 5000, 10000];
  return steps.find((st) => st >= raw) || 20000;
}

// Geometry shared by the on-screen SVG chart and the shared PNG image.
function computeChart(points, players, target, W, H, m) {
  const all = [];
  points.forEach((pt) => players.forEach((p) => all.push(pt.totals[p.id] ?? 0)));
  const rawMin = Math.min(0, ...all);
  const rawMax = Math.max(target > 0 ? target : 0, ...all, 1);
  const step = niceStep((rawMax - rawMin) / 4);
  const yMin = Math.floor(rawMin / step) * step;
  const yMax = Math.ceil(rawMax / step) * step;
  const iw = W - m.l - m.r;
  const ih = H - m.t - m.b;
  const last = points.length - 1;
  const xAt = (i) => m.l + (last > 0 ? (i / last) * iw : iw / 2);
  const yAt = (v) => m.t + ih - ((v - yMin) / (yMax - yMin)) * ih;
  const ticks = [];
  for (let v = yMin; v <= yMax + 1e-9; v += step) ticks.push(v);
  const series = players.map((p, idx) => ({
    id: p.id,
    name: p.name,
    color: CHART_COLORS[idx % CHART_COLORS.length],
    pts: points.map((pt, i) => [xAt(i), yAt(pt.totals[p.id] ?? 0)]),
  }));
  const every = points.length <= 9 ? 1 : Math.ceil(last / 8);
  const xLabels = points.map((pt, i) => ({
    x: xAt(i),
    label: pt.label,
    show: i === 0 || i === last || (i % every === 0 && last - i >= every),
  }));
  const targetY = target > 0 && target >= yMin && target <= yMax ? yAt(target) : null;
  return { ticks, yAt, xAt, series, xLabels, targetY, m, W, H };
}

function ScoreChart({ points, players, target, winnerIds }) {
  if (points.length < 2) return null;
  const W = 420;
  const H = 240;
  const c = computeChart(points, players, target, W, H, { l: 42, r: 14, t: 12, b: 26 });
  return (
    <div className="chart-wrap">
      <svg viewBox={`0 0 ${W} ${H}`} className="score-chart" role="img" aria-label="Courbes des scores par manche">
        {c.ticks.map((v) => (
          <g key={v}>
            <line x1={c.m.l} x2={W - c.m.r} y1={c.yAt(v)} y2={c.yAt(v)} className="chart-grid" />
            <text x={c.m.l - 6} y={c.yAt(v) + 3.5} textAnchor="end" className="chart-axis">{v}</text>
          </g>
        ))}
        {c.targetY !== null && (
          <g>
            <line x1={c.m.l} x2={W - c.m.r} y1={c.targetY} y2={c.targetY} className="chart-target" />
            <text x={c.m.l + 6} y={c.targetY - 4} textAnchor="start" className="chart-target-label">objectif {target}</text>
          </g>
        )}
        {c.xLabels.filter((l) => l.show).map((l, i) => (
          <text key={i} x={l.x} y={H - 8} textAnchor="middle" className="chart-axis">{l.label}</text>
        ))}
        {c.series.map((sr) => {
          const isWin = winnerIds.includes(sr.id);
          return (
            <g key={sr.id}>
              <polyline
                points={sr.pts.map((pt) => pt.join(",")).join(" ")}
                fill="none"
                stroke={sr.color}
                strokeWidth={isWin ? 3.2 : 2}
                strokeLinejoin="round"
                strokeLinecap="round"
              />
              {sr.pts.map((pt, i) => (
                <circle key={i} cx={pt[0]} cy={pt[1]} r={i === sr.pts.length - 1 ? 4 : 2.2} fill={sr.color} />
              ))}
            </g>
          );
        })}
      </svg>
      <div className="chart-legend">
        {players.map((p, i) => (
          <span key={p.id} className="legend-item">
            <span className="legend-dot" style={{ background: CHART_COLORS[i % CHART_COLORS.length] }} />
            {p.name}
          </span>
        ))}
      </div>
    </div>
  );
}

function buildShareText(R) {
  const lines = [`🎲 Le Rico — ${R.winnerNames.join(" & ")} gagne avec ${R.winnerScore} pts !`, ""];
  R.sorted.forEach((p, i) => {
    const medal = ["🥇", "🥈", "🥉"][i] || `${i + 1}.`;
    lines.push(`${medal} ${p.name} — ${p.total} pts${R.loserIds.includes(p.id) ? " 🥄" : ""}`);
  });
  lines.push("");
  R.statRows.forEach((r) => {
    if (r.value !== "—") lines.push(`${r.label} : ${r.value}`);
  });
  return lines.join("\n");
}

async function copyToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    await navigator.clipboard.writeText(text);
    return;
  }
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  const ok = document.execCommand("copy");
  document.body.removeChild(ta);
  if (!ok) throw new Error("copy failed");
}

function rrect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function fitText(ctx, text, maxW) {
  if (ctx.measureText(text).width <= maxW) return text;
  let t = text;
  while (t.length > 1 && ctx.measureText(t + "…").width > maxW) t = t.slice(0, -1);
  return t + "…";
}

// Draws the results (podium, score curves, stats) to a PNG for sharing.
async function renderShareImage(R, target, TH) {
  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
  } catch (e) {}
  const W = 1080, P = 64, innerW = W - P * 2;
  const FT = "'Righteous', 'Inter', sans-serif";
  const FB = "'Inter', 'Helvetica Neue', Arial, sans-serif";
  const n = R.sorted.length;
  const hasChart = R.curvePoints.length >= 2;
  // legend height depends on how many lines the player names need
  const scratch = document.createElement("canvas").getContext("2d");
  let legendLines = 1;
  if (scratch) {
    scratch.font = "28px " + FB;
    let lx0 = P;
    R.players.forEach((p) => {
      const itemW = 26 + 12 + scratch.measureText(p.name).width + 40;
      if (lx0 + itemW > W - P && lx0 > P) { lx0 = P; legendLines += 1; }
      lx0 += itemW;
    });
  }
  const headH = 340, rankH = 84, gap = 12, statH = 66;
  const chartTitleH = 84, chartH = 480, legendH = 50 + legendLines * 46, statsTitleH = 84, footerH = 120;
  const H =
    headH + n * (rankH + gap) +
    (hasChart ? chartTitleH + chartH + legendH : 0) +
    statsTitleH + R.statRows.length * (statH + gap) + footerH;

  const canvas = document.createElement("canvas");
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext("2d");

  ctx.fillStyle = TH.bg;
  ctx.fillRect(0, 0, W, H);
  const glow = (cx, cy, r, color) => {
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    g.addColorStop(0, color);
    g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  };
  glow(W * 0.2, H * 0.08, 700, `rgba(${TH.goldRgb},0.28)`);
  glow(W * 0.85, H * 0.2, 640, `rgba(${TH.purpleRgb},0.24)`);
  glow(W * 0.5, H * 0.95, 760, `rgba(${TH.tealRgb},0.14)`);

  // header
  ctx.textAlign = "center";
  ctx.textBaseline = "alphabetic";
  ctx.font = "90px " + FB;
  ctx.fillStyle = "#ffffff";
  ctx.fillText("🏆", W / 2, 130);
  ctx.font = "58px " + FT;
  ctx.fillStyle = TH.gold;
  ctx.shadowColor = `rgba(${TH.goldRgb},0.7)`;
  ctx.shadowBlur = 24;
  ctx.fillText(fitText(ctx, `${R.winnerNames.join(" & ")} gagne !`, innerW), W / 2, 222);
  ctx.shadowBlur = 0;
  ctx.font = "30px " + FB;
  ctx.fillStyle = TH.dim;
  ctx.fillText(`avec ${R.winnerScore} points`, W / 2, 288);

  let y = headH;

  // ranking
  R.sorted.forEach((p, i) => {
    const isWin = R.winnerIds.includes(p.id);
    const isLose = R.loserIds.includes(p.id);
    rrect(ctx, P, y, innerW, rankH, 20);
    ctx.fillStyle = isLose ? "rgba(224,122,109,0.14)" : `rgba(${TH.panelSoftRgb},0.7)`;
    ctx.fill();
    ctx.lineWidth = isWin ? 3 : 1.5;
    ctx.strokeStyle = isWin ? TH.gold : isLose ? "#ff4d6d" : `rgba(${TH.goldRgb},0.35)`;
    ctx.stroke();
    const cy = y + rankH / 2;
    ctx.textBaseline = "middle";
    ctx.textAlign = "left";
    ctx.font = "30px " + FB;
    ctx.fillStyle = TH.dim;
    ctx.fillText(String(i + 1), P + 28, cy);
    ctx.textAlign = "right";
    ctx.font = "40px " + FT;
    ctx.fillStyle = TH.gold;
    const scoreTxt = String(p.total);
    ctx.fillText(scoreTxt, W - P - 28, cy);
    const sw = ctx.measureText(scoreTxt).width;
    let rightEdge = W - P - 28 - sw - 20;
    if (isWin || isLose) {
      ctx.font = "34px " + FB;
      ctx.fillText(isWin ? "🏆" : "🥄", rightEdge, cy);
      rightEdge -= 56;
    }
    ctx.textAlign = "left";
    ctx.font = "600 34px " + FB;
    ctx.fillStyle = TH.chalk;
    ctx.fillText(fitText(ctx, p.name, rightEdge - (P + 84)), P + 84, cy);
    y += rankH + gap;
  });

  // score curves
  if (hasChart) {
    ctx.textBaseline = "alphabetic";
    ctx.textAlign = "left";
    ctx.font = "36px " + FT;
    ctx.fillStyle = TH.dim;
    ctx.fillText("Score par manche", P, y + 56);
    y += chartTitleH;
    const m = { l: 112, r: 46, t: 24, b: 60 };
    rrect(ctx, P, y, innerW, chartH, 20);
    ctx.fillStyle = `rgba(${TH.panelSoftRgb},0.55)`;
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = `rgba(${TH.goldRgb},0.35)`;
    ctx.stroke();

    const c = computeChart(R.curvePoints, R.players, target, innerW, chartH, m);
    ctx.save();
    ctx.translate(P, y);
    ctx.font = "22px " + FB;
    c.ticks.forEach((v) => {
      const yy = c.yAt(v);
      ctx.beginPath();
      ctx.moveTo(m.l, yy);
      ctx.lineTo(innerW - m.r, yy);
      ctx.strokeStyle = `rgba(${TH.chalkRgb},0.12)`;
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = TH.dim;
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      ctx.fillText(String(v), m.l - 12, yy);
    });
    if (c.targetY !== null) {
      ctx.setLineDash([14, 10]);
      ctx.beginPath();
      ctx.moveTo(m.l, c.targetY);
      ctx.lineTo(innerW - m.r, c.targetY);
      ctx.strokeStyle = TH.gold;
      ctx.lineWidth = 2.5;
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = TH.gold;
      ctx.textAlign = "left";
      ctx.textBaseline = "alphabetic";
      ctx.font = "bold 22px " + FB;
      ctx.fillText(`objectif ${target}`, m.l + 10, c.targetY - 8);
    }
    ctx.font = "22px " + FB;
    ctx.fillStyle = TH.dim;
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    c.xLabels.filter((l) => l.show).forEach((l) => ctx.fillText(l.label, l.x, chartH - 20));
    c.series.forEach((sr) => {
      const isWin = R.winnerIds.includes(sr.id);
      ctx.beginPath();
      sr.pts.forEach((pt, i) => (i === 0 ? ctx.moveTo(pt[0], pt[1]) : ctx.lineTo(pt[0], pt[1])));
      ctx.strokeStyle = sr.color;
      ctx.lineWidth = isWin ? 8 : 5;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      ctx.stroke();
      sr.pts.forEach((pt, i) => {
        ctx.beginPath();
        ctx.arc(pt[0], pt[1], i === sr.pts.length - 1 ? 10 : 6, 0, Math.PI * 2);
        ctx.fillStyle = sr.color;
        ctx.fill();
      });
    });
    ctx.restore();
    y += chartH;

    // legend
    ctx.font = "28px " + FB;
    ctx.textBaseline = "middle";
    ctx.textAlign = "left";
    let lx = P;
    let ly = y + 40;
    R.players.forEach((p, i) => {
      const color = CHART_COLORS[i % CHART_COLORS.length];
      const tw = ctx.measureText(p.name).width;
      const itemW = 26 + 12 + tw + 40;
      if (lx + itemW > W - P && lx > P) {
        lx = P;
        ly += 46;
      }
      ctx.beginPath();
      ctx.arc(lx + 13, ly, 11, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.fillStyle = TH.chalk;
      ctx.fillText(p.name, lx + 38, ly);
      lx += itemW;
    });
    y += legendH;
  }

  // stats
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  ctx.font = "36px " + FT;
  ctx.fillStyle = TH.dim;
  ctx.fillText("Statistiques de la partie", P, y + 56);
  y += statsTitleH;
  R.statRows.forEach((r) => {
    rrect(ctx, P, y, innerW, statH, 18);
    ctx.fillStyle = `rgba(${TH.panelSoftRgb},0.7)`;
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = `rgba(${TH.goldRgb},0.35)`;
    ctx.stroke();
    const cy = y + statH / 2;
    ctx.textBaseline = "middle";
    ctx.font = "25px " + FB;
    const labelW = Math.min(ctx.measureText(r.label).width, innerW * 0.5);
    ctx.textAlign = "left";
    ctx.fillStyle = TH.chalk;
    ctx.fillText(fitText(ctx, r.label, labelW), P + 26, cy);
    ctx.textAlign = "right";
    ctx.font = "28px " + FT;
    ctx.fillStyle = TH.gold;
    ctx.fillText(fitText(ctx, r.value, innerW - 52 - labelW - 24), W - P - 26, cy);
    y += statH + gap;
  });

  ctx.textAlign = "center";
  ctx.textBaseline = "alphabetic";
  ctx.font = "26px " + FB;
  ctx.fillStyle = TH.dim;
  ctx.fillText(`Le Rico · ${new Date().toLocaleDateString("fr-FR")}`, W / 2, y + 60);

  return new Promise((resolve) => canvas.toBlob((b) => resolve(b), "image/png"));
}

        <div className="ct-cell ct-corner" />

          <div key={c} className="ct-cell ct-colhead">

function computePlayerStats(players, history) {
  const byId = {};
  players.forEach((p) => { byId[p.id] = { id: p.id, name: p.name, points: [] }; });
  history.forEach((h) => {
    if (h.special) return;
    const player = players.find((p) => p.name === h.playerName);
    if (!player) return;
    byId[player.id].points.push(h.points);
  });
  return Object.values(byId).map((s) => {
    const count = s.points.length;
    const sum = s.points.reduce((a, b) => a + b, 0);
    return {
      name: s.name,
      count,
      best: count ? Math.max(...s.points) : 0,
      avg: count ? sum / count : 0,
      zeros: s.points.filter((v) => v === 0).length,
    };
  });
}

function pickExtreme(list, key, mode) {
  if (list.length === 0) return { names: [], value: 0 };
  const values = list.map((l) => l[key]);
  const target = mode === "max" ? Math.max(...values) : Math.min(...values);
  const names = list.filter((l) => l[key] === target).map((l) => l.name);
  return { names, value: target };
}

function computeSpecialEventStats(players, history) {
  const lossByName = {};
  const targetCountByName = {};
  players.forEach((p) => {
    lossByName[p.name] = 0;
    targetCountByName[p.name] = 0;
  });

  history.forEach((h) => {
    // Individual (non-general) Grosse Bite / Giclette surprises target exactly one player.
    if (h.partoozeBoosted && !h.partoozeGeneralRound && h.playerName in targetCountByName) {
      targetCountByName[h.playerName] += 1;
    }
    if (h.giclette && !h.gicletteGeneral && h.playerName in targetCountByName) {
      targetCountByName[h.playerName] += 1;
    }
    // GangBang and Duel entries carry structured targeting/loss data.
    if (h.targetedNames) {
      h.targetedNames.forEach((nm) => {
        if (nm in targetCountByName) targetCountByName[nm] += 1;
      });
    }
    if (h.lossByName) {
      Object.entries(h.lossByName).forEach(([nm, amount]) => {
        if (nm in lossByName) lossByName[nm] += amount;
      });
    }
  });

  return players.map((p) => ({
    name: p.name,
    lost: lossByName[p.name],
    targeted: targetCountByName[p.name],
  }));
}

function App() {

  const [turnBoost, setTurnBoost] = useState(false);

  const [duelStep, setDuelStep] = useState(null);

  const [duelManualInput, setDuelManualInput] = useState("");
  const [duelManualCost, setDuelManualCost] = useState("1");
  const [generalBoostRound, setGeneralBoostRound] = useState(false);
  const [gicletteActive, setGicletteActive] = useState(false);
  const [gicletteGeneralRound, setGicletteGeneralRound] = useState(false);
  const [gangbangRoundIndex, setGangbangRoundIndex] = useState(null);
  const [gangbangResolved, setGangbangResolved] = useState(false);
  const [gangbangResult, setGangbangResult] = useState(null);
  const [popupQueue, setPopupQueue] = useState([]);
  const activePopup = popupQueue[0] || null;

  // Deferred round events: decided at round start, revealed/applied at round end
  const [tournanteRoundIndex, setTournanteRoundIndex] = useState(null);
  const [tournanteResolved, setTournanteResolved] = useState(false);
  const [anulingusRoundIndex, setAnulingusRoundIndex] = useState(null);
  const [anulingusResolved, setAnulingusResolved] = useState(false);
  const [anulingusChooserId, setAnulingusChooserId] = useState(null);
  const [anulingusRoundNumber, setAnulingusRoundNumber] = useState(null);
  const [petiteBite, setPetiteBite] = useState(false);

  // Synchronous refs: multiple effects can fire in the same commit (e.g. when a
  // new round starts). React state set in one effect isn't visible to another
  // effect in that same commit, so round-exclusivity checks read these refs
  // instead, which update immediately.
  const generalBoostRoundRef = useRef(false);
  const gicletteGeneralRoundRef = useRef(false);
  const lastDecidedRoundRef = useRef(-1);
  const lastDecidedTurnRef = useRef(-1);
  // Set synchronously when an end-of-round resolution takes over the screen
  // (Anulingus). Effects declared after the resolution effect run in the SAME
  // commit and can't see the new phase yet, so they read this instead — without
  // it, a Duel rolled for the next turn would setPhase("duel") right on top of
  // the Anulingus screen and one of the two would vanish.
  const roundEndTakeoverRef = useRef(false);

  // Adaptive weights: an event that just fired becomes less likely next time,
  // and one that keeps missing out becomes more likely, so the same event
  // doesn't monopolise the game. Weight 1 = neutral.
  const roundWeightsRef = useRef({});
  const turnWeightsRef = useRef({});

  function weightedPick(pool, weightsRef, adaptiveKeys) {
    const isAdaptive = (k) => !adaptiveKeys || adaptiveKeys.includes(k);
    const weights = pool.map((k) => (isAdaptive(k) ? weightsRef.current[k] ?? 1 : 1));
    const total = weights.reduce((a, b) => a + b, 0);
    let r = Math.random() * total;
    let picked = pool[pool.length - 1];
    for (let i = 0; i < pool.length; i++) {
      r -= weights[i];
      if (r <= 0) {
        picked = pool[i];
        break;
      }
    }
    pool.forEach((k) => {
      if (!isAdaptive(k)) return;
      const cur = weightsRef.current[k] ?? 1;
      weightsRef.current[k] =
        k === picked ? Math.max(0.35, cur * 0.45) : Math.min(2.5, cur * 1.35);
    });
    return picked;
  }

  function setGeneralBoostRoundSync(v) {
    generalBoostRoundRef.current = v;
    setGeneralBoostRound(v);
  }
  function setGicletteGeneralRoundSync(v) {
    gicletteGeneralRoundRef.current = v;
    setGicletteGeneralRound(v);
  }

  const [tbPlayers, setTbPlayers] = useState([]);
  const [tbIndex, setTbIndex] = useState(0);
  const [tbScores, setTbScores] = useState({});
  const [tbHistory, setTbHistory] = useState([]);
  const [tbRound, setTbRound] = useState(1);

  const n = players.length;
  const currentIdx = n > 0 ? (startIndex + turnCount) % n : 0;
  const currentPlayer = players[currentIdx];

  function updatePlayerCount(delta) {
    const nc = Math.min(8, Math.max(2, playerCount + delta));
    setPlayerCount(nc);
    setNames((prev) => {
      const copy = [...prev];
      while (copy.length < nc) copy.push("");
      copy.length = nc;
      return copy;
    });
    if (startIndex >= nc) setStartIndex(0);
    setBoostedIndices((prev) => prev.filter((i) => i < nc));
  }

  const rowRefs = useRef([]);
  const dragIdxRef = useRef(null);
  const [dragIndex, setDragIndex] = useState(null);

  // Move the player at `from` to position `to`; the "Qui commence ?" choice and
  // the permanent Grosse Bite flags follow the player they belong to.
  function moveTo(from, to) {
    if (from === to) return;
    const remap = (k) => {
      if (k === from) return to;
      if (from < to && k > from && k <= to) return k - 1;
      if (from > to && k >= to && k < from) return k + 1;
      return k;
    };
    setNames((prev) => {
      const copy = [...prev];
      const [item] = copy.splice(from, 1);
      copy.splice(to, 0, item);
      return copy;
    });
    setStartIndex((k) => remap(k));
    setBoostedIndices((prev) => prev.map(remap));
  }

  function startDrag(e, i) {
    e.preventDefault();
    const count = playerCount;
    dragIdxRef.current = i;
    setDragIndex(i);
    document.body.style.userSelect = "none";
    document.body.style.webkitUserSelect = "none";

    const onMove = (ev) => {
      const y = ev.clientY;
      let target = dragIdxRef.current;
      const first = rowRefs.current[0]?.getBoundingClientRect();
      const last = rowRefs.current[count - 1]?.getBoundingClientRect();
      if (first && y < first.top) {
        target = 0;
      } else if (last && y > last.bottom) {
        target = count - 1;
      } else {
        for (let idx = 0; idx < count; idx++) {
          const r = rowRefs.current[idx]?.getBoundingClientRect();
          if (r && y >= r.top && y <= r.bottom) { target = idx; break; }
        }
      }
      if (target !== dragIdxRef.current) {
        moveTo(dragIdxRef.current, target);
        dragIdxRef.current = target;
        setDragIndex(target);
      }
    };
    const onUp = () => {
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
      window.removeEventListener("pointercancel", onUp);
      dragIdxRef.current = null;
      setDragIndex(null);
      document.body.style.userSelect = "";
      document.body.style.webkitUserSelect = "";
    };
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
    window.addEventListener("pointercancel", onUp);
  }

  function toggleBoostedSetup(i) {
    setBoostedIndices((prev) =>
      prev.includes(i) ? prev.filter((x) => x !== i) : [...prev, i]
    );
  }

  function updateDiceCount(delta) {
    setDiceCount((d) => Math.min(6, Math.max(5, d + delta)));
  }

  useEffect(() => {
    applyTheme(themeColors);
  }, [themeColors]);

  function setThemeColor(key, value) {
    setThemeColors((prev) => ({ ...prev, [key]: value }));
  }

  const ambianceFlags = {
    partoozeIndividual, partoozeGeneral, gicletteIndividual, gicletteGeneral, petiteBiteEnabled,
    duelEnabled, gangbangEnabled, tournanteEnabled, anulingusEnabled,
  };
  const activeAmbiance = AMBIANCES.find(
    (a) =>
      AMBIANCE_KEYS.every((k) => ambianceFlags[k] === a.on.includes(k)) &&
      (a.chance
        ? customChanceEnabled && customRoundChance === a.chance.round && customTurnChance === a.chance.turn
        : !customChanceEnabled)
  );

  function applyAmbiance(a) {
    setPartoozeIndividual(a.on.includes("partoozeIndividual"));
    setPartoozeGeneral(a.on.includes("partoozeGeneral"));
    setGicletteIndividual(a.on.includes("gicletteIndividual"));
    setGicletteGeneral(a.on.includes("gicletteGeneral"));
    setPetiteBiteEnabled(a.on.includes("petiteBiteEnabled"));
    setDuelEnabled(a.on.includes("duelEnabled"));
    setGangbangEnabled(a.on.includes("gangbangEnabled"));
    setTournanteEnabled(a.on.includes("tournanteEnabled"));
    setAnulingusEnabled(a.on.includes("anulingusEnabled"));
    if (a.chance) {

  function setAllPartouze(value) {
    setPartoozeIndividual(value);

  function startGame() {
    const trimmed = names.map((s) => s.trim());
    if (trimmed.some((s) => s.length === 0)) {
      setSetupError("Donne un nom à chaque joueur.");
      return;

      setSetupError("Le score à atteindre doit être supérieur à 0.");

    turnWeightsRef.current = {};

    lastDecidedTurnRef.current = -1;
    roundEndTakeoverRef.current = false;

    setRoundSnapshots([]);

    returnToRef.current = "home";

    setDecidedTurn(-1);
    setDecidedRound(-1);

    setGicletteGeneralRoundSync(false);

    setGangbangResolved(false);
    setGangbangResult(null);
    setTournanteRoundIndex(null);
    setTournanteResolved(false);
    setAnulingusRoundIndex(null);
    setAnulingusResolved(false);
    setAnulingusChooserId(null);
    setSurpriseBoost(false);
    setGicletteActive(false);
    setPetiteBite(false);
    setPopupQueue([]);

  }

  function goToSetupKeepConfig() {
    setConfirmReset(false);
    setSetupStep(1);
    setSetupError("");
    setPhase("setup");
  }

  function resetTurnState() {
    setTurnScore(0);
    setTurnAdds([]);
    setPool(diceCount);
    setManualInput("");
    setManualCost("1");
    setTurnBoost(false);
    setRevealSurprise(false);
    setButtonShake(false);
    setPetiteBite(false);
  }

  function addCombo(item) {
    setTurnScore((s) => s + item.points);
    setPool((p) => p - item.cost);
    setTurnAdds((a) => [...a, { label: item.label, points: item.points, cost: item.cost }]);
  }

  function addManual() {
    const v = parseInt(manualInput, 10);
    const c = parseInt(manualCost, 10);
    if (!v || v <= 0 || isNaN(c) || c < 0 || c > pool) return;
    setTurnScore((s) => s + v);
    setPool((p) => p - c);
    setTurnAdds((a) => [...a, { label: "Ajout libre", points: v, cost: c }]);
    setManualInput("");
    setManualCost("1");
  }

  function undoLastAdd() {
    setTurnAdds((a) => {
      if (a.length === 0) return a;
      const copy = [...a];
      const removed = copy.pop();
      setTurnScore((s) => s - removed.points);
      setPool((p) => p + removed.cost);
      return copy;
    });
  }

  function finalizeGame(playersArr) {
    const maxScore = Math.max(...playersArr.map((p) => p.total));
    const top = playersArr.filter((p) => p.total === maxScore);
    if (top.length === 1) {
      setWinner({ ids: [top[0].id], score: maxScore });
      setPhase("finished");
    } else {
      setTbPlayers(top.map((p) => p.id));
      setTbScores({});
      setTbIndex(0);
      setTbHistory([]);
      setTbRound(1);
      setPhase("tiebreak");
    }
  }

  function bankTurn(bust) {
    if (!currentPlayer) return;
    const base = bust ? 0 : turnScore;
    // Any form of Grosse Bite (permanent, the in-game checkbox, the individual
    // surprise, or a general round) cancels a Petite Bite that was rolled for
    // this turn — the two can never stack.
    const anyGrosseBite = currentPlayer.boost || turnBoost || surpriseBoost || generalBoostRound;
    const multiplier = !bust ? grosseBiteMultiplier(currentPlayer.boost, turnBoost, surpriseBoost) : 1;
    const boosted = base * multiplier;
    const halved = !bust && petiteBite && !anyGrosseBite;
    const points = halved ? Math.floor(boosted / 2) : boosted;
    const newTotal = currentPlayer.total + points;
    const updated = players.map((p) =>
      p.id === currentPlayer.id ? { ...p, total: newTotal } : p
    );
    setPlayers(updated);
    setHistory((h) => [
      ...h,
      {
        round: Math.floor(turnCount / n) + 1,
        playerName: currentPlayer.name,
        points,
        bust,
        total: newTotal,
        boosted: !bust && currentPlayer.boost,
        turnBoosted: !bust && turnBoost,
        partoozeBoosted: !bust && surpriseBoost,
        partoozeGeneralRound: !bust && surpriseBoost && generalBoostRound,
        giclette: gicletteActive,
        gicletteGeneral: gicletteActive && gicletteGeneralRound,
        petiteBite: halved,
        combos: bust ? [] : turnAdds.map((a) => ({ label: a.label, points: a.points, cost: a.cost })),
      },
    ]);
    if (halved) {
      showPopup(
        "red",
        "🤏",
        "PETITE BITE SURPRISE !",
        `Dommage ${currentPlayer.name} — ton score de ce tour était secrètement divisé par 2 : ${boosted} pts deviennent ${points} pts.`
      );
    }
    resetTurnState();

    // The game never ends right here: a round-ending event (Gangbang, Tournante,
    // Anulingus) can still move the scores. The end-of-game decision is taken
    // once the round and its events are fully resolved (see the end-of-round
    // effect below).
    const posInRound = turnCount % n;
    if (!triggered && newTotal >= target) {
      setTriggered(true);
      setTriggerInfo({ name: currentPlayer.name, score: newTotal });
      setTurnsLeftAfterTrigger(n - 1 - posInRound);
    } else if (triggered) {
      setTurnsLeftAfterTrigger(Math.max(0, turnsLeftAfterTrigger - 1));
    }
    if (posInRound === n - 1) {
      roundEndTakeoverRef.current = true;
      setRoundEndStage(1);
    }
    setTurnCount((c) => c + 1);
  }

  function openEditEntry(index) {
    const entry = history[index];
    if (!entry) return;
    setEditingIndex(index);
    setEditBust(entry.bust);
    setEditCombos(entry.combos ? entry.combos.map((c) => ({ ...c })) : []);
    setEditAdjustments(
      players.map((p) => ({ id: p.id, name: p.name, delta: "" }))
    );
    if (entry.duel) {
      setEditDuelP1(String(entry.duel.p1Score));
      setEditDuelP2(String(entry.duel.p2Score));
    } else {
      setEditDuelP1("");
      setEditDuelP2("");
    }
  }

  function cancelEditEntry() {
    setEditingIndex(null);
    setEditCombos([]);
    setEditBust(false);
    setEditManualInput("");
    setEditManualCost("1");
    setEditAdjustments([]);
    setEditDuelP1("");
    setEditDuelP2("");
  }

  function setEditAdjustment(id, value) {
    setEditAdjustments((list) =>
      list.map((a) => (a.id === id ? { ...a, delta: value } : a))
    );
  }

  // Re-score a past duel: undo the penalty that was applied, then apply the one
  // the corrected scores imply. Only the loser is ever debited.
  function saveDuelEdit() {
    const entry = history[editingIndex];
    if (!entry || !entry.duel) {
      cancelEditEntry();
      return;
    }
    const d = entry.duel;
    const p1 = Math.max(0, parseInt(editDuelP1, 10) || 0);
    const p2 = Math.max(0, parseInt(editDuelP2, 10) || 0);

    const newDiff = Math.abs(p1 - p2);
    let newLoserId = null;
    if (p1 > p2) newLoserId = d.opponentId;
    else if (p2 > p1) newLoserId = d.challengerId;

    const deltas = {};
    if (d.loserId !== null && d.diff > 0) deltas[d.loserId] = (deltas[d.loserId] || 0) + d.diff;
    if (newLoserId !== null && newDiff > 0) deltas[newLoserId] = (deltas[newLoserId] || 0) - newDiff;

    setPlayers((ps) =>
      ps.map((p) => (deltas[p.id] ? { ...p, total: p.total + deltas[p.id] } : p))
    );
    if (Object.keys(deltas).length > 0) shiftSnapshots(entry.round, deltas);

    const newLoserName =
      newLoserId === d.challengerId ? d.challengerName : newLoserId === d.opponentId ? d.opponentName : null;
    const newWinnerName =
      newLoserId === d.challengerId ? d.opponentName : newLoserId === d.opponentId ? d.challengerName : null;

    setHistory((h) =>
      h.map((e, i) =>
        i === editingIndex
          ? {
              ...e,
              edited: true,
              lossByName: newLoserName && newDiff > 0 ? { [newLoserName]: newDiff } : {},
              duel: { ...d, p1Score: p1, p2Score: p2, loserId: newLoserId, diff: newDiff },
              special:
                newDiff === 0
                  ? `🍆 Duel — égalité entre ${d.challengerName} (${p1}) et ${d.opponentName} (${p2}), personne ne perd de points`
                  : `🍆 Duel — ${d.challengerName} ${p1} vs ${d.opponentName} ${p2} : ${newLoserName} perd ${newDiff} pts face à ${newWinnerName}`,
            }
          : e
      )
    );
    cancelEditEntry();
  }
  function saveEventAdjustments() {
    const entry = history[editingIndex];
    if (!entry) {
      cancelEditEntry();
      return;
    }
    const applied = editAdjustments
      .map((a) => ({ ...a, n: parseInt(a.delta, 10) }))
      .filter((a) => !isNaN(a.n) && a.n !== 0);

    if (applied.length === 0) {
      cancelEditEntry();
      return;
    }

    setPlayers((ps) =>
      ps.map((p) => {
        const adj = applied.find((a) => a.id === p.id);
        return adj ? { ...p, total: p.total + adj.n } : p;
      })
    );
    shiftSnapshots(entry.round, Object.fromEntries(applied.map((a) => [a.id, a.n])));

    const summary = applied
      .map((a) => `${a.name} ${a.n > 0 ? "+" : ""}${a.n}`)
      .join(", ");

    setHistory((h) =>
      h.map((e, i) => (i === editingIndex ? { ...e, edited: true } : e))
    );
    setHistory((h) => [
      ...h,
      {
        round: entry.round,
        playerName: "Correction",
        points: 0,
        bust: false,
        special: `✏️ Rectification — ${summary}`,
      },
    ]);
    cancelEditEntry();
  }

  function addEditCombo(item) {
    setEditCombos((c) => [...c, { label: item.label, points: item.points, cost: item.cost }]);
  }

  function removeEditCombo(idx) {
    setEditCombos((c) => c.filter((_, i) => i !== idx));
  }

  function editPoolUsed() {
    return editCombos.reduce((s, c) => s + (c.cost || 0), 0);
  }

  function addEditManual() {
    const v = parseInt(editManualInput, 10);
    const c = parseInt(editManualCost, 10);
    const remaining = diceCount - editPoolUsed();
    if (!v || v <= 0 || isNaN(c) || c < 0 || c > remaining) return;
    setEditCombos((cs) => [...cs, { label: "Ajout libre", points: v, cost: c }]);
    setEditManualInput("");
    setEditManualCost("1");
  }

  // A correction to past scores must also be reflected in the curves.
  function shiftSnapshots(fromRound, deltasById) {
    setRoundSnapshots((prev) =>
      prev.map((sn) =>
        sn.round >= fromRound
          ? {
              ...sn,
              totals: Object.fromEntries(
                Object.entries(sn.totals).map(([id, v]) => [id, v + (deltasById[id] || 0)])
              ),
            }
          : sn
      )
    );
  }

  function saveEditEntry() {
    const index = editingIndex;
    const entry = history[index];
    if (!entry) { cancelEditEntry(); return; }
    const rawPoints = editBust ? 0 : editCombos.reduce((s, c) => s + c.points, 0);
    const multiplier = grosseBiteMultiplier(entry.boosted, entry.turnBoosted, entry.partoozeBoosted);
    const boostedPoints = rawPoints * multiplier;
    const finalPoints = editBust
      ? 0
      : entry.petiteBite
      ? Math.floor(boostedPoints / 2)
      : boostedPoints;
    const finalCombos = editBust ? [] : editCombos;
    const delta = finalPoints - entry.points;
    const playerName = entry.playerName;

    if (
      delta !== 0 ||
      editBust !== entry.bust ||
      JSON.stringify(finalCombos) !== JSON.stringify(entry.combos || [])
    ) {
      setHistory((h) =>
        h.map((e, i) => {
          if (i < index || e.playerName !== playerName) return e;
          if (i === index) {
            return { ...e, points: finalPoints, bust: editBust, total: e.total + delta, combos: finalCombos, edited: true };
          }
          return { ...e, total: e.total + delta };
        })
      );
      setPlayers((ps) =>
        ps.map((p) => (p.name === playerName ? { ...p, total: p.total + delta } : p))
      );
      const editedPlayer = players.find((p) => p.name === playerName);
      if (editedPlayer && delta !== 0) shiftSnapshots(entry.round, { [editedPlayer.id]: delta });
    }
    cancelEditEntry();
  }

  function instantWin() {
    if (!currentPlayer) return;
    setHistory((h) => [
      ...h,
      {
        round: Math.floor(turnCount / n) + 1,
        playerName: currentPlayer.name,
        points: 0,
        bust: false,
        total: currentPlayer.total,
        special: `${diceCount} dés identiques — victoire immédiate`,
      },
    ]);
    setWinner({ ids: [currentPlayer.id], score: currentPlayer.total });
    setConfirmInstantWin(false);
    setPhase("finished");
  }

  const tbCurrentId = tbPlayers[tbIndex];
  const tbCurrentPlayer = players.find((p) => p.id === tbCurrentId);

  function tbBank(bust) {
    const points = bust ? 0 : turnScore;
    setTbHistory((h) => [
      ...h,
      {
        round: tbRound,
        playerName: tbCurrentPlayer.name,
        points,
        bust,
        combos: bust ? [] : turnAdds.map((a) => ({ label: a.label, points: a.points, cost: a.cost })),
      },
    ]);
    resetTurnState();
    const nextIndex = tbIndex + 1;
    const scores = { ...tbScores, [tbCurrentId]: points };
    setTbScores(scores);
    if (nextIndex >= tbPlayers.length) {
      const maxScore = Math.max(...tbPlayers.map((id) => scores[id] ?? 0));
      const top = tbPlayers.filter((id) => (scores[id] ?? 0) === maxScore);
      if (top.length === 1) {
        setWinner({ ids: top, score: maxScore });
        setPhase("finished");
      } else {
        setTbPlayers(top);
        setTbScores({});
        setTbIndex(0);
        setTbRound((r) => r + 1);
      }
    } else {
      setTbIndex(nextIndex);
    }
  }

  const isTiebreak = phase === "tiebreak";
  const activePlayer = isTiebreak ? tbCurrentPlayer : currentPlayer;

  const currentRoundIndex = n > 0 ? Math.floor(turnCount / n) : 0;

  const ROUND_EVENT_CHANCE = customChanceEnabled
    ? Math.max(0, Math.min(1, customRoundChance / 100))
    : Math.min(0.30, 0.15 + Math.max(0, n - 2) * 0.015);
  const TURN_EVENT_CHANCE = customChanceEnabled
    ? Math.max(0, Math.min(1, customTurnChance / 100))
    : Math.min(0.25, 0.13 + Math.max(0, n - 2) * 0.012);

  function resolveGangbangRound(targetRoundNumber) {
    const entries = history.filter((h) => h.round === targetRoundNumber && !h.special);
    if (entries.length < n) return;
    const scoresByPlayer = {};
    entries.forEach((e) => {
      scoresByPlayer[e.playerName] = e.points;
    });
    const names = Object.keys(scoresByPlayer);
    if (names.length === 0) return;
    const minScore = Math.min(...names.map((nm) => scoresByPlayer[nm]));
    const loserNames = names.filter((nm) => scoresByPlayer[nm] === minScore);
    const loserIds = players.filter((p) => loserNames.includes(p.name)).map((p) => p.id);
    const winnerIds = players.filter((p) => !loserIds.includes(p.id)).map((p) => p.id);
    if (loserIds.length === 0 || winnerIds.length === 0) return;
    const penaltyPerLoser = 100 * winnerIds.length;
    const gainPerWinner = 100 * loserIds.length;
    setPlayers((ps) =>
      ps.map((p) => {
        if (loserIds.includes(p.id)) return { ...p, total: p.total - penaltyPerLoser };
        if (winnerIds.includes(p.id)) return { ...p, total: p.total + gainPerWinner };
        return p;
      })
    );
    setGangbangResult({
      loserNames,
      penaltyPerLoser,
      gainPerWinner,
      tie: loserNames.length > 1,
      round: targetRoundNumber,
    });
    setHistory((h) => [
      ...h,
      {
        round: targetRoundNumber,
        playerName: loserNames.join(", "),
        points: 0,
        bust: false,
        targetedNames: loserNames,
        lossByName: Object.fromEntries(loserNames.map((nm) => [nm, penaltyPerLoser])),
        special:
          loserNames.length > 1
            ? `💀 GangBang — égalité, chacun perd ${penaltyPerLoser} pts (100 pts par joueur)`
            : `💀 GangBang — perd ${penaltyPerLoser} pts (100 pts par joueur)`,
      },
    ]);
    if (loserNames.length > 1) {
      showPopup(
        "purple",
        "💀",
        "GANGBANG !",
        `Égalité sur le plus petit score entre ${loserNames.join(", ")} — chacun paie ${penaltyPerLoser} pts (100 pts à chaque autre joueur) !`
      );
    } else {
      showPopup(
        "purple",
        "💀",
        "GANGBANG !",
        `${loserNames[0]} avait le plus petit score de la manche et perd ${penaltyPerLoser} pts (100 pts à chaque joueur) !`
      );
    }
  }

  function resolveTournanteRound(targetRoundNumber) {
    const entries = history.filter((h) => h.round === targetRoundNumber && !h.special);
    if (entries.length < n) return;
    const scoreByName = {};
    entries.forEach((e) => {
      scoreByName[e.name || e.playerName] = e.points;
    });

    // Rotate: each player gives their round score to their left neighbour, i.e.
    // player i ends up keeping the score that player i-1 earned this round.
    const order = [...players.slice(startIndex), ...players.slice(0, startIndex)];
    const deltas = {};
    order.forEach((p, i) => {
      const giver = order[(i - 1 + order.length) % order.length];
      const own = scoreByName[p.name] ?? 0;
      const received = scoreByName[giver.name] ?? 0;
      deltas[p.id] = received - own;
    });

    setPlayers((ps) => ps.map((p) => ({ ...p, total: p.total + (deltas[p.id] || 0) })));

    const summary = order
      .map((p, i) => {
        const receiver = order[(i + 1) % order.length];
        return `${p.name} → ${receiver.name} (${scoreByName[p.name] ?? 0} pts)`;
      })
      .join(" · ");

    setHistory((h) => [
      ...h,
      {
        round: targetRoundNumber,
        playerName: "Tous",
        points: 0,
        bust: false,
        eventKind: "tournante",
        eventRound: targetRoundNumber,
        special: `🔄 Tout le Monde S'encule ! — les scores de la manche ont tourné : ${summary}`,
      },
    ]);

    showPopup(
      "purple",
      "🔄",
      "TOUT LE MONDE S'ENCULE !",
      `Surprise en fin de manche : chaque joueur donne son score de cette manche à son voisin de gauche. ${summary}`
    );
  }

  useEffect(() => {
    if (phase !== "playing" && phase !== "finished") return;
    if (gangbangRoundIndex !== null && !gangbangResolved && currentRoundIndex > gangbangRoundIndex) {
      setGangbangResolved(true);
      resolveGangbangRound(gangbangRoundIndex + 1);
    }
    if (tournanteRoundIndex !== null && !tournanteResolved && currentRoundIndex > tournanteRoundIndex) {
      setTournanteResolved(true);
      resolveTournanteRound(tournanteRoundIndex + 1);
    }
    if (anulingusRoundIndex !== null && !anulingusResolved && currentRoundIndex > anulingusRoundIndex) {
      setAnulingusResolved(true);
      const order = [...players.slice(startIndex), ...players.slice(0, startIndex)];
      const chooser = order[Math.floor(Math.random() * order.length)];
      if (chooser) {
        setAnulingusChooserId(chooser.id);
        setAnulingusRoundNumber(anulingusRoundIndex + 1);
        roundEndTakeoverRef.current = true;
        setPhase("anulingus");
        showPopup(
          "purple",
          "👅",
          "ANULINGUS !",
          `${chooser.name} est désigné en fin de manche : il peut échanger son score total avec le joueur de son choix… ou refuser.`
        );
      }
    }
    // All round-ending events have now been applied (or armed, for Anulingus):
    // the end-of-round check may proceed once their state updates are visible.
    setRoundEndStage((st) => (st === 1 ? 2 : st));
  }, [currentRoundIndex, phase]);

  // Round-level pool: at most one of these three can be active per round, and
  // the overall chance that ANY of them fires stays fixed regardless of how
  // many are enabled — enabling more options splits the same pie, it doesn't
  // add up on top of it.
  useEffect(() => {
    if (isTiebreak) {
      setGeneralBoostRoundSync(false);
      setGicletteGeneralRoundSync(false);
      if (gangbangRoundIndex !== null) setGangbangRoundIndex(null);
      return;
    }
    if (phase !== "playing" && phase !== "duel") return;
    // Next round's events wait until the end-of-round check is over.
    if (roundEndTakeoverRef.current) return;
    if (lastDecidedRoundRef.current === currentRoundIndex) return;
    lastDecidedRoundRef.current = currentRoundIndex;
    setDecidedRound(currentRoundIndex);

    const pool = [];
    if (partoozeGeneral) pool.push("general");
    if (gicletteGeneral) pool.push("gicletteGeneral");
    if (gangbangEnabled) pool.push("gangbang");
    if (tournanteEnabled) pool.push("tournante");
    if (anulingusEnabled) pool.push("anulingus");

    const clearDeferred = () => {
      if (tournanteRoundIndex !== currentRoundIndex) setTournanteRoundIndex(null);
      if (anulingusRoundIndex !== currentRoundIndex) setAnulingusRoundIndex(null);
    };

    if (pool.length === 0 || Math.random() >= ROUND_EVENT_CHANCE) {
      setGeneralBoostRoundSync(false);
      setGicletteGeneralRoundSync(false);
      if (gangbangRoundIndex !== currentRoundIndex) setGangbangRoundIndex(null);
      clearDeferred();
      return;
    }

    // All round events are adaptive: whichever fires gets damped, the others rise.
    const picked = weightedPick(pool, roundWeightsRef);
    setGeneralBoostRoundSync(picked === "general");
    setGicletteGeneralRoundSync(picked === "gicletteGeneral");
    if (picked === "gangbang") {
      setGangbangRoundIndex(currentRoundIndex);
      setGangbangResolved(false);
      setGangbangResult(null);
    } else if (gangbangRoundIndex !== null) {
      setGangbangRoundIndex(null);
    }

    // These two are decided now but stay completely silent until the round ends,
    // so they can't influence how anyone plays their turn.
    if (picked === "tournante") {
      setTournanteRoundIndex(currentRoundIndex);
      setTournanteResolved(false);
    } else if (tournanteRoundIndex !== currentRoundIndex) {
      setTournanteRoundIndex(null);
    }
    if (picked === "anulingus") {
      setAnulingusRoundIndex(currentRoundIndex);
      setAnulingusResolved(false);
    } else if (anulingusRoundIndex !== currentRoundIndex) {
      setAnulingusRoundIndex(null);
    }

    if (picked === "tournante" || picked === "anulingus") return;

    if (picked === "general") {
      showPopup(
        "gold",
        "🎊",
        "GROSSE BITE SURPRISE GÉNÉRALE !",
        "Cette manche, tous les joueurs jouent avec un score doublé (x2). Règle : il faut jouer la totalité de ses dés pour pouvoir valider son tour."
      );
    } else if (picked === "gicletteGeneral") {
      showPopup(
        "red",
        "⛓️",
        "GICLETTE GÉNÉRALE !",
        "Cette manche, chaque joueur ne fait qu'un seul lancer de tous ses dés (pas de mise de côté ni de relance). Il prend les combinaisons présentes sur ce lancer — plusieurs combinaisons possibles en même temps. Si rien ne score, le tour vaut 0."
      );
    } else {
      showPopup(
        "purple",
        "💀",
        "MANCHE GANGBANG !",
        "Chacun joue son tour normalement. À la fin de la manche, le(s) plus petit(s) score(s) paiera(ont) 100 pts à chaque autre joueur."
      );
    }
  }, [
    currentRoundIndex,
    phase,
    isTiebreak,
    partoozeGeneral,
    gicletteGeneral,
    gangbangEnabled,
    tournanteEnabled,
    anulingusEnabled,
    roundEndStage,
  ]);

  // Turn-level pool: same idea — at most one of these three per turn, overall
  // chance stays fixed, enabling more options only splits who gets picked.
  useEffect(() => {
    if (isTiebreak) {
      setSurpriseBoost(false);
      setGicletteActive(false);
      return;
    }
    if ((phase !== "playing" && phase !== "duel") || !activePlayer) return;
    // An end-of-round resolution (Anulingus) is claiming the screen in this same
    // commit. Don't decide this turn's event yet and don't consume the slot —
    // this effect re-runs once the phase returns to "playing".
    if (roundEndTakeoverRef.current) return;
    if (lastDecidedTurnRef.current === turnCount) return;
    lastDecidedTurnRef.current = turnCount;
    setDecidedTurn(turnCount);

    // A permanent Grosse Bite player is immune to Giclette and Petite Bite, and
    // a Grosse Bite surprise would be redundant (he's already x2) — but he stays
    // fully eligible for the Duel.
    const immune = activePlayer.boost;

    if (generalBoostRoundRef.current) {
      setSurpriseBoost(!immune);
      setGicletteActive(false);
      setPetiteBite(false);
      return;
    }
    if (gicletteGeneralRoundRef.current) {
      setSurpriseBoost(false);
      setGicletteActive(!immune);
      setPetiteBite(false);
      return;
    }

    const pool = [];
    if (partoozeIndividual && !immune) pool.push("grosseBite");
    if (gicletteIndividual && !immune) pool.push("giclette");
    if (petiteBiteEnabled && !immune) pool.push("petiteBite");
    if (duelEnabled && currentRoundIndex >= 1) pool.push("duel");

    if (pool.length === 0 || Math.random() >= TURN_EVENT_CHANCE) {
      setSurpriseBoost(false);
      setGicletteActive(false);
      setPetiteBite(false);
      return;
    }

    // Only the duel adapts here — Grosse Bite / Giclette / Petite Bite keep a
    // flat chance whether they fire or not.
    const picked = weightedPick(pool, turnWeightsRef, ["duel"]);
    setSurpriseBoost(picked === "grosseBite");
    setGicletteActive(picked === "giclette");
    setPetiteBite(picked === "petiteBite");

    if (picked === "giclette") {
      showPopup(
        "red",
        "⛓️",
        "GICLETTE !",
        `${activePlayer.name} ne fait qu'un seul lancer de tous ses dés ce tour (pas de mise de côté ni de relance) et prend les combinaisons présentes sur ce lancer — plusieurs combinaisons possibles en même temps. Si rien ne score, le tour vaut 0.`
      );
    } else if (picked === "duel") {
      setDuelChallengerId(activePlayer.id);
      setDuelOpponentId(null);
      setDuelP1Score(null);
      setDuelResult(null);
      resetDuelTurnState();
      setDuelStep("opponent");
      setPhase("duel");
      showPopup(
        "purple",
        "🍆",
        "DUEL SURPRISE !",
        `${activePlayer.name} est désigné et choisit son adversaire. Règle : le premier joue et s'arrête quand il veut, le second doit faire mieux — celui qui perd le duel perd l'écart de points sur son score principal (le gagnant, lui, ne gagne rien).`
      );
    }
    // "grosseBite" and "petiteBite" stay hidden — their popups fire later
    // (at reveal time in attemptBank, and after validation in bankTurn).
  }, [
    activePlayer?.id,
    turnCount,
    phase,
    isTiebreak,
    partoozeIndividual,
    gicletteIndividual,
    petiteBiteEnabled,
    duelEnabled,
    currentRoundIndex,
    generalBoostRound,
    gicletteGeneralRound,
    roundEndStage,
  ]);

  function cancelLastTurn(roundNumber) {
    setTriggered(false);
    setTurnsLeftAfterTrigger(0);
    setTriggerInfo(null);
    setHistory((h) => [
      ...h,
      {
        round: roundNumber,
        playerName: "Tous",
        points: 0,
        bust: false,
        special: `🛡️ Dernier tour annulé — plus personne n'atteint ${target} pts`,
      },
    ]);
    showPopup(
      "red",
      "🛡️",
      "DERNIER TOUR ANNULÉ !",
      `Plus personne n'atteint ${target} pts : la partie continue.`
    );
  }

  // End-of-round check and "last turn" cancellation.
  //  - During a round: if everyone who reached the target fell back under it
  //    (e.g. after a Duel), the last turn is cancelled.
  //  - At the end of a round, once its events are resolved and their popups
  //    dismissed: anyone at or above the target ends the game (even if nobody
  //    had reached it before); otherwise the game goes on.
  useEffect(() => {
    if (phase !== "playing") return;
    const anyAtTarget = players.some((p) => p.total >= target);

    if (roundEndStage !== 0) {
      if (roundEndStage !== 2 || popupQueue.length > 0) return;
      roundEndTakeoverRef.current = false;
      setRoundEndStage(0);
      setRoundSnapshots((prev) => [
        ...prev.filter((sn) => sn.round !== currentRoundIndex),
        { round: currentRoundIndex, totals: Object.fromEntries(players.map((pl) => [pl.id, pl.total])) },
      ]);
      if (anyAtTarget) {
        finalizeGame(players);
        return;
      }
      if (triggered) cancelLastTurn(currentRoundIndex);
      return;
    }

    if (triggered && !anyAtTarget) cancelLastTurn(currentRoundIndex + 1);
  }, [phase, players, roundEndStage, popupQueue.length, triggered, target]);

  useEffect(() => {
    if (phase !== "finished") return;
    if (gangbangRoundIndex !== null && !gangbangResolved) {
      setGangbangResolved(true);
      resolveGangbangRound(gangbangRoundIndex + 1);
    }
  }, [phase]);

  function attemptBank() {
    // Nothing scored: the only way out is the "Perdu" button.
    if (turnAdds.length === 0) return;
    if (isTiebreak) {
      tbBank(false);
      return;
    }
    const knownLock = activePlayer && (activePlayer.boost || turnBoost || generalBoostRound) && pool > 0;
    if (knownLock) return;
    if (surpriseBoost && pool > 0) {
      setRevealSurprise(true);
      setButtonShake(true);
      setTimeout(() => setButtonShake(false), 500);
      showPopup(
        "gold",
        "😲",
        "SURPRISE ! GROSSE BITE !",
        `${activePlayer?.name} était secrètement boosté x2 ce tour — il faut jouer tous les dés avant de valider !`
      );
      return;
    }
    // He used every die without ever learning he was boosted: reveal it now,
    // after the fact, so the doubled score doesn't come out of nowhere.
    if (surpriseBoost && pool === 0 && !revealSurprise) {
      if (activePlayer?.boost || turnBoost) {
        // he had already announced his own Grosse bite: the surprise brings nothing more (x2 max)
        showPopup(
          "gold",
          "🎉",
          "GROSSE BITE SURPRISE… EN DOUBLON !",
          `${activePlayer?.name} avait déjà annoncé sa Grosse bite : les multiplicateurs ne se cumulent pas, le score est doublé une seule fois — ${turnScore} pts deviennent ${turnScore * MAX_MULTIPLIER} pts (x2 maximum).`
        );
      } else {
        showPopup(
          "gold",
          "🎉",
          "GROSSE BITE SURPRISE !",
          `Sans le savoir, ${activePlayer?.name} jouait boosté x2 ce tour — et il a bien joué tous ses dés : ${turnScore} pts deviennent ${turnScore * MAX_MULTIPLIER} pts !`
        );
      }
    }
    bankTurn(false);
  }

  function showPopup(theme, emoji, title, message, onClose) {
    setPopupQueue((q) => [...q, { theme, emoji, title, message, onClose: onClose || null }]);
  }

  function dismissPopup() {
    const cb = activePopup?.onClose;
    setPopupQueue((q) => q.slice(1));
    if (cb) cb();
  }

  function resetDuelTurnState() {
    setDuelPool(diceCount);
    setDuelTurnScore(0);
    setDuelTurnAdds([]);
    setDuelManualInput("");
    setDuelManualCost("1");
  }

  function pickDuelOpponent(id) {
    setDuelOpponentId(id);
    resetDuelTurnState();
    setDuelStep("p1");
  }

  function addDuelCombo(item) {
    setDuelTurnScore((s) => s + item.points);
    setDuelPool((p) => p - item.cost);
    setDuelTurnAdds((a) => [...a, { label: item.label, points: item.points, cost: item.cost }]);
  }

  function addDuelManual() {
    const v = parseInt(duelManualInput, 10);
    const c = parseInt(duelManualCost, 10);
    if (!v || v <= 0 || isNaN(c) || c < 0 || c > duelPool) return;
    setDuelTurnScore((s) => s + v);
    setDuelPool((p) => p - c);
    setDuelTurnAdds((a) => [...a, { label: "Ajout libre", points: v, cost: c }]);
    setDuelManualInput("");
    setDuelManualCost("1");
  }

  function resolveDuel(p1Score, p2Score) {
    const diff = Math.abs(p1Score - p2Score);
    let winnerId = null;
    let loserId = null;
    if (p1Score > p2Score) {
      winnerId = duelChallengerId;
      loserId = duelOpponentId;
    } else if (p2Score > p1Score) {
      winnerId = duelOpponentId;
      loserId = duelChallengerId;
    }
    if (loserId !== null && diff > 0) {
      setPlayers((ps) => ps.map((p) => (p.id === loserId ? { ...p, total: p.total - diff } : p)));
    }
    setDuelResult({ winnerId, loserId, diff, p1Score, p2Score });

    const challengerName = players.find((p) => p.id === duelChallengerId)?.name;
    const opponentName = players.find((p) => p.id === duelOpponentId)?.name;
    const winnerName = players.find((p) => p.id === winnerId)?.name;
    const loserName = players.find((p) => p.id === loserId)?.name;
    const roundNumber = Math.floor(turnCount / n) + 1;

    setHistory((h) => [
      ...h,
      {
        round: roundNumber,
        playerName: `${challengerName} vs ${opponentName}`,
        points: 0,
        bust: false,
        targetedNames: [challengerName, opponentName],
        lossByName: loserName && diff > 0 ? { [loserName]: diff } : {},
        duel: {
          challengerId: duelChallengerId,
          opponentId: duelOpponentId,
          challengerName,
          opponentName,
          p1Score,
          p2Score,
          loserId,
          diff,
        },
        special:
          diff === 0
            ? `🍆 Duel — égalité entre ${challengerName} et ${opponentName}, personne ne perd de points`
            : `🍆 Duel — ${loserName} perd ${diff} pts face à ${winnerName}`,
      },
    ]);

    if (diff === 0) {
      showPopup("purple", "🤝", "ÉGALITÉ !", "Aucun gagnant, personne ne perd de points.", endDuel);
    } else {
      showPopup(
        "purple",
        "🍆",
        "RÉSULTAT DU DUEL !",
        `${winnerName} gagne ! ${loserName} perd ${diff} pts sur son score principal.`,
        endDuel
      );
    }
  }

  function finishDuelTurn(bust) {
    if (duelStep === "p1") {
      const player = players.find((p) => p.id === duelChallengerId);
      const mult = grosseBiteMultiplier(player?.boost, generalBoostRound);
      const score = bust ? 0 : duelTurnScore * mult;
      setDuelP1Score(score);
      resetDuelTurnState();
      setDuelStep("p2");
    } else if (duelStep === "p2") {
      const player = players.find((p) => p.id === duelOpponentId);
      const mult = grosseBiteMultiplier(player?.boost, generalBoostRound);
      const score = bust ? 0 : duelTurnScore * mult;
      resolveDuel(duelP1Score, score);
    }
  }

  function endDuel() {
    setDuelStep(null);
    setDuelChallengerId(null);
    setDuelOpponentId(null);
    setDuelP1Score(null);
    setDuelResult(null);
    setPhase("playing");
  }

  function confirmAnulingus(targetId) {
    const chooser = players.find((p) => p.id === anulingusChooserId);
    const targetPlayer = players.find((p) => p.id === targetId);
    if (!chooser || !targetPlayer) return;

    // Only the scores earned during THIS round are swapped, not the career
    // totals: each player's total is shifted by the difference between the two
    // round scores.
    const roundNumber = anulingusRoundNumber ?? (anulingusRoundIndex ?? 0) + 1;
    const roundScore = (name) =>
      history
        .filter((h) => h.round === roundNumber && !h.special && h.playerName === name)
        .reduce((s, h) => s + h.points, 0);

    const a = roundScore(chooser.name);
    const b = roundScore(targetPlayer.name);
    const delta = b - a;

    if (delta !== 0) {
      setPlayers((ps) =>
        ps.map((p) => {
          if (p.id === chooser.id) return { ...p, total: p.total + delta };
          if (p.id === targetPlayer.id) return { ...p, total: p.total - delta };
          return p;
        })
      );
    }
    setHistory((h) => [
      ...h,
      {
        round: roundNumber,
        playerName: `${chooser.name} ↔ ${targetPlayer.name}`,
        points: 0,
        bust: false,
        eventKind: "anulingus",
        special: `👅 Anulingus — ${chooser.name} échange son score de manche (${a} pts) avec ${targetPlayer.name} (${b} pts)`,
      },
    ]);
    setAnulingusChooserId(null);
    setAnulingusRoundNumber(null);
    // Don't clear anulingusRoundIndex here: the round-decision effect may have
    // already armed a NEW Anulingus for the round that just started, and wiping
    // it would silently cancel it. That effect clears stale indexes itself.
    // roundEndTakeoverRef stays set: the end-of-round check releases it.
    setPhase("playing");
    showPopup(
      "purple",
      "👅",
      "ÉCHANGE EFFECTUÉ !",
      `${chooser.name} repart avec ${b} pts pour cette manche et ${targetPlayer.name} avec ${a} pts.`
    );
  }

  function anulingusRoundScore(name) {
    if (!name) return 0;
    const roundNumber = anulingusRoundNumber ?? (anulingusRoundIndex ?? 0) + 1;
    return history
      .filter((h) => h.round === roundNumber && !h.special && h.playerName === name)
      .reduce((s, h) => s + h.points, 0);
  }

  function refuseAnulingus() {
    const chooser = players.find((p) => p.id === anulingusChooserId);
    setHistory((h) => [
      ...h,
      {
        round: (anulingusRoundIndex ?? 0) + 1,
        playerName: chooser ? chooser.name : "—",
        points: 0,
        bust: false,
        eventKind: "anulingus",
        special: `👅 Anulingus — ${chooser ? chooser.name : "Le joueur désigné"} a refusé l'échange`,
      },
    ]);
    setAnulingusChooserId(null);
    setAnulingusRoundNumber(null);
    // Don't clear anulingusRoundIndex here: the round-decision effect may have
    // already armed a NEW Anulingus for the round that just started, and wiping
    // it would silently cancel it. That effect clears stale indexes itself.
    // roundEndTakeoverRef stays set: the end-of-round check releases it.
    setPhase("playing");
  }

  // Everything the results screen (and the shared text/image) displays.
  function buildResults() {
    const winnerIds = winner ? winner.ids : [];
    const isWin = (pl) => (winnerIds.includes(pl.id) ? 1 : 0);
    const sorted = [...players].sort((a, b) => b.total - a.total || isWin(b) - isWin(a));
    const winnerNames = players.filter((p) => winnerIds.includes(p.id)).map((p) => p.name);
    const minScore = Math.min(...players.map((p) => p.total));
    const loserIds = players
      .filter((p) => p.total === minScore && !winnerIds.includes(p.id))
      .map((p) => p.id);

    // Score curve: start at 0, then the end of every round (+ a last point if the
    // game stopped mid-round, e.g. instant win).
    const curvePoints = [
      { label: "0", totals: Object.fromEntries(players.map((p) => [p.id, 0])) },
      ...roundSnapshots.map((sn) => ({ label: `M${sn.round}`, totals: sn.totals })),
    ];
    const lastPt = curvePoints[curvePoints.length - 1];
    if (players.some((p) => (lastPt.totals[p.id] ?? 0) !== p.total)) {
      const lastRound = roundSnapshots.length ? roundSnapshots[roundSnapshots.length - 1].round : 0;
      curvePoints.push({
        label: `M${lastRound + 1}`,
        totals: Object.fromEntries(players.map((p) => [p.id, p.total])),
      });
    }

    const playerStats = computePlayerStats(players, history);
    const playedStats = playerStats.filter((s) => s.count > 0);
    const bestTurn = pickExtreme(playerStats, "best", "max");
    const bestAvg = pickExtreme(playedStats, "avg", "max");
    const worstAvg = pickExtreme(playedStats, "avg", "min");
    const mostZeros = pickExtreme(playerStats, "zeros", "max");
    const specialStats = computeSpecialEventStats(players, history);
    const bocEmissaire = pickExtreme(specialStats, "lost", "max");
    const grossePute = pickExtreme(specialStats, "targeted", "max");

    // Lead stats, from the curve.
    const leadCounts = {};
    let lastSole = null;
    let leadChanges = 0;
    curvePoints.slice(1).forEach((pt) => {
      const max = Math.max(...players.map((p) => pt.totals[p.id] ?? 0));
      const leaders = players.filter((p) => (pt.totals[p.id] ?? 0) === max);
      if (leaders.length === players.length) return;
      leaders.forEach((p) => { leadCounts[p.name] = (leadCounts[p.name] || 0) + 1; });
      if (leaders.length === 1) {
        if (lastSole !== null && lastSole !== leaders[0].id) leadChanges += 1;
        lastSole = leaders[0].id;
      }
    });
    const longestLead = pickExtreme(
      Object.entries(leadCounts).map(([name, v]) => ({ name, v })),
      "v",
      "max"
    );

    const statRows = [
      {
        label: "🔥 Plus gros score en une manche",
        value: bestTurn.names.length ? `${bestTurn.names.join(" & ")} — ${bestTurn.value}` : "—",
      },
      {
        label: "📈 Meilleure moyenne",
        value: bestAvg.names.length ? `${bestAvg.names.join(" & ")} — ${Math.round(bestAvg.value)}` : "—",
      },
      {
        label: "📉 Plus faible moyenne",
        value: worstAvg.names.length ? `${worstAvg.names.join(" & ")} — ${Math.round(worstAvg.value)}` : "—",
      },
      {
        label: "💀 Plus de zéros",
        value:
          mostZeros.names.length && mostZeros.value > 0
            ? `${mostZeros.names.join(" & ")} — ${mostZeros.value}`
            : "—",
      },
      {
        label: "🎯 Bouc Émissaire",
        value:
          bocEmissaire.names.length && bocEmissaire.value > 0
            ? `${bocEmissaire.names.join(" & ")} — -${bocEmissaire.value} pts`
            : "—",
      },
      {
        label: "🍆 La Grosse Pute",
        value:
          grossePute.names.length && grossePute.value > 0
            ? `${grossePute.names.join(" & ")} — ${grossePute.value}x`
            : "—",
      },
      { label: "🎞️ Manches jouées", value: String(curvePoints.length - 1) },
      {
        label: "👑 Leader le plus longtemps",
        value: longestLead.names.length
          ? `${longestLead.names.join(" & ")} — ${longestLead.value} manche${longestLead.value > 1 ? "s" : ""}`
          : "—",
      },
      { label: "🔀 Changements de tête", value: leadChanges > 0 ? String(leadChanges) : "—" },
    ];

    return {
      players, sorted, winnerIds, winnerNames, winnerScore: winner?.score, loserIds, curvePoints, statRows,
    };
  }

  function flashShareToast(msg) {
    setShareToast(msg);
    setTimeout(() => setShareToast(""), 2600);
  }

  async function shareResults() {
    const R = buildResults();
    const text = buildShareText(R);
    try {
      if (shareBlob && navigator.canShare && typeof File !== "undefined") {
        const file = new File([shareBlob], "le-rico-resultats.png", { type: "image/png" });
        if (navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], text, title: "Le Rico" });
          return;
        }
      }
      if (navigator.share) {
        await navigator.share({ title: "Le Rico", text });
        return;
      }
      await copyToClipboard(text);
      flashShareToast("📋 Partage indisponible — résultats copiés !");
    } catch (e) {
      if (e && e.name === "AbortError") return;
      try {
        await copyToClipboard(text);
        flashShareToast("📋 Partage impossible — résultats copiés !");
      } catch (e2) {
        flashShareToast("Partage impossible sur cet appareil.");
      }
    }
  }

  // Pre-render the share image once the game is over, so the share button can
  // call navigator.share synchronously inside the tap (required on iOS).
  useEffect(() => {
    if (phase !== "finished") {
      setShareBlob(null);
      return;
    }
    let cancelled = false;
    renderShareImage(buildResults(), target, deriveTheme(themeColors).P)
      .then((b) => { if (!cancelled) setShareBlob(b); })
      .catch(() => {});
    return () => { cancelled = true; };
  }, [phase, winner]);

  // ---------------------------------------------------------------- saved games
