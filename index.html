  // A snapshot holds everything needed to resume a game exactly where it was (including the
  // surprises already drawn, so reloading can't be used to re-roll them).
  function snapshotGame() {
    return {
      v: 1,
      phase,
      settings: {
        playerCount, names, targetStr, startIndex, boostedIndices, diceCount,
        flags: {
          partoozeIndividual, partoozeGeneral, gicletteIndividual, gicletteGeneral, petiteBiteEnabled,
          duelEnabled, gangbangEnabled, tournanteEnabled, anulingusEnabled,
        },
        customChanceEnabled, customRoundChance, customTurnChance,
      },
      players, turnCount, history, triggered, turnsLeftAfterTrigger, triggerInfo, roundSnapshots, winner,
      roundEndStage,
      ev: {
        generalBoostRound, gicletteGeneralRound, gangbangRoundIndex, gangbangResolved, gangbangResult,
        tournanteRoundIndex, tournanteResolved, anulingusRoundIndex, anulingusResolved,
        anulingusChooserId, anulingusRoundNumber, surpriseBoost, gicletteActive, petiteBite,
      },
      duel: phase === "duel" ? { challengerId: duelChallengerId } : null,
      decided: { turn: decidedTurn, round: decidedRound },
      weights: { round: { ...roundWeightsRef.current }, turn: { ...turnWeightsRef.current } },
      hold: reopenHold,
    };
  }

  function gameSummary(status) {
    const R = status === "finished" ? buildResults() : null;
    return {
      players: players.map((p) => ({ name: p.name, total: p.total })),
      winnerNames: R ? R.winnerNames : [],
      winnerScore: R ? R.winnerScore : null,
      rounds: R ? R.curvePoints.length - 1 : currentRoundIndex + 1,
      target,
      diceCount,
      ambiance: activeAmbiance ? activeAmbiance.label : "Sur mesure",
    };
  }

  function persistGame(status) {
    const id = currentGameIdRef.current;
    if (!id) return;
    const prev = readGameRecord(id) || {};
    const data =
      status === "inprogress"
        ? { state: snapshotGame(), final: null }
        : { state: prev.state || null, final: snapshotGame() };
    saveGameRecord(id, { status, summary: gameSummary(status) }, data);
  }

  function restoreGame(snap, opts = {}) {
    const s = snap.settings;
    const ev = snap.ev;
    const hold = opts.hold !== undefined ? opts.hold : snap.hold || null;
    const pendingHold = !!(hold && hold.pendingStage);
    const viewOnly = !!opts.viewOnly;

    setPlayerCount(s.playerCount);
    setNames(s.names);
    setTargetStr(s.targetStr);
    setStartIndex(s.startIndex);
    setBoostedIndices(s.boostedIndices);
    setDiceCount(s.diceCount);
    setPartoozeIndividual(s.flags.partoozeIndividual);
    setPartoozeGeneral(s.flags.partoozeGeneral);
    setGicletteIndividual(s.flags.gicletteIndividual);
    setGicletteGeneral(s.flags.gicletteGeneral);
    setPetiteBiteEnabled(s.flags.petiteBiteEnabled);
    setDuelEnabled(s.flags.duelEnabled);
    setGangbangEnabled(s.flags.gangbangEnabled);
    setTournanteEnabled(s.flags.tournanteEnabled);
    setAnulingusEnabled(s.flags.anulingusEnabled);
    setCustomChanceEnabled(s.customChanceEnabled);
    setCustomRoundChance(s.customRoundChance);
    setCustomTurnChance(s.customTurnChance);

    setPlayers(snap.players);
    setTurnCount(snap.turnCount);
    setHistory(snap.history);
    setTriggered(snap.triggered);
    setTurnsLeftAfterTrigger(snap.turnsLeftAfterTrigger);
    setTriggerInfo(snap.triggerInfo);
    setRoundSnapshots(snap.roundSnapshots);
    setWinner(snap.winner);
    setRoundEndStage(pendingHold ? 3 : snap.roundEndStage);

    setGeneralBoostRoundSync(ev.generalBoostRound);
    setGicletteGeneralRoundSync(ev.gicletteGeneralRound);
    setGangbangRoundIndex(ev.gangbangRoundIndex);
    setGangbangResolved(viewOnly ? true : ev.gangbangResolved);
    setGangbangResult(ev.gangbangResult);
    setTournanteRoundIndex(ev.tournanteRoundIndex);
    setTournanteResolved(ev.tournanteResolved);
    setAnulingusRoundIndex(ev.anulingusRoundIndex);
    setAnulingusResolved(ev.anulingusResolved);
    setAnulingusChooserId(ev.anulingusChooserId);
    setAnulingusRoundNumber(ev.anulingusRoundNumber);
    setSurpriseBoost(ev.surpriseBoost);
    setGicletteActive(ev.gicletteActive);
    setPetiteBite(ev.petiteBite);

    lastDecidedTurnRef.current = snap.decided.turn;
    lastDecidedRoundRef.current = snap.decided.round;
    setDecidedTurn(snap.decided.turn);
    setDecidedRound(snap.decided.round);
    roundWeightsRef.current = { ...snap.weights.round };
    turnWeightsRef.current = { ...snap.weights.turn };
    roundEndTakeoverRef.current = pendingHold || (!hold && snap.roundEndStage !== 0);

    // a restored turn always starts from scratch (the surprise for it is already decided)
    setTurnScore(0);
    setTurnAdds([]);
    setPool(s.diceCount);
    setManualInput("");
    setManualCost("1");
    setTurnBoost(false);
    setRevealSurprise(false);
    setButtonShake(false);
    setPopupQueue([]);
    setEditingIndex(null);
    setConfirmInstantWin(false);
    setConfirmReset(false);
    if (snap.duel && !hold) {
      setDuelChallengerId(snap.duel.challengerId);
      setDuelOpponentId(null);
      setDuelP1Score(null);
      setDuelResult(null);
      resetDuelTurnState();
      setDuelStep("opponent");
    } else {
      setDuelStep(null);
    }

    currentGameIdRef.current = opts.id || null;
    viewOnlyRef.current = viewOnly;
    setReopenHold(hold);
    setPhase(hold ? "playing" : snap.phase);
  }

  function resumeGame(id) {
    const rec = readGameRecord(id);
    if (!rec || !rec.state) return;
    returnToRef.current = "home";
    restoreGame(rec.state, { id });
  }

  function viewGame(id) {
    const rec = readGameRecord(id);
    if (!rec || !rec.final) return;
    returnToRef.current = "history";
    restoreGame(rec.final, { id, viewOnly: true });
  }

  // Re-open a finished game just before its ending, so a wrong entry can be corrected.
  function reopenGame(id) {
    const rec = readGameRecord(id);
    if (!id || !rec || !rec.state) return;
    const idx = readGamesIndex().find((g) => g.id === id);
    const hold = { pendingStage: rec.state.roundEndStage > 0 ? 2 : 0 };
    const state = { ...rec.state, hold };
    saveGameRecord(id, { status: "inprogress", summary: idx ? idx.summary : {} }, { state, final: null });
    restoreGame(state, { id, hold });
  }

  function releaseReopenHold() {
    const hold = reopenHold;
    setReopenHold(null);
    if (hold && hold.pendingStage) {
      // the end-of-round check runs again (takeover stays set until it is done)
      setRoundEndStage(hold.pendingStage);
    } else {
      roundEndTakeoverRef.current = false;
    }
  }

  function goHome() {
    setConfirmReset(false);
    setPhase("home");
  }

  function abandonGame() {
    if (currentGameIdRef.current) deleteGameRecord(currentGameIdRef.current);
    currentGameIdRef.current = null;
    goHome();
  }

  function wizardNext() {
    if (setupStep === 1) {
      if (names.map((s) => s.trim()).some((s) => s.length === 0)) {
        setSetupError("Donne un nom à chaque joueur.");
        return;
      }
      setSetupError("");
      setSetupStep(2);
    } else if (setupStep === 2) {
      if (!target || target <= 0) {
        setSetupError("Le score à atteindre doit être supérieur à 0.");
        return;
      }
      setSetupError("");
      setSetupStep(3);
    }
  }

  function wizardBack() {
    setSetupError("");
    if (setupStep === 1) setPhase("home");
    else setSetupStep(setupStep - 1);
  }

  // Autosave the game in progress whenever it is in a consistent, resumable state.
  useEffect(() => {
    if (viewOnlyRef.current || !currentGameIdRef.current) return;
    const savable =
      phase === "playing" || phase === "anulingus" || (phase === "duel" && duelStep === "opponent");
    if (!savable) return;
    const consistent =
      roundEndStage !== 0 || (decidedTurn === turnCount && decidedRound === currentRoundIndex);
    if (!consistent) return;
    persistGame("inprogress");
  }, [
    phase, players, history, turnCount, roundSnapshots, triggered, triggerInfo, roundEndStage,
    decidedTurn, decidedRound, surpriseBoost, gicletteActive, petiteBite, generalBoostRound,
    gicletteGeneralRound, gangbangRoundIndex, gangbangResolved, tournanteRoundIndex,
    tournanteResolved, anulingusRoundIndex, anulingusResolved, anulingusChooserId, duelStep, reopenHold,
  ]);

  // When a game ends, keep its final state for the results screen (the last autosave stays
  // available as the "before the end" checkpoint used to correct and resume it).
  useEffect(() => {
    if (phase !== "finished" || viewOnlyRef.current || !currentGameIdRef.current) return;
    persistGame("finished");
  }, [phase]);

  if (phase === "home") {
    const inProgress = readGamesIndex().find((g) => g.status === "inprogress");
    return (
      <div className="app">
        <div className="phone">
          <div className="setup-card home-card">
            <div className="home-top">
              <button className="icon-btn" aria-label="Thème" onClick={() => setShowTheme(true)}>🎨</button>
            </div>
            <div className="home-hero">
              <div className="home-dice" aria-hidden="true">
                <DieSvg face={6} size={46} color="var(--gold)" rot={-10} />
                <DieSvg face={1} size={46} color="var(--teal)" rot={6} />
                <DieSvg face={5} size={46} color="var(--purple)" rot={-4} />
              </div>
              <h1 className="home-title">Le Rico</h1>
              <p className="home-sub">Le jeu de dés de soirée</p>
            </div>
            <div className="home-menu">
              {inProgress && (
                <button className="home-btn resume" onClick={() => resumeGame(inProgress.id)}>
                  ▶ Reprendre la partie en cours
                  <small>
                    {inProgress.summary.players.map((p) => p.name).join(", ")} · manche {inProgress.summary.rounds}
                  </small>
                </button>
              )}
              <button
                className="home-btn primary"
                onClick={() => {
                  setSetupStep(1);
                  setSetupError("");
                  setPhase("setup");
                }}
              >
                🎲 Nouvelle partie
              </button>
              <button className="home-btn" onClick={() => setPhase("history")}>📚 Historique</button>
              <button className="home-btn" onClick={() => setPhase("rules")}>📖 Règles du jeu</button>
            </div>
          </div>
        </div>

        {showTheme && (
          <div className="edit-modal-overlay" onClick={() => setShowTheme(false)}>
            <div className="share-modal theme-modal" onClick={(e) => e.stopPropagation()}>
              <div className="theme-modal-head">
                <div className="features-panel-title">🎨 Thème</div>
                <button className="edit-modal-close" aria-label="Fermer" onClick={() => setShowTheme(false)}>✕</button>
              </div>
              <div className="theme-swatches">
                {THEME_PRESETS.map((t) => (
                  <button
                    key={t.id}
                    className={"theme-chip" + (sameColors(t.colors, themeColors) ? " active" : "")}
                    onClick={() => setThemeColors({ ...t.colors })}
                  >
                    <span className="theme-dots">
                      {["bg", "gold", "purple", "teal"].map((k) => (
                        <span key={k} className="theme-dot" style={{ background: t.colors[k] }} />
                      ))}
                    </span>
                    {t.name}
                  </button>
                ))}
              </div>
              <button className="bulk-btn ghost" onClick={() => setShowThemeEditor((v) => !v)}>
                {showThemeEditor ? "Masquer la personnalisation" : "Personnaliser"}
              </button>
              {showThemeEditor && (
                <div>
                  <div className="theme-pickers">
                    {THEME_FIELDS.map(([key, label]) => (
                      <label key={key} className="theme-picker">
                        <span>{label}</span>
                        <input type="color" value={themeColors[key]} onChange={(e) => setThemeColor(key, e.target.value)} />
                      </label>
                    ))}
                  </div>
                  <div className="theme-actions">
                    <button className="bulk-btn ghost" onClick={() => setThemeColors({ ...DEFAULT_THEME })}>Réinitialiser</button>
                  </div>
                  <p className="custom-chance-hint">
                    Les autres couleurs (cartes, halos, boutons) se calculent à partir de ces cinq-là. Choisis un fond sombre pour garder des textes lisibles. Ton thème est mémorisé sur cet appareil.
                  </p>
                </div>
              )}
            </div>
          </div>
        )}
      </div>
    );
  }

  if (phase === "rules") {
    return <RulesScreen onBack={goHome} />;
  }

  if (phase === "history") {
    const games = readGamesIndex();
    return (
      <div className="app">
        <div className="phone">
          <div className="setup-card">
            <div className="wizard-head">
              <button className="ghost-btn" onClick={goHome} aria-label="Retour à l’accueil">←</button>
              <div className="wizard-title">Historique</div>
              <span className="wizard-count">{games.length}/{MAX_SAVED_GAMES}</span>
            </div>
            {games.length === 0 && (
              <p className="history-empty-state">Aucune partie enregistrée pour le moment. Les 10 dernières parties apparaîtront ici.</p>
            )}
            {games.map((g) => {
              const sm = g.summary;
              const finished = g.status === "finished";
              const ranking = [...sm.players].sort((a, b) => b.total - a.total);
              return (
                <div className="game-card" key={g.id}>
                  <div className="game-card-top">
                    <span className="game-date">{fmtGameDate(g.updatedAt)}</span>
                    <span className={"game-status " + g.status}>{finished ? "Terminée" : "En cours"}</span>
                  </div>
                  {finished && (
                    <div className="game-winner">🏆 {sm.winnerNames.join(" & ")} — {sm.winnerScore} pts</div>
                  )}
                  <div className="game-players">
                    {ranking.map((p) => `${p.name} ${p.total}`).join(" · ")}
                  </div>
                  <div className="game-meta">
                    {finished ? `${sm.rounds} manche${sm.rounds > 1 ? "s" : ""}` : `manche ${sm.rounds}`} · objectif {sm.target} · {sm.diceCount} dés · {sm.ambiance}
                  </div>
                  {confirmDeleteId === g.id ? (
                    <div className="game-actions">
                      <span className="game-confirm">Supprimer cette partie ?</span>
                      <button
                        className="mini-btn"
                        onClick={() => {
                          deleteGameRecord(g.id);
                          setConfirmDeleteId(null);
                          setGamesTick((t) => t + 1);
                        }}
                      >Oui</button>
                      <button className="mini-btn ghost" onClick={() => setConfirmDeleteId(null)}>Non</button>
                    </div>
                  ) : (
                    <div className="game-actions">
                      {finished ? (
                        <>
                          <button className="mini-btn" onClick={() => viewGame(g.id)}>Résultats</button>
                          <button className="mini-btn ghost" onClick={() => reopenGame(g.id)}>✏️ Corriger</button>
                        </>
                      ) : (
                        <button className="mini-btn" onClick={() => resumeGame(g.id)}>▶ Reprendre</button>
                      )}
                      <button className="mini-btn ghost danger" aria-label="Supprimer" onClick={() => setConfirmDeleteId(g.id)}>🗑</button>
                    </div>
                  )}
                </div>
              );
            })}
            <div className="wizard-nav">
              <button className="primary-btn" onClick={goHome}>← Accueil</button>
            </div>
          </div>
        </div>
      </div>
    );
  }

  if (phase === "setup") {
    const stepTitles = ["Joueurs", "Paramètres", "Mode Partouze"];
    return (
      <div className="app">
        <div className="phone">
          <div className="setup-card">
            <div className="wizard-head">
              <button className="ghost-btn" onClick={wizardBack} aria-label="Retour">←</button>
              <div className="wizard-title">{stepTitles[setupStep - 1]}</div>
              <div className="wizard-dots" aria-label={`Étape ${setupStep} sur 3`}>
                {[1, 2, 3].map((i) => (
                  <span key={i} className={"wizard-dot" + (i === setupStep ? " active" : i < setupStep ? " done" : "")} />
                ))}
              </div>
            </div>

            {setupStep === 1 && (
              <>
                <div className="field">
                  <label>Nombre de joueurs</label>
                  <div className="stepper">
                    <button onClick={() => updatePlayerCount(-1)}>−</button>
                    <span>{playerCount}</span>
                    <button onClick={() => updatePlayerCount(1)}>+</button>
                  </div>
                </div>

                <div className="field">
                  <label>Noms des joueurs</label>
                  <div className="names-grid">
                    {names.map((nm, i) => (
                      <div
                        className={"name-row" + (dragIndex === i ? " dragging" : "")}
                        key={i}
                        ref={(el) => { rowRefs.current[i] = el; }}
                      >
                        <span className="name-rank">{i + 1}</span>
                        <input
                          value={nm}
                          placeholder={`Joueur ${i + 1}`}
                          onChange={(e) => {
                            const copy = [...names];
                            copy[i] = e.target.value;
                            setNames(copy);
                          }}
                        />
                        <button
                          className="drag-handle"
                          aria-label={`Déplacer ${nm.trim() || `Joueur ${i + 1}`} (glisser, ou flèches haut/bas)`}
                          onPointerDown={(e) => startDrag(e, i)}
                          onKeyDown={(e) => {
                            if (e.key === "ArrowUp" && i > 0) { e.preventDefault(); moveTo(i, i - 1); }
                            if (e.key === "ArrowDown" && i < names.length - 1) { e.preventDefault(); moveTo(i, i + 1); }
                          }}
                        >⠿</button>
                      </div>
                    ))}
                  </div>
                  <p className="order-hint">Glisse la poignée ⠿ pour changer l'ordre de jeu (1 = premier à jouer, sauf si tu choisis un autre joueur pour commencer).</p>
                </div>
              </>
            )}

            {setupStep === 2 && (
              <>
                <div className="field">
                  <label>Nombre de dés (5 ou 6)</label>
                  <div className="stepper">
                    <button onClick={() => updateDiceCount(-1)}>−</button>
                    <span>{diceCount}</span>
                    <button onClick={() => updateDiceCount(1)}>+</button>
                  </div>
                </div>

                <div className="field">
                  <label>Score à atteindre</label>
                  <input
                    type="text"
                    inputMode="numeric"
                    pattern="[0-9]*"
                    className="target-input"
                    value={targetStr}
                    placeholder="3000"
                    onChange={(e) => setTargetStr(e.target.value.replace(/[^0-9]/g, ""))}
                  />
                </div>

                <div className="field">
                  <label>Qui commence ?</label>
                  <div className="starter-row">
                    {names.map((nm, i) => (
                      <button
                        key={i}
                        className={"starter-chip" + (startIndex === i ? " active" : "")}
                        onClick={() => setStartIndex(i)}
                      >
                        {nm.trim() || `Joueur ${i + 1}`}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="field">
                  <label>🍆 Grosse bite sur toute la partie (score x2 chaque manche)</label>
                  <div className="starter-row">
                    {names.map((nm, i) => (
                      <button
                        key={i}
                        className={"starter-chip boost-chip" + (boostedIndices.includes(i) ? " active" : "")}
                        onClick={() => toggleBoostedSetup(i)}
                      >
                        {nm.trim() || `Joueur ${i + 1}`}
                      </button>
                    ))}
                  </div>
                </div>
              </>
            )}

            {setupStep === 3 && (
              <div className="features-panel flat">
                <div className="features-panel-head">
                  <p className="ambiance-label">Ambiance</p>
                  <div className="features-bulk">
                    <button className="bulk-btn" onClick={() => setAllPartouze(true)}>Tout cocher</button>
                    <button className="bulk-btn ghost" onClick={() => setAllPartouze(false)}>Tout décocher</button>
                  </div>
                </div>

                <div className="ambiance-block">
                  <div className="ambiance-grid">
                    {AMBIANCES.map((a) => (
                      <button
                        key={a.id}
                        className={"ambiance-chip" + (activeAmbiance && activeAmbiance.id === a.id ? " active" : "")}
                        onClick={() => applyAmbiance(a)}
                      >
                        <span className="ambiance-icon">{a.icon}</span>
                        <span>{a.label}</span>
                      </button>
                    ))}
                  </div>
                  <p className="ambiance-desc">
                    {activeAmbiance
                      ? activeAmbiance.desc
                      : "Réglage sur mesure : tu as modifié les cases ci-dessous. Choisis une ambiance pour repartir d'un préréglage."}
                  </p>
                </div>

                <div className="partouze-grid">
                  <label className="checkbox-field">
                    <input type="checkbox" checked={partoozeIndividual} onChange={() => setPartoozeIndividual((m) => !m)} />
                    Grosse Bite Surprise Individuelle
                  </label>
                  <label className="checkbox-field">
                    <input type="checkbox" checked={partoozeGeneral} onChange={() => setPartoozeGeneral((m) => !m)} />
                    Grosse Bite Surprise Générale
                  </label>
                  <label className="checkbox-field">
                    <input type="checkbox" checked={gicletteIndividual} onChange={() => setGicletteIndividual((m) => !m)} />
                    Giclette Individuelle
                  </label>
                  <label className="checkbox-field">
                    <input type="checkbox" checked={gicletteGeneral} onChange={() => setGicletteGeneral((m) => !m)} />
                    Giclette Générale
                  </label>
                  <label className="checkbox-field">
                    <input type="checkbox" checked={petiteBiteEnabled} onChange={() => setPetiteBiteEnabled((m) => !m)} />
                    Petite Bite Surprise
                  </label>
                  <label className="checkbox-field">
                    <input type="checkbox" checked={duelEnabled} onChange={() => setDuelEnabled((m) => !m)} />
                    Qui a la Plus Grosse ?
                  </label>
                  <label className="checkbox-field">
                    <input type="checkbox" checked={gangbangEnabled} onChange={() => setGangbangEnabled((m) => !m)} />
                    GangBang
                  </label>
                  <label className="checkbox-field">
                    <input type="checkbox" checked={tournanteEnabled} onChange={() => setTournanteEnabled((m) => !m)} />
                    Tout le Monde S'encule !
                  </label>
                  <label className="checkbox-field">
                    <input type="checkbox" checked={anulingusEnabled} onChange={() => setAnulingusEnabled((m) => !m)} />
                    Anulingus
                  </label>
                </div>

                <div className="field custom-chance-field">
                  <label className="checkbox-field">
                    <input type="checkbox" checked={customChanceEnabled} onChange={() => setCustomChanceEnabled((m) => !m)} />
                    🎚️ Mode sur mesure (régler les probabilités moi-même)
                  </label>
                  {customChanceEnabled && (
                    <div className="custom-chance-controls">
                      <div className="custom-chance-row">
                        <span className="custom-chance-label">Généraux (par manche)</span>
                        <div className="stepper small">
                          <button onClick={() => updateRoundChance(-5)}>−</button>
                          <span>{customRoundChance}%</span>
                          <button onClick={() => updateRoundChance(5)}>+</button>
                        </div>
                      </div>
                      <div className="custom-chance-row">
                        <span className="custom-chance-label">Individuels (par tour)</span>
                        <div className="stepper small">
                          <button onClick={() => updateTurnChance(-5)}>−</button>
                          <span>{customTurnChance}%</span>
                          <button onClick={() => updateTurnChance(5)}>+</button>
                        </div>
                      </div>
                      <p className="custom-chance-hint">
                        Ce pourcentage est la chance globale qu'un événement se déclenche ; il se partage ensuite équitablement entre les features cochées ci-dessus.
                      </p>
                    </div>
                  )}
                </div>
              </div>
            )}

            {setupError && <div className="error">{setupError}</div>}

            <div className="wizard-nav">
              {setupStep < 3 ? (
                <button className="primary-btn" onClick={wizardNext}>Suivant →</button>
              ) : (
                <button className="primary-btn start-btn" onClick={startGame}>🎲 Lancer la partie</button>
              )}
            </div>
          </div>
        </div>
      </div>
    );
  }

  if (phase === "finished") {
    const R = buildResults();
    const { sorted, winnerIds, winnerNames, loserIds } = R;
    const canReopen = !!(currentGameIdRef.current && (readGameRecord(currentGameIdRef.current) || {}).state);

    return (
      <div className="app">
        <div className="phone">
          <div className="finished-card">
            <div className="results-head">
              <button
                className="ghost-btn results-back"
                aria-label={returnToRef.current === "history" ? "Retour à l’historique" : "Retour à l’accueil"}
                onClick={() => setPhase(returnToRef.current === "history" ? "history" : "home")}
              >
                ← {returnToRef.current === "history" ? "Historique" : "Accueil"}
              </button>
            </div>
            <div className="trophy">🏆</div>
            <h1>{winnerNames.join(" & ")} gagne !</h1>
            <p className="subtitle">avec {R.winnerScore} points</p>
            <div className="ranking">
              {sorted.map((p, i) => {
                const isWinner = winnerIds.includes(p.id);
                const isLoser = loserIds.includes(p.id);
                return (
                  <div
                    key={p.id}
                    className={"rank-row" + (isWinner ? " win" : "") + (isLoser ? " lose" : "")}
                  >
                    <span className="rank-pos">{i + 1}</span>
                    <span className="rank-name">{p.name}</span>
                    {isWinner && <span className="rank-icon gold">🏆</span>}
                    {isLoser && <span className="rank-icon lose-badge">🥄 lanterne rouge</span>}
                    <span className="rank-score">{p.total}</span>
                  </div>
                );
              })}
            </div>

            {R.curvePoints.length >= 2 && (
              <>
                <div className="stats-title">Score par manche</div>
                <ScoreChart points={R.curvePoints} players={players} target={target} winnerIds={winnerIds} />
              </>
            )}

            <div className="stats-title">Statistiques de la partie</div>
            <div className="ranking">
              {R.statRows.map((row) => (
                <div className="stat-row" key={row.label}>
                  <span className="stat-label">{row.label}</span>
                  <span className="stat-value">{row.value}</span>
                </div>
              ))}
            </div>

            <div className="wizard-nav finish-nav">
              <button className="primary-btn" onClick={goToSetupKeepConfig}>🔄 Nouvelle partie</button>
            </div>

            <div className="share-actions">
              <button className="primary-btn" onClick={shareResults}>
                📤 Partager les résultats
              </button>
              <div className="share-toast" role="status">{shareToast}</div>
            </div>

            {canReopen && (
              <button className="ghost-btn reopen-btn" onClick={() => reopenGame(currentGameIdRef.current)}>
                ✏️ Corriger la partie
              </button>
            )}
          </div>
        </div>

      </div>
    );
  }

  if (phase === "duel") {
    const challenger = players.find((p) => p.id === duelChallengerId);
    const opponent = players.find((p) => p.id === duelOpponentId);

    return (
      <div className="app">
        <div className="phone">
          <div className="topbar">
            <div className="topbar-left">
              <span>🍆</span>
              <span>Qui a la plus grosse</span>
            </div>
          </div>

          <div className="setup-card">
            {duelStep === "opponent" && (
              <>
                <h1>🍆 Qui a la plus grosse</h1>
                <p className="subtitle">
                  Duel surprise ! {challenger?.name} est désigné — il défie qui ?
                </p>
                <div className="pick-list">
                  {players.filter((p) => p.id !== duelChallengerId).map((p) => (
                    <button key={p.id} className="pick-row" onClick={() => pickDuelOpponent(p.id)}>
                      <span className="pick-name">{p.name}</span>
                      <span className="pick-score">{p.total} pts</span>
                    </button>
                  ))}
                </div>
                <p className="pick-self">
                  Ton score actuel : <b>{challenger?.total} pts</b>
                </p>
              </>
            )}

            {(duelStep === "p1" || duelStep === "p2") && (
              <>
                <h1>Duel : {challenger?.name} vs {opponent?.name}</h1>
                <p className="subtitle">
                  {duelStep === "p1"
                    ? `Au tour de ${challenger?.name} — s'arrête quand il veut`
                    : `Au tour de ${opponent?.name} — doit dépasser ${duelP1Score} pts`}
                </p>
                {(duelStep === "p1" ? challenger : opponent)?.boost && (
                  <div className="giclette-info">
                    <span className="giclette-chain">🍆</span>
                    Grosse bite permanente : le score de ce duel sera doublé (x2) pour {(duelStep === "p1" ? challenger : opponent)?.name}.
                  </div>
                )}
                {generalBoostRound && !(duelStep === "p1" ? challenger : opponent)?.boost && (
                  <div className="giclette-info">
                    <span className="giclette-chain">🎊</span>
                    Manche Grosse Bite Surprise GÉNÉRALE en cours : le score de ce duel est doublé (x2) pour {(duelStep === "p1" ? challenger : opponent)?.name}.
                  </div>
                )}
                {gicletteGeneralRound && (
                  <div className="giclette-info">
                    <span className="giclette-chain">⛓️</span>
                    Manche Giclette GÉNÉRALE en cours (informatif, aucun impact sur ce duel).
                  </div>
                )}

                <PoolIndicator pool={duelPool} diceCount={diceCount} />
                <div className="turn-score">{duelTurnScore} pts ce tour</div>

                <ComboTable pool={duelPool} onAdd={addDuelCombo} diceCount={diceCount} />
                <TurnBreakdown adds={duelTurnAdds} />

                <div className="manual-row">
                  <input
                    type="number"
                    className="manual-points"
                    placeholder="Points"
                    value={duelManualInput}
                    onChange={(e) => setDuelManualInput(e.target.value)}
                  />
                  <input
                    type="number"
                    className="manual-cost"
                    placeholder="Dés"
                    value={duelManualCost}
                    min={0}
                    max={duelPool}
                    onChange={(e) => setDuelManualCost(e.target.value)}
                  />
                  <button className="chip manual-add" onClick={addDuelManual}>➕</button>
                </div>

                <div className="footer-actions-spacer" />
                <div className="footer-actions">
                  <button className="danger-btn" onClick={() => finishDuelTurn(true)}>
                    Perdu (0)
                  </button>
                  <button
                    className="primary-btn"
                    disabled={duelTurnAdds.length === 0}
                    onClick={() => finishDuelTurn(false)}
                  >
                    S'arrêter ici
                  </button>
                </div>
              </>
            )}
          </div>
        </div>
        <EventPopup popup={activePopup} onDismiss={dismissPopup} />
      </div>
    );
  }

  if (phase === "anulingus") {
    const chooser = players.find((p) => p.id === anulingusChooserId);
    return (
      <div className="app">
        <div className="phone">
          <div className="topbar">
            <div className="topbar-left">
              <span>👅</span>
              <span>Anulingus</span>
            </div>
          </div>

          <div className="setup-card">
            <h1>👅 Anulingus</h1>
            <p className="subtitle">
              {chooser?.name} est désigné en fin de manche : il peut échanger son
              <b> score de cette manche</b> avec le joueur de son choix… ou refuser.
            </p>

            <div className="pick-list-label">Scores de la manche qui vient de se terminer</div>
            <div className="pick-list">
              {players.filter((p) => p.id !== anulingusChooserId).map((p) => (
                <button key={p.id} className="pick-row" onClick={() => confirmAnulingus(p.id)}>
                  <span className="pick-name">{p.name}</span>
                  <span className="pick-score">{anulingusRoundScore(p.name)} pts</span>
                </button>
              ))}
            </div>

            <p className="pick-self">
              Ton score sur cette manche : <b>{anulingusRoundScore(chooser?.name)} pts</b>
            </p>

            <button className="danger-btn anulingus-refuse" onClick={refuseAnulingus}>
              Refuser l'échange
            </button>
          </div>
        </div>
        <EventPopup popup={activePopup} onDismiss={dismissPopup} />
      </div>
    );
  }

  return (
    <div className="app">
      <div className="phone">
        <div className="topbar">
          <div className="topbar-left">
            <span>🎲</span>
            <span>Objectif {target}</span>
          </div>
          {!isTiebreak && <div className="topbar-right">Manche {Math.floor(turnCount / n) + 1}</div>}
          <button className="ghost-btn" aria-label="Accueil" onClick={() => setConfirmReset(true)}>🏠</button>
        </div>

        {confirmReset && (
          <div className="banner warn">
            Quitter la partie ? Elle est sauvegardée : tu pourras la reprendre depuis l'accueil.
            <span className="banner-actions">
              <button className="mini-btn" onClick={goHome}>Accueil</button>
              <button className="mini-btn ghost danger" onClick={abandonGame}>Abandonner</button>
              <button className="mini-btn ghost" onClick={() => setConfirmReset(false)}>Annuler</button>
            </span>
          </div>
        )}

        {triggered && !isTiebreak && (
          <div className="banner gold">
            🏆 {triggerInfo.name} a atteint l'objectif ({triggerInfo.score} pts). Les autres joueurs de la manche peuvent se défendre.
          </div>
        )}

        {isTiebreak && (
          <div className="banner gold">
            🛡️ Égalité ! Départage n°{tbRound} :{" "}
            {players.filter((p) => tbPlayers.includes(p.id)).map((p) => p.name).join(", ")}
          </div>
        )}

        {!isTiebreak && generalBoostRound && (
          <div className="round-event-chip gold">🍆 Grosse Bite</div>
        )}

        {!isTiebreak && gicletteGeneralRound && (
          <div className="round-event-chip red">⛓️ Giclette</div>
        )}

        {!isTiebreak && gangbangRoundIndex === currentRoundIndex && (
          <div className="round-event-chip purple">💀 GangBang</div>
        )}

        <div className="player-strip">
          {[...players.slice(startIndex), ...players.slice(0, startIndex)].map((p) => {
            const isCurrent = isTiebreak ? p.id === tbCurrentId : p.id === currentPlayer?.id;
            const isTbPlayer = isTiebreak && tbPlayers.includes(p.id);
            if (isTiebreak && !isTbPlayer) return null;
            return (
              <div key={p.id} className={"player-card" + (isCurrent ? " current" : "") + (p.boost ? " boosted" : "")}>
                <div className="player-name">{p.name}</div>
                <div className="player-score">{isTiebreak ? tbScores[p.id] ?? "—" : p.total}</div>
                {!isTiebreak && <DiceTrail total={p.total} target={target} />}
                {!isTiebreak && p.boost && <div className="boost-badge">🍆 grosse bite — x2</div>}
              </div>
            );
          })}
        </div>

        {reopenHold && (
          <div className="turn-card hold-card">
            <div className="turn-head">
              <span>✏️ <strong>Partie rouverte</strong></span>
            </div>
            <p className="hold-text">
              Corrige les scores dans l'historique (✏️ à droite de chaque tour), puis valide pour {reopenHold.pendingStage ? "vérifier si la partie est vraiment terminée" : "reprendre la partie"}.
            </p>
            <button className="primary-btn hold-btn" onClick={releaseReopenHold}>
              {reopenHold.pendingStage ? "✅ Vérifier la fin de partie" : "▶ Reprendre la partie"}
            </button>
          </div>
        )}

        {!reopenHold && (
        <div className="turn-card">
          <div className="turn-head">
            <span>Au tour de <strong>{activePlayer?.name}</strong></span>
            {triggered && !isTiebreak && (
              <span className="defense-badge">🛡️ défense</span>
            )}
          </div>

          <PoolIndicator pool={pool} diceCount={diceCount} />

          {activePlayer && (activePlayer.boost || turnBoost || generalBoostRound) && pool > 0 && (
            <div className={"boost-lock-note" + (generalBoostRound ? " general" : "")}>
              {generalBoostRound
                ? `🎊 Manche Grosse Bite Surprise GÉNÉRALE : tout le monde joue boosté x2 — il faut jouer les ${diceCount} dés avant de valider (${pool} restant${pool > 1 ? "s" : ""})`
                : `🍆 Tour grosse bite : il faut jouer les ${diceCount} dés avant de valider (${pool} restant${pool > 1 ? "s" : ""})`}
            </div>
          )}
          {!isTiebreak && gicletteActive && !gicletteGeneralRound && (
            <div className="giclette-info">
              <span className="giclette-chain">⛓️</span>
              Giclette : un seul lancer, pas de mise de côté ni de relance — prends les combinaisons présentes dessus, sinon c'est 0.
            </div>
          )}

          <div className="turn-score">{turnScore} pts ce tour</div>
          {!isTiebreak && activePlayer && (() => {
            const mult = grosseBiteMultiplier(activePlayer.boost, turnBoost, generalBoostRound);
            return (
              <div className="turn-potential">
                → total potentiel : <strong>{activePlayer.total + turnScore * mult}</strong>
                {mult > 1 && <span className="boost-tag">🍆 x{mult}</span>}
              </div>
            );
          })()}

          {!isTiebreak && (
            <label className={"turn-boost-checkbox" + (turnBoost ? " active" : "")}>
              <input
                type="checkbox"
                checked={turnBoost}
                onChange={(e) => setTurnBoost(e.target.checked)}
              />
              🍆 Tour grosse bite (x2 sur ce tour)
            </label>
          )}

          <ComboTable pool={pool} onAdd={addCombo} diceCount={diceCount} />
          <TurnBreakdown adds={turnAdds} />

          <div className="manual-row">
            <input
              type="number"
              className="manual-points"
              placeholder="Points"
              value={manualInput}
              onChange={(e) => setManualInput(e.target.value)}
            />
            <input
              type="number"
              className="manual-cost"
              placeholder="Dés"
              value={manualCost}
              min={0}
              max={pool}
              onChange={(e) => setManualCost(e.target.value)}
            />
            <button className="chip manual-add" onClick={addManual}>➕</button>
          </div>

          <div className="turn-actions-secondary">
            <button className="mini-btn ghost" onClick={undoLastAdd}>↩ Annuler</button>
            <button className="mini-btn ghost" onClick={resetTurnState}>Réinitialiser</button>
          </div>

          {!isTiebreak && diceCount >= 5 && !confirmInstantWin && (
            <button className="instant-win-btn" onClick={() => setConfirmInstantWin(true)}>
              ✨ {diceCount} dés identiques — victoire immédiate
            </button>
          )}
          {!isTiebreak && diceCount >= 5 && confirmInstantWin && (
            <div className="banner warn">
              Confirmer la victoire de {currentPlayer?.name} ?
              <span className="banner-actions">
                <button className="mini-btn" onClick={instantWin}>Oui</button>
                <button className="mini-btn ghost" onClick={() => setConfirmInstantWin(false)}>Annuler</button>
              </span>
            </div>
          )}
        </div>
        )}

        <div className="history">
          <div className="history-title">Historique</div>
          <div className="history-list">
            {[...(isTiebreak ? tbHistory : history)].reverse().map((h, i) => {
              const realIndex = isTiebreak ? null : history.length - 1 - i;
              const isEditing = !isTiebreak && editingIndex === realIndex;
              return (
                <div key={i} className="history-row">
                  <div className="history-row-top">
                    <span className="history-round">M{h.round}</span>
                    <span className="history-name">{h.playerName}</span>
                    <span className="history-points">
                      {h.special ? h.special : h.bust ? "Perdu" : `+${h.points} pts`}
                    </span>
                    {h.boosted ? (
                      <span className="boost-tag">🍆 x2</span>
                    ) : h.turnBoosted ? (
                      <span className="boost-tag">🍆 tour x2</span>
                    ) : h.partoozeGeneralRound ? (
                      <span className="boost-tag partouze">🎊 grosse bite surprise générale x2</span>
                    ) : (
                      h.partoozeBoosted && <span className="boost-tag partouze">🎉 grosse bite surprise x2</span>
                    )}
                    {h.gicletteGeneral ? (
                      <span className="boost-tag giclette">⛓️ giclette générale</span>
                    ) : (
                      h.giclette && <span className="boost-tag giclette">⛓️ giclette</span>
                    )}
                    {h.petiteBite && <span className="boost-tag giclette">🤏 petite bite ÷2</span>}
                    {"total" in h && <span className="history-total">→ {h.total}</span>}
                    {!isTiebreak && (
                      <button className="edit-btn" onClick={() => openEditEntry(realIndex)} title="Rectifier">
                        ✏️
                      </button>
                    )}
                  </div>
                  {h.edited && <span className="edited-tag">rectifié</span>}
                  {h.combos && h.combos.length > 0 && (
                    <div className="history-combos">
                      {h.combos.map((c, ci) => (
                        <span key={ci} className="combo-tag small">
                          {c.label} <b>+{c.points}</b>
                        </span>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}
            {(isTiebreak ? tbHistory : history).length === 0 && (
              <div className="history-empty">Aucun tour joué.</div>
            )}
          </div>
        </div>

        {!isTiebreak && revealSurprise && pool > 0 && (
          <div className="boost-lock-note surprise">
            😲 Surprise ! Grosse bite surprise individuelle révélée — il faut jouer les {diceCount} dés avant de valider ({pool} restant{pool > 1 ? "s" : ""})
          </div>
        )}

        {!reopenHold && (
        <>
        <div className="footer-actions-spacer" />
        <div className="footer-actions">
          <button className="danger-btn" onClick={() => (isTiebreak ? tbBank(true) : bankTurn(true))}>
            Perdu (0)
          </button>
          <button
            className={"primary-btn" + (buttonShake ? " shake" : "")}
            disabled={
              turnAdds.length === 0 ||
              (activePlayer && (activePlayer.boost || turnBoost || generalBoostRound) && pool > 0) ||
              (!isTiebreak && revealSurprise && pool > 0)
            }
            onClick={attemptBank}
          >
            Valider le tour
          </button>
        </div>
        </>
        )}
      </div>
      <EventPopup popup={activePopup} onDismiss={dismissPopup} />

      {editingIndex !== null && (() => {
        const entry = history[editingIndex];
        if (!entry) return null;
        const isDuel = !!entry.duel;
        const isEvent = !!entry.special && !isDuel;
        return (
          <div className="edit-modal-overlay" onClick={cancelEditEntry}>
            <div className="edit-modal" onClick={(e) => e.stopPropagation()}>
              <div className="edit-modal-head">
                <div className="edit-modal-title">
                  ✏️ Rectifier — M{entry.round} · {entry.playerName}
                </div>
                <button className="edit-modal-close" onClick={cancelEditEntry}>✕</button>
              </div>

              <div className="edit-modal-body">
                {isDuel ? (
                  <>
                    <p className="edit-modal-hint">
                      Corrige les scores du duel. L'écart est recalculé automatiquement
                      et seul le perdant est débité.
                    </p>
                    <div className="adjust-list">
                      <div className="adjust-row">
                        <span className="adjust-name">{entry.duel.challengerName}</span>
                        <input
                          type="number"
                          className="adjust-input"
                          value={editDuelP1}
                          onChange={(e) => setEditDuelP1(e.target.value)}
                        />
                      </div>
                      <div className="adjust-row">
                        <span className="adjust-name">{entry.duel.opponentName}</span>
                        <input
                          type="number"
                          className="adjust-input"
                          value={editDuelP2}
                          onChange={(e) => setEditDuelP2(e.target.value)}
                        />
                      </div>
                    </div>
                    {(() => {
                      const a = Math.max(0, parseInt(editDuelP1, 10) || 0);
                      const b = Math.max(0, parseInt(editDuelP2, 10) || 0);
                      const diff = Math.abs(a - b);
                      const loser =
                        a > b ? entry.duel.opponentName : b > a ? entry.duel.challengerName : null;
                      return (
                        <p className="edit-modal-hint duel-preview">
                          {diff === 0
                            ? "Égalité — personne ne perd de points."
                            : `${loser} perdra ${diff} pts.`}
                        </p>
                      );
                    })()}
                  </>
                ) : isEvent ? (
                  <>
                    <p className="edit-modal-hint">
                      Événement : {entry.special}
                    </p>
                    <p className="edit-modal-hint">
                      Corrige directement les totaux. Saisis un écart (ex. <b>-100</b> ou <b>250</b>)
                      pour chaque joueur concerné, laisse vide pour ne rien changer.
                    </p>
                    <div className="adjust-list">
                      {editAdjustments.map((a) => (
                        <div key={a.id} className="adjust-row">
                          <span className="adjust-name">{a.name}</span>
                          <input
                            type="number"
                            className="adjust-input"
                            placeholder="0"
                            value={a.delta}
                            onChange={(e) => setEditAdjustment(a.id, e.target.value)}
                          />
                        </div>
                      ))}
                    </div>
                  </>
                ) : (
                  <>
                    <label className="edit-bust-toggle">
                      <input
                        type="checkbox"
                        checked={editBust}
                        onChange={(e) => setEditBust(e.target.checked)}
                      />
                      Perdu (0 pts)
                    </label>

                    {!editBust && (
                      <>
                        {(entry.boosted || entry.turnBoosted || entry.partoozeBoosted || entry.petiteBite) && (
                          <div className="edit-mult-note">
                            {entry.petiteBite
                              ? "🤏 Petite Bite (÷2) conservée pour ce tour"
                              : `🍆 multiplicateur x${grosseBiteMultiplier(entry.boosted, entry.turnBoosted, entry.partoozeBoosted)} conservé pour ce tour`}
                          </div>
                        )}

                        {editCombos.length > 0 && (
                          <div className="edit-combos-list">
                            {editCombos.map((c, ci) => (
                              <span key={ci} className="combo-tag small removable">
                                {c.label} <b>+{c.points}</b>
                                <button className="combo-remove" onClick={() => removeEditCombo(ci)}>✕</button>
                              </span>
                            ))}
                          </div>
                        )}

                        <div className="edit-pool-text">
                          {diceCount - editPoolUsed()}/{diceCount} dés disponibles pour ce tour
                        </div>

                        <ComboTable pool={diceCount - editPoolUsed()} onAdd={addEditCombo} diceCount={diceCount} />

                        <div className="manual-row edit-manual-add">
                          <input
                            type="number"
                            className="manual-points"
                            placeholder="Points"
                            value={editManualInput}
                            onChange={(e) => setEditManualInput(e.target.value)}
                          />
                          <input
                            type="number"
                            className="manual-cost"
                            placeholder="Dés"
                            value={editManualCost}
                            min={0}
                            max={diceCount - editPoolUsed()}
                            onChange={(e) => setEditManualCost(e.target.value)}
                          />
                          <button className="chip manual-add" onClick={addEditManual}>➕</button>
                        </div>
                      </>
                    )}
                  </>
                )}
              </div>

              <div className="edit-modal-actions">
                <button className="danger-btn" onClick={cancelEditEntry}>Annuler</button>
                <button
                  className="primary-btn"
                  onClick={isDuel ? saveDuelEdit : isEvent ? saveEventAdjustments : saveEditEntry}
                >
                  Valider
                </button>
              </div>
            </div>
          </div>
        );
      })()}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
