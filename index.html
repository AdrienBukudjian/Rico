<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Le Rico</title>

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0a0510" />

<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Le Rico" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Righteous&family=Inter:wght@400;500;600;700;800&display=swap');
  html, body {
    margin:0; padding:0; font-family: 'Inter', sans-serif; color: #fbe9f6;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,45,149,0.28), transparent 42%),
      radial-gradient(circle at 80% 30%, rgba(181,55,242,0.24), transparent 45%),
      radial-gradient(circle at 50% 85%, rgba(41,231,255,0.14), transparent 50%),
      #0a0510;
    background-attachment: fixed;
  }
  :root {
    --bg: #0a0510;
    --panel: rgba(32,14,42,0.78);
    --panel-soft: rgba(48,20,62,0.65);
    --line: rgba(255,45,149,0.35);
    --chalk: #fbe9f6;
    --chalk-dim: #c48fc4;
    --gold: #ff2d95;
    --gold-soft: #ff7ac2;
    --red: #ff4d6d;
    --teal: #29e7ff;
    --purple: #b537f2;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  @keyframes bannerPop {
    0% { transform: scale(0.85); opacity: 0; }
    60% { transform: scale(1.04); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes glowPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,45,149,0.45); }
    50% { box-shadow: 0 0 16px 4px rgba(255,45,149,0.45); }
  }
  @keyframes surpriseFlash {
    0% { transform: scale(0.92); opacity: 0; background: rgba(255,45,149,0.4); }
    50% { transform: scale(1.03); }
    100% { transform: scale(1); opacity: 1; background: rgba(255,45,149,0.12); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
  @keyframes shimmerSweep {
    0% { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }
  @keyframes glowPulseRed {
    0%, 100% { box-shadow: 0 0 0 0 rgba(224,122,109,0.45); }
    50% { box-shadow: 0 0 18px 5px rgba(224,122,109,0.5); }
  }
  @keyframes glowPulsePink {
    0%, 100% { box-shadow: 0 0 0 0 rgba(192,79,176,0.45); }
    50% { box-shadow: 0 0 18px 5px rgba(192,79,176,0.5); }
  }
  @keyframes chainSwing {
    0%, 100% { transform: rotate(-8deg); }
    50% { transform: rotate(8deg); }
  }
  @keyframes floatSparkle {
    0%, 100% { transform: translateY(0) scale(1) rotate(0deg); opacity: 0.35; }
    50% { transform: translateY(-7px) scale(1.15) rotate(12deg); opacity: 0.9; }
  }
  @keyframes popupOverlayFade {
    0% { opacity: 0; }
    100% { opacity: 1; }
  }
  @keyframes popupCardIn {
    0% { transform: scale(0.6) rotate(-4deg); opacity: 0; }
    60% { transform: scale(1.06) rotate(1deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  @keyframes popupBorderShift {
    0% { background-position: 100% 100%, 0% 50%; }
    100% { background-position: 100% 100%, 320% 50%; }
  }
  @keyframes popupEmojiPulse {
    0%, 100% { transform: scale(1) rotate(-6deg); }
    50% { transform: scale(1.2) rotate(6deg); }
  }
  html, body { min-height: 100%; overflow-x: hidden; -webkit-text-size-adjust: 100%; }
  @keyframes clubGlowDrift {
    0%, 100% { background-position: 20% 20%, 80% 30%, 50% 85%; }
    50% { background-position: 30% 35%, 65% 15%, 55% 70%; }
  }
  .app {
    min-height: 100vh;
    min-height: 100dvh;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,45,149,0.28), transparent 42%),
      radial-gradient(circle at 80% 30%, rgba(181,55,242,0.24), transparent 45%),
      radial-gradient(circle at 50% 85%, rgba(41,231,255,0.14), transparent 50%),
      var(--bg);
    background-size: 180% 180%, 180% 180%, 180% 180%, 100% 100%;
    animation: clubGlowDrift 16s ease-in-out infinite;
    display: flex;
    justify-content: center;
    padding: 10px;
    padding-top: max(16px, calc(env(safe-area-inset-top) + 10px));
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    padding-left: max(10px, env(safe-area-inset-left));
    padding-right: max(10px, env(safe-area-inset-right));
  }
  .phone { width:100%; max-width:460px; color: var(--chalk); font-family:'Inter',sans-serif; padding-bottom: 12px; }

  h1 {
    font-family:'Righteous',cursive; font-weight:400; margin:0; font-size:22px;
    color: var(--gold);
    text-shadow: 0 0 6px rgba(255,45,149,0.7), 0 0 18px rgba(255,45,149,0.4);
    letter-spacing: 0.02em;
  }
  .title-row { display:flex; align-items:center; gap:8px; }
  .title-icon { font-size:24px; }
  .subtitle { color: var(--chalk-dim); margin:6px 0 18px; font-size:13px; }

  .setup-card, .finished-card {
    background: var(--panel);
    border:1px solid var(--line);
    border-radius:20px;
    padding:18px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 0 0 1px rgba(255,45,149,0.08), 0 8px 32px rgba(0,0,0,0.5), 0 0 24px rgba(255,45,149,0.12);
  }
  .field { margin-bottom:16px; }
  .field label { display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color: var(--chalk-dim); margin-bottom:7px; }
  .checkbox-field { display:flex !important; align-items:center; gap:8px; text-transform:none !important; font-size:13px !important; color: var(--chalk) !important; cursor:pointer; margin-bottom:6px; }
  .checkbox-field input { width:18px; height:18px; accent-color: var(--gold); }

  .features-panel {
    background: rgba(255,45,149,0.05);
    border: 1px solid rgba(255,45,149,0.25);
    border-radius: 16px;
    padding: 16px 16px 4px;
    margin-bottom: 16px;
  }
  .features-panel-title {
    font-family: 'Righteous'; font-size: 14px; color: var(--gold); margin-bottom: 14px;
    text-shadow: 0 0 8px rgba(255,45,149,0.5);
  }
  .features-panel .field:last-child { margin-bottom: 12px; }
  .features-panel-head { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .features-panel-head .features-panel-title { margin-bottom:0; }
  .features-bulk { display:flex; gap:6px; }
  .bulk-btn { background: var(--gold); color:#2a0a1c; border:none; border-radius:999px; padding:4px 10px; font-size:10.5px; font-weight:700; cursor:pointer; }
  .bulk-btn.ghost { background: transparent; border:1px solid var(--line); color: var(--chalk-dim); }

  .pick-list-label { font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em; color: var(--chalk-dim); margin-bottom:7px; }
  .pick-list { display:flex; flex-direction:column; gap:8px; margin-bottom:12px; }
  .pick-row {
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background: var(--panel-soft); border:1px solid var(--line); border-radius:12px;
    padding:12px 14px; width:100%; cursor:pointer; min-height:48px;
  }
  .pick-name { font-size:14px; color: var(--chalk); font-weight:600; }
  .pick-score { font-family:'Righteous'; font-size:15px; color: var(--gold); }
  .pick-self { font-size:12px; color: var(--chalk-dim); text-align:center; margin:0 0 14px; }
  .pick-self b { color: var(--gold); font-family:'Righteous'; font-size:14px; }
  .anulingus-refuse { width:100%; }

  .edit-modal-overlay {
    position: fixed; inset: 0; z-index: 900;
    background: rgba(4,1,8,0.82);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display:flex; align-items:center; justify-content:center; padding:16px;
    animation: popupOverlayFade 0.2s ease;
  }
  .edit-modal {
    width:100%; max-width:420px; max-height:88vh; display:flex; flex-direction:column;
    background: linear-gradient(160deg, rgba(30,11,38,0.98), rgba(17,7,23,0.99));
    border:1px solid var(--line); border-radius:18px;
    box-shadow: 0 18px 60px rgba(0,0,0,0.6), 0 0 30px rgba(255,45,149,0.15);
    animation: popupCardIn 0.35s cubic-bezier(.34,1.56,.64,1);
  }
  .edit-modal-head { display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line); }
  .edit-modal-title { flex:1; font-family:'Righteous'; font-size:14px; color: var(--gold); }
  .edit-modal-close { background:none; border:none; color: var(--chalk-dim); font-size:16px; cursor:pointer; padding:4px 6px; }
  .edit-modal-body { padding:14px 16px; overflow-y:auto; flex:1; }
  .edit-modal-hint { font-size:11.5px; color: var(--chalk-dim); line-height:1.5; margin:0 0 10px; }
  .edit-modal-actions { display:flex; gap:10px; padding:12px 16px; border-top:1px solid var(--line); }
  .adjust-list { display:flex; flex-direction:column; gap:8px; }
  .adjust-row { display:flex; align-items:center; gap:10px; }
  .adjust-name { flex:1; font-size:13px; color: var(--chalk); }
  .adjust-input { width:110px !important; text-align:center; }
  .duel-preview { margin-top:10px; padding:8px 10px; border-radius:10px; background: rgba(181,55,242,0.12); border:1px solid rgba(181,55,242,0.35); color:#e6b8fa; text-align:center; }

  .stepper { display:flex; align-items:center; gap:14px; }
  .stepper button { background: var(--panel-soft); color: var(--chalk); border:1px solid var(--line); width:38px; height:38px; border-radius:10px; font-size:18px; }
  .stepper span { font-family:'Righteous'; font-size:20px; min-width:22px; text-align:center; color: var(--gold); }
  .stepper.small { gap:8px; }
  .stepper.small button { width:28px; height:28px; font-size:14px; border-radius:8px; }
  .stepper.small span { font-size:14px; min-width:36px; }

  .custom-chance-field { margin-bottom: 4px; }
  .custom-chance-controls {
    background: rgba(255,45,149,0.06);
    border: 1px solid rgba(255,45,149,0.2);
    border-radius: 12px;
    padding: 10px 12px 4px;
    margin-top: 6px;
  }
  .custom-chance-row { display:flex; align-items:center; justify-content:space-between; margin-bottom: 10px; }
  .custom-chance-label { font-size: 12.5px; color: var(--chalk); }
  .custom-chance-hint { font-size: 10.5px; color: var(--chalk-dim); line-height: 1.4; margin: 0 0 8px; }

  .names-grid { display:grid; grid-template-columns: 1fr 1fr; gap:8px; }
  input:not([type="checkbox"]) { background: var(--panel-soft); border:1px solid var(--line); color: var(--chalk); border-radius:10px; padding:12px 11px; font-family:'Inter'; font-size:16px; outline:none; width:100%; min-height:44px; }
  input:not([type="checkbox"]):focus { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(255,45,149,0.25); }
  input::placeholder { color: var(--chalk-dim); }

  .starter-row { display:flex; flex-wrap:wrap; gap:7px; }
  .starter-chip { background: var(--panel-soft); border:1px solid var(--line); color: var(--chalk); padding:8px 12px; border-radius:999px; font-size:13px; }
  .starter-chip.active { background: var(--gold); color:#2a0a1c; border-color: var(--gold); font-weight:600; box-shadow: 0 0 12px rgba(255,45,149,0.6); }

  .error { color: var(--red); font-size:13px; margin-bottom:12px; }

  .primary-btn {
    background: linear-gradient(135deg, var(--gold), var(--purple));
    color:#fff; border:none; border-radius:14px; padding:14px; font-weight:700; font-size:15px;
    display:flex; align-items:center; justify-content:center; gap:8px; flex:1; min-height:48px;
    box-shadow: 0 0 0 1px rgba(255,45,149,0.3), 0 4px 18px rgba(255,45,149,0.45), 0 0 22px rgba(181,55,242,0.3);
    text-shadow: 0 1px 2px rgba(0,0,0,0.35);
  }
  .primary-btn:disabled { background: var(--panel-soft); color: var(--chalk-dim); opacity:0.6; box-shadow:none; text-shadow:none; }
  .primary-btn.shake { animation: shake 0.4s ease; }
  .boost-lock-note { font-size:11px; color:#e07a5f; text-align:center; padding:4px 6px; margin-bottom:8px; }
  .boost-lock-note.general { color:var(--gold); font-weight:700; }
  .boost-lock-note.surprise { color:var(--gold); font-weight:700; background: rgba(255,45,149,0.12); border-radius:8px; animation: surpriseFlash 0.5s ease; }
  .sadomazo-info {
    display:flex; align-items:center; gap:8px; font-size:11.5px; font-weight:600; text-align:left;
    padding:7px 10px; margin-bottom:8px; border-radius:10px;
    background: linear-gradient(100deg, rgba(224,122,109,0.08), rgba(224,122,109,0.22), rgba(224,122,109,0.08));
    background-size: 220% 100%;
    border:1px solid rgba(224,122,109,0.5);
    color: var(--red);
    animation: bannerPop 0.4s ease, shimmerSweep 3s linear infinite;
  }
  .sadomazo-chain { display:inline-block; font-size:15px; animation: chainSwing 1.4s ease-in-out infinite; transform-origin: top center; }
  .danger-btn { background: rgba(255,77,109,0.08); color: var(--red); border:1.5px solid var(--red); border-radius:14px; padding:14px; font-weight:600; flex:1; min-height:48px; box-shadow: 0 0 14px rgba(255,77,109,0.25); }

  .topbar { display:flex; align-items:center; gap:10px; margin-bottom:10px; padding:0 2px; }
  .topbar-left { display:flex; align-items:center; gap:6px; font-family:'Righteous'; font-size:15px; }
  .topbar-right { color: var(--chalk-dim); font-size:12px; margin-left:auto; }
  .ghost-btn { background: var(--panel-soft); border:1px solid var(--line); color: var(--chalk-dim); border-radius:8px; padding:7px 9px; }

  .banner { margin-bottom:10px; padding:10px 12px; border-radius:12px; font-size:12.5px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .banner.gold { background: rgba(255,45,149,0.14); border:1px solid var(--gold); box-shadow: 0 0 14px rgba(255,45,149,0.2); }
  .banner.warn { background: rgba(224,122,109,0.14); border:1px solid var(--red); }

  .round-event-chip {
    position: fixed;
    top: max(10px, env(safe-area-inset-top));
    right: max(10px, env(safe-area-inset-right));
    z-index: 25;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.01em;
    backdrop-filter: blur(6px);
    animation: bannerPop 0.35s ease;
  }
  .round-event-chip.gold {
    background: rgba(255,45,149,0.16); border:1px solid var(--gold); color: var(--gold);
    animation: bannerPop 0.35s ease, glowPulse 2s ease-in-out infinite;
  }
  .round-event-chip.red {
    background: rgba(224,122,109,0.16); border:1px solid var(--red); color: var(--red);
    animation: bannerPop 0.35s ease, glowPulseRed 2s ease-in-out infinite;
  }
  .round-event-chip.purple {
    background: rgba(181,55,242,0.18); border:1px solid var(--purple); color:#e6b8fa;
    animation: bannerPop 0.35s ease, glowPulsePink 2s ease-in-out infinite;
  }

  .banner.gangbang-result {
    background: rgba(181,55,242,0.14); border:1px solid var(--purple); color:#e6b8fa; font-weight:600;
    justify-content:center; text-align:center; animation: bannerPop 0.4s ease;
  }
  .banner-actions { margin-left:auto; display:flex; gap:6px; }
  .mini-btn { background: var(--gold); color:#2a2410; border:none; border-radius:8px; padding:6px 10px; font-size:12px; font-weight:600; }
  .mini-btn.ghost { background:transparent; border:1px solid var(--line); color: var(--chalk); }

  .player-strip { display:flex; gap:8px; overflow-x:auto; margin-bottom:12px; padding-bottom:4px; }
  .player-card { background: var(--panel); border:1px solid var(--line); border-radius:12px; padding:8px 12px; min-width:88px; flex-shrink:0; backdrop-filter: blur(10px); }
  .player-card.current { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 0 16px rgba(255,45,149,0.5); }
  .player-card.boosted { border-color: #e07a5f; }
  .player-name { font-size:11px; color: var(--chalk-dim); }
  .player-score { font-family:'Righteous'; font-size:19px; letter-spacing:0.01em; }
  .boost-badge { margin-top:6px; font-size:9.5px; color:#e07a5f; font-weight:700; line-height:1.2; }
  .boost-chip.active { background: #e07a5f; border-color:#e07a5f; color:#1d130f; }
  .boost-tag { margin-left:8px; font-size:11px; color:#e07a5f; font-weight:700; }
  .boost-tag.partouze {
    display:inline-block; font-weight:700;
    background: linear-gradient(90deg, var(--gold), #ffb3dd, var(--gold));
    background-size: 220% 100%;
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    animation: bannerPop 0.4s ease, shimmerSweep 2.4s linear infinite;
  }
  .boost-tag.sadomazo {
    display:inline-block; font-weight:700;
    background: linear-gradient(90deg, var(--red), #ffcfc7, var(--red));
    background-size: 220% 100%;
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    animation: bannerPop 0.4s ease, shimmerSweep 2.4s linear infinite;
  }
  .dice-trail { display:flex; gap:2px; margin-top:4px; font-size:12px; }
  .pip.on { color: var(--gold); }
  .pip.off { color: rgba(245,243,234,0.2); }

  .turn-card { background: var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:12px; backdrop-filter: blur(12px); box-shadow: 0 0 24px rgba(255,45,149,0.08); }
  .turn-head { font-family:'Righteous'; font-size:17px; display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
  .defense-badge { font-family:'Inter'; font-size:10.5px; background: var(--teal); color:#0d2a26; padding:3px 8px; border-radius:999px; display:flex; align-items:center; gap:4px; }

  .pool-indicator { display:flex; align-items:center; gap:4px; margin-bottom:8px; flex-wrap:wrap; font-size:18px; }
  .pool-die.free { color: var(--gold); }
  .pool-die.used { color: rgba(245,243,234,0.2); }
  .pool-text { font-size:11.5px; color: var(--chalk-dim); margin-left:6px; }

  .turn-score { color: var(--gold); font-family:'Righteous'; font-size:16px; margin-bottom:10px; }
  .turn-potential { color: var(--chalk-dim); font-size:12.5px; margin:-6px 0 10px; }
  .turn-potential strong { color: var(--chalk); font-family:'Righteous'; font-size:14px; }

  .combo-table { display:flex; flex-direction:column; gap:4px; margin-bottom:10px; }
  .ct-row { display:grid; grid-template-columns: 34px repeat(5, 1fr); gap:4px; }
  .ct-cell { display:flex; align-items:center; justify-content:center; }
  .ct-header .ct-colhead { font-size:10px; color: var(--chalk-dim); text-align:center; }
  .ct-rowhead { background: var(--panel-soft); border-radius:8px; height:40px; color: var(--gold); font-size:18px; }
  .ct-empty { height:40px; }
  .ct-btn { height:40px; border-radius:8px; background: var(--panel-soft); border:1px solid var(--line); color: var(--gold); font-size:15px; font-family:'Righteous'; letter-spacing:0.01em; transition: box-shadow 0.15s; }
  .ct-btn:not(.ct-disabled):active { box-shadow: 0 0 10px rgba(255,45,149,0.6); }
  .ct-btn.ct-disabled { opacity:0.3; color: var(--chalk-dim); }
  .ct-suites { display:flex; gap:6px; margin-top:6px; }
  .suite-chip { flex:1; }

  .chip { background: var(--panel-soft); border:1px solid var(--line); color: var(--chalk); border-radius:10px; padding:7px 8px; font-size:11.5px; display:flex; flex-direction:column; align-items:flex-start; gap:2px; min-height:46px; justify-content:center; }
  .chip-top { display:flex; align-items:center; gap:4px; }
  .chip-label { line-height:1.15; }
  .chip-bottom { display:flex; align-items:center; gap:6px; }
  .chip-points { color: var(--gold); font-weight:700; font-size:11px; }
  .chip-cost { color: var(--chalk-dim); font-size:10px; }
  .chip-disabled { opacity: 0.35; }
  .chip-disabled .chip-points { color: var(--chalk-dim); }

  .turn-breakdown { display:flex; flex-wrap:wrap; gap:5px; margin: 2px 0 10px; }
  .combo-tag { background: rgba(232,196,104,0.14); border:1px solid var(--gold); color: var(--chalk); border-radius:999px; padding:4px 9px; font-size:11px; }
  .combo-tag b { color: var(--gold); }
  .combo-tag.small { padding:3px 7px; font-size:10.5px; background: var(--panel-soft); border-color: var(--line); }

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const DICE_UNICODE = ["\u2680", "\u2681", "\u2682", "\u2683", "\u2684", "\u2685"];

const TIER_NAMES = { 1: "Un", 2: "Deux", 3: "Trois", 4: "Quatre", 5: "Cinq" };
const FACE_ROWS = [
  { face: 1, tiers: { 1: 100, 2: 200, 3: 300, 4: 600, 5: 1200 } },
  { face: 2, tiers: { 3: 200, 4: 400, 5: 800 } },
  { face: 3, tiers: { 3: 300, 4: 600, 5: 1200 } },
  { face: 4, tiers: { 3: 400, 4: 800, 5: 1600 } },
  { face: 5, tiers: { 1: 50, 2: 100, 3: 500, 4: 1000, 5: 1500 } },
  { face: 6, tiers: { 3: 600, 4: 1200, 5: 2400 } },
];
const SUITES = [
  { label: "1-2-3-4-5", points: 500, cost: 5 },
  { label: "2-3-4-5-6", points: 1000, cost: 5 },
  { label: "1-2-3-4-5-6", points: 2000, cost: 6 },
];

const SHORT_STRAIGHTS = {
  4: [
    { label: "Suite 1-2-3-4", points: 350, cost: 4 },
    { label: "Suite 2-3-4-5", points: 400, cost: 4 },
    { label: "Suite 3-4-5-6", points: 450, cost: 4 },
  ],
  3: [
    { label: "Suite 1-2-3", points: 200, cost: 3 },
    { label: "Suite 2-3-4", points: 250, cost: 3 },
    { label: "Suite 3-4-5", points: 300, cost: 3 },
    { label: "Suite 4-5-6", points: 350, cost: 3 },
  ],
};

function getComboRows(diceCount) {
  if (diceCount === 3) {
    return FACE_ROWS.map((row) => {
      if (row.face === 1 || row.face === 5) {
        const tiers = {};
        [1, 2, 3].forEach((k) => { if (row.tiers[k]) tiers[k] = row.tiers[k]; });
        return { face: row.face, tiers };
      }
      const tiers = { 2: row.face * 30 };
      if (row.tiers[3]) tiers[3] = row.tiers[3];
      return { face: row.face, tiers };
    });
  }
  if (diceCount === 4) {
    return FACE_ROWS.map((row) => {
      const tiers = {};
      [1, 2, 3, 4].forEach((k) => { if (row.tiers[k]) tiers[k] = row.tiers[k]; });
      return { face: row.face, tiers };
    }).filter((row) => Object.keys(row.tiers).length > 0);
  }
  const maxTier = diceCount - 1;
  return FACE_ROWS.map((row) => {
    const tiers = {};
    Object.keys(row.tiers).forEach((k) => {
      if (Number(k) <= maxTier) tiers[k] = row.tiers[k];
    });
    return { face: row.face, tiers };
  }).filter((row) => Object.keys(row.tiers).length > 0);
}

function getExtraCombos(diceCount) {
  const combos = [];
  if (diceCount === 4) combos.push({ label: "Deux paires", points: 250, cost: 4 });
  if (SHORT_STRAIGHTS[diceCount]) combos.push(...SHORT_STRAIGHTS[diceCount]);
  return combos;
}

function EventPopup({ popup, onDismiss }) {
  if (!popup) return null;
  return (
    <div className="event-popup-overlay">
      <div className={"event-popup-card theme-" + popup.theme}>
        <div className="event-popup-emoji">{popup.emoji}</div>
        <div className="event-popup-title">{popup.title}</div>
        <div className="event-popup-message">{popup.message}</div>
        <button className="event-popup-btn" onClick={onDismiss}>
          Continuer
        </button>
      </div>
    </div>
  );
}

function DiceTrail({ total, target }) {
  const pct = target > 0 ? Math.min(1, total / target) : 0;
  const filled = Math.round(pct * 6);
  return (
    <div className="dice-trail">
      {DICE_UNICODE.map((ch, i) => (
        <span key={i} className={i < filled ? "pip on" : "pip off"}>{ch}</span>
      ))}
    </div>
  );
}

function PoolIndicator({ pool, diceCount }) {
  return (
    <div className="pool-indicator">
      {Array.from({ length: diceCount }).map((_, i) => (
        <span key={i} className={i < pool ? "pool-die free" : "pool-die used"}>{DICE_UNICODE[i]}</span>
      ))}
      <span className="pool-text">{pool}/{diceCount} dés libres</span>
    </div>
  );
}

function ComboTable({ pool, onAdd, diceCount }) {
  const numCols = diceCount <= 4 ? diceCount : diceCount - 1;
  const cols = Array.from({ length: numCols }, (_, i) => i + 1);
  const rows = getComboRows(diceCount);
  const suites = [...SUITES.filter((s) => s.cost <= diceCount), ...getExtraCombos(diceCount)];
  const gridStyle = { gridTemplateColumns: `34px repeat(${numCols}, 1fr)` };
  return (
    <div className="combo-table">
      <div className="ct-row ct-header" style={gridStyle}>
        <div className="ct-cell ct-corner" />
        {cols.map((c) => (
          <div key={c} className="ct-cell ct-colhead">
            {c} dé{c > 1 ? "s" : ""}
          </div>
        ))}
      </div>
      {rows.map((row) => (
        <div className="ct-row" key={row.face} style={gridStyle}>
          <div className="ct-cell ct-rowhead">{DICE_UNICODE[row.face - 1]}</div>
          {cols.map((c) => {
            const points = row.tiers[c];
            if (!points) return <div key={c} className="ct-cell ct-empty" />;
            const disabled = c > pool;
            const label = `${TIER_NAMES[c]} ${row.face}`;
            return (
              <button
                key={c}
                className={"ct-cell ct-btn" + (disabled ? " ct-disabled" : "")}
                disabled={disabled}
                onClick={() => onAdd({ label, points, cost: c })}
              >
                {points}
              </button>
            );
          })}
        </div>
      ))}
      {suites.length > 0 && (
        <div className="ct-suites">
          {suites.map((s) => {
            const disabled = s.cost > pool;
            return (
              <button
                key={s.label}
                className={"chip suite-chip" + (disabled ? " chip-disabled" : "")}
                disabled={disabled}
                onClick={() => onAdd(s)}
              >
                <span className="chip-top">
                  <span className="chip-label">{s.label}</span>
                  {disabled && <span>🔒</span>}
                </span>
                <span className="chip-bottom">
                  <span className="chip-points">+{s.points}</span>
                  <span className="chip-cost">{s.cost} dés</span>
                </span>
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

function TurnBreakdown({ adds }) {
  if (adds.length === 0) return null;
  return (
    <div className="turn-breakdown">
      {adds.map((a, i) => (
        <span key={i} className="combo-tag">
          {a.label} <b>+{a.points}</b>
        </span>
      ))}
    </div>
  );
}

function computePlayerStats(players, history) {
  const byId = {};
  players.forEach((p) => { byId[p.id] = { id: p.id, name: p.name, points: [] }; });
  history.forEach((h) => {
    if (h.special) return;
    const player = players.find((p) => p.name === h.playerName);
    if (!player) return;
    byId[player.id].points.push(h.points);
  });
  return Object.values(byId).map((s) => {
    const count = s.points.length;
    const sum = s.points.reduce((a, b) => a + b, 0);
    return {
      name: s.name,
      count,
      best: count ? Math.max(...s.points) : 0,
      avg: count ? sum / count : 0,
      zeros: s.points.filter((v) => v === 0).length,
    };
  });
}

function pickExtreme(list, key, mode) {
  if (list.length === 0) return { names: [], value: 0 };
  const values = list.map((l) => l[key]);
  const target = mode === "max" ? Math.max(...values) : Math.min(...values);
  const names = list.filter((l) => l[key] === target).map((l) => l.name);
  return { names, value: target };
}

function computeSpecialEventStats(players, history) {
  const lossByName = {};
  const targetCountByName = {};
  players.forEach((p) => {
    lossByName[p.name] = 0;
    targetCountByName[p.name] = 0;
  });

  history.forEach((h) => {
    // Individual (non-general) Grosse Bite / Sadomazo surprises target exactly one player.
    if (h.partoozeBoosted && !h.partoozeGeneralRound && h.playerName in targetCountByName) {
      targetCountByName[h.playerName] += 1;
    }
    if (h.sadomazo && !h.sadomazoGeneral && h.playerName in targetCountByName) {
      targetCountByName[h.playerName] += 1;
    }
    // GangBang and Duel entries carry structured targeting/loss data.
    if (h.targetedNames) {
      h.targetedNames.forEach((nm) => {
        if (nm in targetCountByName) targetCountByName[nm] += 1;
      });
    }
    if (h.lossByName) {
      Object.entries(h.lossByName).forEach(([nm, amount]) => {
        if (nm in lossByName) lossByName[nm] += amount;
      });
    }
  });

  return players.map((p) => ({
    name: p.name,
    lost: lossByName[p.name],
    targeted: targetCountByName[p.name],
  }));
}

function App() {
  const [phase, setPhase] = useState("setup");
  const [playerCount, setPlayerCount] = useState(4);
  const [names, setNames] = useState(["", "", "", ""]);
  const [targetStr, setTargetStr] = useState("3000");
  const target = parseInt(targetStr, 10) || 0;
  const [startIndex, setStartIndex] = useState(0);
  const [boostedIndices, setBoostedIndices] = useState([]);
  const [diceCount, setDiceCount] = useState(6);
  const [partoozeIndividual, setPartoozeIndividual] = useState(false);
  const [partoozeGeneral, setPartoozeGeneral] = useState(false);
  const [duelEnabled, setDuelEnabled] = useState(false);
  const [sadomazoIndividual, setSadomazoIndividual] = useState(false);
  const [sadomazoGeneral, setSadomazoGeneral] = useState(false);
  const [gangbangEnabled, setGangbangEnabled] = useState(false);
  const [tournanteEnabled, setTournanteEnabled] = useState(false);
  const [anulingusEnabled, setAnulingusEnabled] = useState(false);
  const [petiteBiteEnabled, setPetiteBiteEnabled] = useState(false);
  const [customChanceEnabled, setCustomChanceEnabled] = useState(false);
  const [customRoundChance, setCustomRoundChance] = useState(15);
  const [customTurnChance, setCustomTurnChance] = useState(13);
  const [setupError, setSetupError] = useState("");

  const [players, setPlayers] = useState([]);
  const [turnCount, setTurnCount] = useState(0);
  const [turnScore, setTurnScore] = useState(0);
  const [pool, setPool] = useState(diceCount);
  const [turnAdds, setTurnAdds] = useState([]);
  const [manualInput, setManualInput] = useState("");
  const [manualCost, setManualCost] = useState("1");
  const [history, setHistory] = useState([]);
  const [triggered, setTriggered] = useState(false);
  const [turnsLeftAfterTrigger, setTurnsLeftAfterTrigger] = useState(0);
  const [triggerInfo, setTriggerInfo] = useState(null);
  const [confirmInstantWin, setConfirmInstantWin] = useState(false);
  const [confirmReset, setConfirmReset] = useState(false);
  const [winner, setWinner] = useState(null);
  const [editingIndex, setEditingIndex] = useState(null);
  const [editCombos, setEditCombos] = useState([]);
  const [editBust, setEditBust] = useState(false);
  const [editManualInput, setEditManualInput] = useState("");
  const [editManualCost, setEditManualCost] = useState("1");
  const [editAdjustments, setEditAdjustments] = useState([]);
  const [editDuelP1, setEditDuelP1] = useState("");
  const [editDuelP2, setEditDuelP2] = useState("");
  const [turnBoost, setTurnBoost] = useState(false);
  const [surpriseBoost, setSurpriseBoost] = useState(false);
  const [revealSurprise, setRevealSurprise] = useState(false);
  const [buttonShake, setButtonShake] = useState(false);

  const [duelStep, setDuelStep] = useState(null);
  const [duelChallengerId, setDuelChallengerId] = useState(null);
  const [duelOpponentId, setDuelOpponentId] = useState(null);
  const [duelP1Score, setDuelP1Score] = useState(null);
  const [duelResult, setDuelResult] = useState(null);
  const [duelPool, setDuelPool] = useState(6);
  const [duelTurnScore, setDuelTurnScore] = useState(0);
  const [duelTurnAdds, setDuelTurnAdds] = useState([]);
  const [duelManualInput, setDuelManualInput] = useState("");
  const [duelManualCost, setDuelManualCost] = useState("1");
  const [generalBoostRound, setGeneralBoostRound] = useState(false);
  const [sadomazoActive, setSadomazoActive] = useState(false);
  const [sadomazoGeneralRound, setSadomazoGeneralRound] = useState(false);
  const [gangbangRoundIndex, setGangbangRoundIndex] = useState(null);
  const [gangbangResolved, setGangbangResolved] = useState(false);
  const [gangbangResult, setGangbangResult] = useState(null);
  const [popupQueue, setPopupQueue] = useState([]);
  const activePopup = popupQueue[0] || null;

  // Deferred round events: decided at round start, revealed/applied at round end
  const [tournanteRoundIndex, setTournanteRoundIndex] = useState(null);
  const [tournanteResolved, setTournanteResolved] = useState(false);
  const [anulingusRoundIndex, setAnulingusRoundIndex] = useState(null);
  const [anulingusResolved, setAnulingusResolved] = useState(false);
  const [anulingusChooserId, setAnulingusChooserId] = useState(null);
  const [anulingusRoundNumber, setAnulingusRoundNumber] = useState(null);
  const [petiteBite, setPetiteBite] = useState(false);

  // Synchronous refs: multiple effects can fire in the same commit (e.g. when a
  // new round starts). React state set in one effect isn't visible to another
  // effect in that same commit, so round-exclusivity checks read these refs
  // instead, which update immediately.
  const generalBoostRoundRef = useRef(false);
  const sadomazoGeneralRoundRef = useRef(false);
  const lastDecidedRoundRef = useRef(-1);
  const lastDecidedTurnRef = useRef(-1);
  // Set synchronously when an end-of-round resolution takes over the screen
  // (Anulingus). Effects declared after the resolution effect run in the SAME
  // commit and can't see the new phase yet, so they read this instead — without
  // it, a Duel rolled for the next turn would setPhase("duel") right on top of
  // the Anulingus screen and one of the two would vanish.
  const roundEndTakeoverRef = useRef(false);

  // Adaptive weights: an event that just fired becomes less likely next time,
  // and one that keeps missing out becomes more likely, so the same event
  // doesn't monopolise the game. Weight 1 = neutral.
  const roundWeightsRef = useRef({});
  const turnWeightsRef = useRef({});

  function weightedPick(pool, weightsRef, adaptiveKeys) {
    const isAdaptive = (k) => !adaptiveKeys || adaptiveKeys.includes(k);
    const weights = pool.map((k) => (isAdaptive(k) ? weightsRef.current[k] ?? 1 : 1));
    const total = weights.reduce((a, b) => a + b, 0);
    let r = Math.random() * total;
    let picked = pool[pool.length - 1];
    for (let i = 0; i < pool.length; i++) {
      r -= weights[i];
      if (r <= 0) {
        picked = pool[i];
        break;
      }
    }
    pool.forEach((k) => {
      if (!isAdaptive(k)) return;
      const cur = weightsRef.current[k] ?? 1;
      weightsRef.current[k] =
        k === picked ? Math.max(0.35, cur * 0.45) : Math.min(2.5, cur * 1.35);
    });
    return picked;
  }

  function setGeneralBoostRoundSync(v) {
    generalBoostRoundRef.current = v;
    setGeneralBoostRound(v);
  }
  function setSadomazoGeneralRoundSync(v) {
    sadomazoGeneralRoundRef.current = v;
    setSadomazoGeneralRound(v);
  }

  const [tbPlayers, setTbPlayers] = useState([]);
  const [tbIndex, setTbIndex] = useState(0);
  const [tbScores, setTbScores] = useState({});
  const [tbHistory, setTbHistory] = useState([]);
  const [tbRound, setTbRound] = useState(1);

  const n = players.length;
  const currentIdx = n > 0 ? (startIndex + turnCount) % n : 0;
  const currentPlayer = players[currentIdx];

  function updatePlayerCount(delta) {
    const nc = Math.min(8, Math.max(2, playerCount + delta));
    setPlayerCount(nc);
    setNames((prev) => {
      const copy = [...prev];
      while (copy.length < nc) copy.push("");
      copy.length = nc;
      return copy;
    });
    if (startIndex >= nc) setStartIndex(0);
    setBoostedIndices((prev) => prev.filter((i) => i < nc));
  }

  function toggleBoostedSetup(i) {
    setBoostedIndices((prev) =>
      prev.includes(i) ? prev.filter((x) => x !== i) : [...prev, i]
    );
  }

  function updateDiceCount(delta) {
    setDiceCount((d) => Math.min(6, Math.max(5, d + delta)));
  }

  function setAllPartouze(value) {
    setPartoozeIndividual(value);
    setPartoozeGeneral(value);
    setSadomazoIndividual(value);
    setSadomazoGeneral(value);
    setPetiteBiteEnabled(value);
    setDuelEnabled(value);
    setGangbangEnabled(value);
    setTournanteEnabled(value);
    setAnulingusEnabled(value);
  }

  function updateRoundChance(delta) {
    setCustomRoundChance((v) => Math.min(75, Math.max(0, v + delta)));
  }

  function updateTurnChance(delta) {
    setCustomTurnChance((v) => Math.min(75, Math.max(0, v + delta)));
  }

  function startGame() {
    const trimmed = names.map((s) => s.trim());
    if (trimmed.some((s) => s.length === 0)) {
      setSetupError("Donne un nom à chaque joueur.");
      return;
    }
    if (!target || target <= 0) {
      setSetupError("Le score à atteindre doit être supérieur à 0.");
      return;
    }
    setSetupError("");
    const ps = trimmed.map((nm, i) => ({ id: i, name: nm, total: 0, boost: boostedIndices.includes(i) }));
    setPlayers(ps);
    setTurnCount(0);
    resetTurnState();
    setHistory([]);
    setTriggered(false);
    setTurnsLeftAfterTrigger(0);
    setTriggerInfo(null);
    setConfirmInstantWin(false);
    setWinner(null);
    roundWeightsRef.current = {};
    turnWeightsRef.current = {};
    lastDecidedRoundRef.current = -1;
    lastDecidedTurnRef.current = -1;
    roundEndTakeoverRef.current = false;
    setPhase("playing");
  }

  function goToSetupKeepConfig() {
    setConfirmReset(false);
    setPhase("setup");
  }

  function resetTurnState() {
    setTurnScore(0);
    setTurnAdds([]);
    setPool(diceCount);
    setManualInput("");
    setManualCost("1");
    setTurnBoost(false);
    setRevealSurprise(false);
    setButtonShake(false);
    setPetiteBite(false);
  }

  function addCombo(item) {
    setTurnScore((s) => s + item.points);
    setPool((p) => p - item.cost);
    setTurnAdds((a) => [...a, { label: item.label, points: item.points, cost: item.cost }]);
  }

  function addManual() {
    const v = parseInt(manualInput, 10);
    const c = parseInt(manualCost, 10);
    if (!v || v <= 0 || isNaN(c) || c < 0 || c > pool) return;
    setTurnScore((s) => s + v);
    setPool((p) => p - c);
    setTurnAdds((a) => [...a, { label: "Ajout libre", points: v, cost: c }]);
    setManualInput("");
    setManualCost("1");
  }

  function undoLastAdd() {
    setTurnAdds((a) => {
      if (a.length === 0) return a;
      const copy = [...a];
      const removed = copy.pop();
      setTurnScore((s) => s - removed.points);
      setPool((p) => p + removed.cost);
      return copy;
    });
  }

  function finalizeGame(playersArr) {
    const maxScore = Math.max(...playersArr.map((p) => p.total));
    const top = playersArr.filter((p) => p.total === maxScore);
    if (top.length === 1) {
      setWinner({ ids: [top[0].id], score: maxScore });
      setPhase("finished");
    } else {
      setTbPlayers(top.map((p) => p.id));
      setTbScores({});
      setTbIndex(0);
      setTbHistory([]);
      setTbRound(1);
      setPhase("tiebreak");
    }
  }

  function bankTurn(bust) {
    if (!currentPlayer) return;
    const base = bust ? 0 : turnScore;
    // Any form of Grosse Bite (permanent, the in-game checkbox, the individual
    // surprise, or a general round) cancels a Petite Bite that was rolled for
    // this turn — the two can never stack.
    const anyGrosseBite = currentPlayer.boost || turnBoost || surpriseBoost || generalBoostRound;
    const multiplier = !bust
      ? (currentPlayer.boost ? 2 : 1) * (turnBoost ? 2 : 1) * (surpriseBoost ? 2 : 1)
      : 1;
    const boosted = base * multiplier;
    const halved = !bust && petiteBite && !anyGrosseBite;
    const points = halved ? Math.floor(boosted / 2) : boosted;
    const newTotal = currentPlayer.total + points;
    const updated = players.map((p) =>
      p.id === currentPlayer.id ? { ...p, total: newTotal } : p
    );
    setPlayers(updated);
    setHistory((h) => [
      ...h,
      {
        round: Math.floor(turnCount / n) + 1,
        playerName: currentPlayer.name,
        points,
        bust,
        total: newTotal,
        boosted: !bust && currentPlayer.boost,
        turnBoosted: !bust && turnBoost,
        partoozeBoosted: !bust && surpriseBoost,
        partoozeGeneralRound: !bust && surpriseBoost && generalBoostRound,
        sadomazo: sadomazoActive,
        sadomazoGeneral: sadomazoActive && sadomazoGeneralRound,
        petiteBite: halved,
        combos: bust ? [] : turnAdds.map((a) => ({ label: a.label, points: a.points, cost: a.cost })),
      },
    ]);
    if (halved) {
      showPopup(
        "red",
        "🤏",
        "PETITE BITE SURPRISE !",
        `Dommage ${currentPlayer.name} — ton score de ce tour était secrètement divisé par 2 : ${boosted} pts deviennent ${points} pts.`
      );
    }
    resetTurnState();

    if (!triggered && newTotal >= target) {
      const posInRound = turnCount % n;
      const remaining = n - 1 - posInRound;
      setTriggered(true);
      setTriggerInfo({ name: currentPlayer.name, score: newTotal });
      if (remaining === 0) {
        finalizeGame(updated);
        return;
      }
      setTurnsLeftAfterTrigger(remaining);
      setTurnCount((c) => c + 1);
      return;
    }

    if (triggered) {
      const nt = turnsLeftAfterTrigger - 1;
      if (nt <= 0) {
        finalizeGame(updated);
        return;
      }
      setTurnsLeftAfterTrigger(nt);
      setTurnCount((c) => c + 1);
      return;
    }

    setTurnCount((c) => c + 1);
  }

  function openEditEntry(index) {
    const entry = history[index];
    if (!entry) return;
    setEditingIndex(index);
    setEditBust(entry.bust);
    setEditCombos(entry.combos ? entry.combos.map((c) => ({ ...c })) : []);
    setEditAdjustments(
      players.map((p) => ({ id: p.id, name: p.name, delta: "" }))
    );
    if (entry.duel) {
      setEditDuelP1(String(entry.duel.p1Score));
      setEditDuelP2(String(entry.duel.p2Score));
    } else {
      setEditDuelP1("");
      setEditDuelP2("");
    }
  }

  function cancelEditEntry() {
    setEditingIndex(null);
    setEditCombos([]);
    setEditBust(false);
    setEditManualInput("");
    setEditManualCost("1");
    setEditAdjustments([]);
    setEditDuelP1("");
    setEditDuelP2("");
  }

  function setEditAdjustment(id, value) {
    setEditAdjustments((list) =>
      list.map((a) => (a.id === id ? { ...a, delta: value } : a))
    );
  }

  // Re-score a past duel: undo the penalty that was applied, then apply the one
  // the corrected scores imply. Only the loser is ever debited.
  function saveDuelEdit() {
    const entry = history[editingIndex];
    if (!entry || !entry.duel) {
      cancelEditEntry();
      return;
    }
    const d = entry.duel;
    const p1 = Math.max(0, parseInt(editDuelP1, 10) || 0);
    const p2 = Math.max(0, parseInt(editDuelP2, 10) || 0);

    const newDiff = Math.abs(p1 - p2);
    let newLoserId = null;
    if (p1 > p2) newLoserId = d.opponentId;
    else if (p2 > p1) newLoserId = d.challengerId;

    const deltas = {};
    if (d.loserId !== null && d.diff > 0) deltas[d.loserId] = (deltas[d.loserId] || 0) + d.diff;
    if (newLoserId !== null && newDiff > 0) deltas[newLoserId] = (deltas[newLoserId] || 0) - newDiff;

    setPlayers((ps) =>
      ps.map((p) => (deltas[p.id] ? { ...p, total: p.total + deltas[p.id] } : p))
    );

    const newLoserName =
      newLoserId === d.challengerId ? d.challengerName : newLoserId === d.opponentId ? d.opponentName : null;
    const newWinnerName =
      newLoserId === d.challengerId ? d.opponentName : newLoserId === d.opponentId ? d.challengerName : null;

    setHistory((h) =>
      h.map((e, i) =>
        i === editingIndex
          ? {
              ...e,
              edited: true,
              lossByName: newLoserName && newDiff > 0 ? { [newLoserName]: newDiff } : {},
              duel: { ...d, p1Score: p1, p2Score: p2, loserId: newLoserId, diff: newDiff },
              special:
                newDiff === 0
                  ? `🍆 Duel — égalité entre ${d.challengerName} (${p1}) et ${d.opponentName} (${p2}), personne ne perd de points`
                  : `🍆 Duel — ${d.challengerName} ${p1} vs ${d.opponentName} ${p2} : ${newLoserName} perd ${newDiff} pts face à ${newWinnerName}`,
            }
          : e
      )
    );
    cancelEditEntry();
  }
  function saveEventAdjustments() {
    const entry = history[editingIndex];
    if (!entry) {
      cancelEditEntry();
      return;
    }
    const applied = editAdjustments
      .map((a) => ({ ...a, n: parseInt(a.delta, 10) }))
      .filter((a) => !isNaN(a.n) && a.n !== 0);

    if (applied.length === 0) {
      cancelEditEntry();
      return;
    }

    setPlayers((ps) =>
      ps.map((p) => {
        const adj = applied.find((a) => a.id === p.id);
        return adj ? { ...p, total: p.total + adj.n } : p;
      })
    );

    const summary = applied
      .map((a) => `${a.name} ${a.n > 0 ? "+" : ""}${a.n}`)
      .join(", ");

    setHistory((h) =>
      h.map((e, i) => (i === editingIndex ? { ...e, edited: true } : e))
    );
    setHistory((h) => [
      ...h,
      {
        round: entry.round,
        playerName: "Correction",
        points: 0,
        bust: false,
        special: `✏️ Rectification — ${summary}`,
      },
    ]);
    cancelEditEntry();
  }

  function addEditCombo(item) {
    setEditCombos((c) => [...c, { label: item.label, points: item.points, cost: item.cost }]);
  }

  function removeEditCombo(idx) {
    setEditCombos((c) => c.filter((_, i) => i !== idx));
  }

  function editPoolUsed() {
    return editCombos.reduce((s, c) => s + (c.cost || 0), 0);
  }

  function addEditManual() {
    const v = parseInt(editManualInput, 10);
    const c = parseInt(editManualCost, 10);
    const remaining = diceCount - editPoolUsed();
    if (!v || v <= 0 || isNaN(c) || c < 0 || c > remaining) return;
    setEditCombos((cs) => [...cs, { label: "Ajout libre", points: v, cost: c }]);
    setEditManualInput("");
    setEditManualCost("1");
  }

  function saveEditEntry() {
    const index = editingIndex;
    const entry = history[index];
    if (!entry) { cancelEditEntry(); return; }
    const rawPoints = editBust ? 0 : editCombos.reduce((s, c) => s + c.points, 0);
    const multiplier =
      (entry.boosted ? 2 : 1) * (entry.turnBoosted ? 2 : 1) * (entry.partoozeBoosted ? 2 : 1);
    const boostedPoints = rawPoints * multiplier;
    const finalPoints = editBust
      ? 0
      : entry.petiteBite
      ? Math.floor(boostedPoints / 2)
      : boostedPoints;
    const finalCombos = editBust ? [] : editCombos;
    const delta = finalPoints - entry.points;
    const playerName = entry.playerName;

    if (
      delta !== 0 ||
      editBust !== entry.bust ||
      JSON.stringify(finalCombos) !== JSON.stringify(entry.combos || [])
    ) {
      setHistory((h) =>
        h.map((e, i) => {
          if (i < index || e.playerName !== playerName) return e;
          if (i === index) {
            return { ...e, points: finalPoints, bust: editBust, total: e.total + delta, combos: finalCombos, edited: true };
          }
          return { ...e, total: e.total + delta };
        })
      );
      setPlayers((ps) =>
        ps.map((p) => (p.name === playerName ? { ...p, total: p.total + delta } : p))
      );
    }
    cancelEditEntry();
  }

  function instantWin() {
    if (!currentPlayer) return;
    setHistory((h) => [
      ...h,
      {
        round: Math.floor(turnCount / n) + 1,
        playerName: currentPlayer.name,
        points: 0,
        bust: false,
        total: currentPlayer.total,
        special: `${diceCount} dés identiques — victoire immédiate`,
      },
    ]);
    setWinner({ ids: [currentPlayer.id], score: currentPlayer.total });
    setConfirmInstantWin(false);
    setPhase("finished");
  }

  const tbCurrentId = tbPlayers[tbIndex];
  const tbCurrentPlayer = players.find((p) => p.id === tbCurrentId);

  function tbBank(bust) {
    const points = bust ? 0 : turnScore;
    setTbHistory((h) => [
      ...h,
      {
        round: tbRound,
        playerName: tbCurrentPlayer.name,
        points,
        bust,
        combos: bust ? [] : turnAdds.map((a) => ({ label: a.label, points: a.points, cost: a.cost })),
      },
    ]);
    resetTurnState();
    const nextIndex = tbIndex + 1;
    const scores = { ...tbScores, [tbCurrentId]: points };
    setTbScores(scores);
    if (nextIndex >= tbPlayers.length) {
      const maxScore = Math.max(...tbPlayers.map((id) => scores[id] ?? 0));
      const top = tbPlayers.filter((id) => (scores[id] ?? 0) === maxScore);
      if (top.length === 1) {
        setWinner({ ids: top, score: maxScore });
        setPhase("finished");
      } else {
        setTbPlayers(top);
        setTbScores({});
        setTbIndex(0);
        setTbRound((r) => r + 1);
      }
    } else {
      setTbIndex(nextIndex);
    }
  }

  const isTiebreak = phase === "tiebreak";
  const activePlayer = isTiebreak ? tbCurrentPlayer : currentPlayer;

  const currentRoundIndex = n > 0 ? Math.floor(turnCount / n) : 0;

  const ROUND_EVENT_CHANCE = customChanceEnabled
    ? Math.max(0, Math.min(1, customRoundChance / 100))
    : Math.min(0.30, 0.15 + Math.max(0, n - 2) * 0.015);
  const TURN_EVENT_CHANCE = customChanceEnabled
    ? Math.max(0, Math.min(1, customTurnChance / 100))
    : Math.min(0.25, 0.13 + Math.max(0, n - 2) * 0.012);

  function resolveGangbangRound(targetRoundNumber) {
    const entries = history.filter((h) => h.round === targetRoundNumber && !h.special);
    if (entries.length < n) return;
    const scoresByPlayer = {};
    entries.forEach((e) => {
      scoresByPlayer[e.playerName] = e.points;
    });
    const names = Object.keys(scoresByPlayer);
    if (names.length === 0) return;
    const minScore = Math.min(...names.map((nm) => scoresByPlayer[nm]));
    const loserNames = names.filter((nm) => scoresByPlayer[nm] === minScore);
    const loserIds = players.filter((p) => loserNames.includes(p.name)).map((p) => p.id);
    const winnerIds = players.filter((p) => !loserIds.includes(p.id)).map((p) => p.id);
    if (loserIds.length === 0 || winnerIds.length === 0) return;
    const penaltyPerLoser = 100 * winnerIds.length;
    const gainPerWinner = 100 * loserIds.length;
    setPlayers((ps) =>
      ps.map((p) => {
        if (loserIds.includes(p.id)) return { ...p, total: p.total - penaltyPerLoser };
        if (winnerIds.includes(p.id)) return { ...p, total: p.total + gainPerWinner };
        return p;
      })
    );
    setGangbangResult({
      loserNames,
      penaltyPerLoser,
      gainPerWinner,
      tie: loserNames.length > 1,
      round: targetRoundNumber,
    });
    setHistory((h) => [
      ...h,
      {
        round: targetRoundNumber,
        playerName: loserNames.join(", "),
        points: 0,
        bust: false,
        targetedNames: loserNames,
        lossByName: Object.fromEntries(loserNames.map((nm) => [nm, penaltyPerLoser])),
        special:
          loserNames.length > 1
            ? `💀 GangBang — égalité, chacun perd ${penaltyPerLoser} pts (100 pts par joueur)`
            : `💀 GangBang — perd ${penaltyPerLoser} pts (100 pts par joueur)`,
      },
    ]);
    if (loserNames.length > 1) {
      showPopup(
        "purple",
        "💀",
        "GANGBANG !",
        `Égalité sur le plus petit score entre ${loserNames.join(", ")} — chacun paie ${penaltyPerLoser} pts (100 pts à chaque autre joueur) !`
      );
    } else {
      showPopup(
        "purple",
        "💀",
        "GANGBANG !",
        `${loserNames[0]} avait le plus petit score de la manche et perd ${penaltyPerLoser} pts (100 pts à chaque joueur) !`
      );
    }
  }

  function resolveTournanteRound(targetRoundNumber) {
    const entries = history.filter((h) => h.round === targetRoundNumber && !h.special);
    if (entries.length < n) return;
    const scoreByName = {};
    entries.forEach((e) => {
      scoreByName[e.name || e.playerName] = e.points;
    });

    // Rotate: each player gives their round score to their left neighbour, i.e.
    // player i ends up keeping the score that player i-1 earned this round.
    const order = [...players.slice(startIndex), ...players.slice(0, startIndex)];
    const deltas = {};
    order.forEach((p, i) => {
      const giver = order[(i - 1 + order.length) % order.length];
      const own = scoreByName[p.name] ?? 0;
      const received = scoreByName[giver.name] ?? 0;
      deltas[p.id] = received - own;
    });

    setPlayers((ps) => ps.map((p) => ({ ...p, total: p.total + (deltas[p.id] || 0) })));

    const summary = order
      .map((p, i) => {
        const receiver = order[(i + 1) % order.length];
        return `${p.name} → ${receiver.name} (${scoreByName[p.name] ?? 0} pts)`;
      })
      .join(" · ");

    setHistory((h) => [
      ...h,
      {
        round: targetRoundNumber,
        playerName: "Tous",
        points: 0,
        bust: false,
        eventKind: "tournante",
        eventRound: targetRoundNumber,
        special: `🔄 Tout le Monde S'encule ! — les scores de la manche ont tourné : ${summary}`,
      },
    ]);

    showPopup(
      "purple",
      "🔄",
      "TOUT LE MONDE S'ENCULE !",
      `Surprise en fin de manche : chaque joueur donne son score de cette manche à son voisin de gauche. ${summary}`
    );
  }

  useEffect(() => {
    if (phase !== "playing" && phase !== "finished") return;
    if (gangbangRoundIndex !== null && !gangbangResolved && currentRoundIndex > gangbangRoundIndex) {
      setGangbangResolved(true);
      resolveGangbangRound(gangbangRoundIndex + 1);
    }
    if (tournanteRoundIndex !== null && !tournanteResolved && currentRoundIndex > tournanteRoundIndex) {
      setTournanteResolved(true);
      resolveTournanteRound(tournanteRoundIndex + 1);
    }
    if (anulingusRoundIndex !== null && !anulingusResolved && currentRoundIndex > anulingusRoundIndex) {
      setAnulingusResolved(true);
      const order = [...players.slice(startIndex), ...players.slice(0, startIndex)];
      const chooser = order[Math.floor(Math.random() * order.length)];
      if (chooser) {
        setAnulingusChooserId(chooser.id);
        setAnulingusRoundNumber(anulingusRoundIndex + 1);
        roundEndTakeoverRef.current = true;
        setPhase("anulingus");
        showPopup(
          "purple",
          "👅",
          "ANULINGUS !",
          `${chooser.name} est désigné en fin de manche : il peut échanger son score total avec le joueur de son choix… ou refuser.`
        );
      }
    }
  }, [currentRoundIndex, phase]);

  // Round-level pool: at most one of these three can be active per round, and
  // the overall chance that ANY of them fires stays fixed regardless of how
  // many are enabled — enabling more options splits the same pie, it doesn't
  // add up on top of it.
  useEffect(() => {
    if (isTiebreak) {
      setGeneralBoostRoundSync(false);
      setSadomazoGeneralRoundSync(false);
      if (gangbangRoundIndex !== null) setGangbangRoundIndex(null);
      return;
    }
    if (phase !== "playing" && phase !== "duel") return;
    if (lastDecidedRoundRef.current === currentRoundIndex) return;
    lastDecidedRoundRef.current = currentRoundIndex;

    const pool = [];
    if (partoozeGeneral) pool.push("general");
    if (sadomazoGeneral) pool.push("sadomazoGeneral");
    if (gangbangEnabled) pool.push("gangbang");
    if (tournanteEnabled) pool.push("tournante");
    if (anulingusEnabled) pool.push("anulingus");

    const clearDeferred = () => {
      if (tournanteRoundIndex !== currentRoundIndex) setTournanteRoundIndex(null);
      if (anulingusRoundIndex !== currentRoundIndex) setAnulingusRoundIndex(null);
    };

    if (pool.length === 0 || Math.random() >= ROUND_EVENT_CHANCE) {
      setGeneralBoostRoundSync(false);
      setSadomazoGeneralRoundSync(false);
      if (gangbangRoundIndex !== currentRoundIndex) setGangbangRoundIndex(null);
      clearDeferred();
      return;
    }

    // All round events are adaptive: whichever fires gets damped, the others rise.
    const picked = weightedPick(pool, roundWeightsRef);
    setGeneralBoostRoundSync(picked === "general");
    setSadomazoGeneralRoundSync(picked === "sadomazoGeneral");
    if (picked === "gangbang") {
      setGangbangRoundIndex(currentRoundIndex);
      setGangbangResolved(false);
      setGangbangResult(null);
    } else if (gangbangRoundIndex !== null) {
      setGangbangRoundIndex(null);
    }

    // These two are decided now but stay completely silent until the round ends,
    // so they can't influence how anyone plays their turn.
    if (picked === "tournante") {
      setTournanteRoundIndex(currentRoundIndex);
      setTournanteResolved(false);
    } else if (tournanteRoundIndex !== currentRoundIndex) {
      setTournanteRoundIndex(null);
    }
    if (picked === "anulingus") {
      setAnulingusRoundIndex(currentRoundIndex);
      setAnulingusResolved(false);
    } else if (anulingusRoundIndex !== currentRoundIndex) {
      setAnulingusRoundIndex(null);
    }

    if (picked === "tournante" || picked === "anulingus") return;

    if (picked === "general") {
      showPopup(
        "gold",
        "🎊",
        "GROSSE BITE SURPRISE GÉNÉRALE !",
        "Cette manche, tous les joueurs jouent avec un score doublé (x2). Règle : il faut jouer la totalité de ses dés pour pouvoir valider son tour."
      );
    } else if (picked === "sadomazoGeneral") {
      showPopup(
        "red",
        "⛓️",
        "SADOMAZO GÉNÉRALE !",
        "Cette manche, chaque joueur ne fait qu'un seul lancer de tous ses dés (pas de mise de côté ni de relance). Il prend les combinaisons présentes sur ce lancer — plusieurs combinaisons possibles en même temps. Si rien ne score, le tour vaut 0."
      );
    } else {
      showPopup(
        "purple",
        "💀",
        "MANCHE GANGBANG !",
        "Chacun joue son tour normalement. À la fin de la manche, le(s) plus petit(s) score(s) paiera(ont) 100 pts à chaque autre joueur."
      );
    }
  }, [
    currentRoundIndex,
    phase,
    isTiebreak,
    partoozeGeneral,
    sadomazoGeneral,
    gangbangEnabled,
    tournanteEnabled,
    anulingusEnabled,
  ]);

  // Turn-level pool: same idea — at most one of these three per turn, overall
  // chance stays fixed, enabling more options only splits who gets picked.
  useEffect(() => {
    if (isTiebreak) {
      setSurpriseBoost(false);
      setSadomazoActive(false);
      return;
    }
    if ((phase !== "playing" && phase !== "duel") || !activePlayer) return;
    // An end-of-round resolution (Anulingus) is claiming the screen in this same
    // commit. Don't decide this turn's event yet and don't consume the slot —
    // this effect re-runs once the phase returns to "playing".
    if (roundEndTakeoverRef.current) return;
    if (lastDecidedTurnRef.current === turnCount) return;
    lastDecidedTurnRef.current = turnCount;

    // A permanent Grosse Bite player is immune to Sadomazo and Petite Bite, and
    // a Grosse Bite surprise would be redundant (he's already x2) — but he stays
    // fully eligible for the Duel.
    const immune = activePlayer.boost;

    if (generalBoostRoundRef.current) {
      setSurpriseBoost(!immune);
      setSadomazoActive(false);
      setPetiteBite(false);
      return;
    }
    if (sadomazoGeneralRoundRef.current) {
      setSurpriseBoost(false);
      setSadomazoActive(!immune);
      setPetiteBite(false);
      return;
    }

    const pool = [];
    if (partoozeIndividual && !immune) pool.push("grosseBite");
    if (sadomazoIndividual && !immune) pool.push("sadomazo");
    if (petiteBiteEnabled && !immune) pool.push("petiteBite");
    if (duelEnabled && currentRoundIndex >= 1) pool.push("duel");

    if (pool.length === 0 || Math.random() >= TURN_EVENT_CHANCE) {
      setSurpriseBoost(false);
      setSadomazoActive(false);
      setPetiteBite(false);
      return;
    }

    // Only the duel adapts here — Grosse Bite / Sadomazo / Petite Bite keep a
    // flat chance whether they fire or not.
    const picked = weightedPick(pool, turnWeightsRef, ["duel"]);
    setSurpriseBoost(picked === "grosseBite");
    setSadomazoActive(picked === "sadomazo");
    setPetiteBite(picked === "petiteBite");

    if (picked === "sadomazo") {
      showPopup(
        "red",
        "⛓️",
        "SADOMAZO !",
        `${activePlayer.name} ne fait qu'un seul lancer de tous ses dés ce tour (pas de mise de côté ni de relance) et prend les combinaisons présentes sur ce lancer — plusieurs combinaisons possibles en même temps. Si rien ne score, le tour vaut 0.`
      );
    } else if (picked === "duel") {
      setDuelChallengerId(activePlayer.id);
      setDuelOpponentId(null);
      setDuelP1Score(null);
      setDuelResult(null);
      resetDuelTurnState();
      setDuelStep("opponent");
      setPhase("duel");
      showPopup(
        "purple",
        "🍆",
        "DUEL SURPRISE !",
        `${activePlayer.name} est désigné et choisit son adversaire. Règle : le premier joue et s'arrête quand il veut, le second doit faire mieux — celui qui perd le duel perd l'écart de points sur son score principal (le gagnant, lui, ne gagne rien).`
      );
    }
    // "grosseBite" and "petiteBite" stay hidden — their popups fire later
    // (at reveal time in attemptBank, and after validation in bankTurn).
  }, [
    activePlayer?.id,
    turnCount,
    phase,
    isTiebreak,
    partoozeIndividual,
    sadomazoIndividual,
    petiteBiteEnabled,
    duelEnabled,
    currentRoundIndex,
    generalBoostRound,
    sadomazoGeneralRound,
  ]);

  useEffect(() => {
    if (phase !== "finished") return;
    if (gangbangRoundIndex !== null && !gangbangResolved) {
      setGangbangResolved(true);
      resolveGangbangRound(gangbangRoundIndex + 1);
    }
  }, [phase]);

  function attemptBank() {
    if (isTiebreak) {
      tbBank(false);
      return;
    }
    const knownLock = activePlayer && (activePlayer.boost || turnBoost || generalBoostRound) && pool > 0;
    if (knownLock) return;
    if (surpriseBoost && pool > 0) {
      setRevealSurprise(true);
      setButtonShake(true);
      setTimeout(() => setButtonShake(false), 500);
      showPopup(
        "gold",
        "😲",
        "SURPRISE ! GROSSE BITE !",
        `${activePlayer?.name} était secrètement boosté x2 ce tour — il faut jouer tous les dés avant de valider !`
      );
      return;
    }
    // He used every die without ever learning he was boosted: reveal it now,
    // after the fact, so the doubled score doesn't come out of nowhere.
    if (surpriseBoost && pool === 0 && !revealSurprise) {
      const mult = (activePlayer?.boost ? 2 : 1) * (turnBoost ? 2 : 1) * 2;
      showPopup(
        "gold",
        "🎉",
        "GROSSE BITE SURPRISE !",
        `Sans le savoir, ${activePlayer?.name} jouait boosté x2 ce tour — et il a bien joué tous ses dés : ${turnScore} pts deviennent ${turnScore * mult} pts !`
      );
    }
    bankTurn(false);
  }

  function showPopup(theme, emoji, title, message, onClose) {
    setPopupQueue((q) => [...q, { theme, emoji, title, message, onClose: onClose || null }]);
  }

  function dismissPopup() {
    const cb = activePopup?.onClose;
    setPopupQueue((q) => q.slice(1));
    if (cb) cb();
  }

  function resetDuelTurnState() {
    setDuelPool(diceCount);
    setDuelTurnScore(0);
    setDuelTurnAdds([]);
    setDuelManualInput("");
    setDuelManualCost("1");
  }

  function pickDuelOpponent(id) {
    setDuelOpponentId(id);
    resetDuelTurnState();
    setDuelStep("p1");
  }

  function addDuelCombo(item) {
    setDuelTurnScore((s) => s + item.points);
    setDuelPool((p) => p - item.cost);
    setDuelTurnAdds((a) => [...a, { label: item.label, points: item.points, cost: item.cost }]);
  }

  function addDuelManual() {
    const v = parseInt(duelManualInput, 10);
    const c = parseInt(duelManualCost, 10);
    if (!v || v <= 0 || isNaN(c) || c < 0 || c > duelPool) return;
    setDuelTurnScore((s) => s + v);
    setDuelPool((p) => p - c);
    setDuelTurnAdds((a) => [...a, { label: "Ajout libre", points: v, cost: c }]);
    setDuelManualInput("");
    setDuelManualCost("1");
  }

  function resolveDuel(p1Score, p2Score) {
    const diff = Math.abs(p1Score - p2Score);
    let winnerId = null;
    let loserId = null;
    if (p1Score > p2Score) {
      winnerId = duelChallengerId;
      loserId = duelOpponentId;
    } else if (p2Score > p1Score) {
      winnerId = duelOpponentId;
      loserId = duelChallengerId;
    }
    if (loserId !== null && diff > 0) {
      setPlayers((ps) => ps.map((p) => (p.id === loserId ? { ...p, total: p.total - diff } : p)));
    }
    setDuelResult({ winnerId, loserId, diff, p1Score, p2Score });

    const challengerName = players.find((p) => p.id === duelChallengerId)?.name;
    const opponentName = players.find((p) => p.id === duelOpponentId)?.name;
    const winnerName = players.find((p) => p.id === winnerId)?.name;
    const loserName = players.find((p) => p.id === loserId)?.name;
    const roundNumber = Math.floor(turnCount / n) + 1;

    setHistory((h) => [
      ...h,
      {
        round: roundNumber,
        playerName: `${challengerName} vs ${opponentName}`,
        points: 0,
        bust: false,
        targetedNames: [challengerName, opponentName],
        lossByName: loserName && diff > 0 ? { [loserName]: diff } : {},
        duel: {
          challengerId: duelChallengerId,
          opponentId: duelOpponentId,
          challengerName,
          opponentName,
          p1Score,
          p2Score,
          loserId,
          diff,
        },
        special:
          diff === 0
            ? `🍆 Duel — égalité entre ${challengerName} et ${opponentName}, personne ne perd de points`
            : `🍆 Duel — ${loserName} perd ${diff} pts face à ${winnerName}`,
      },
    ]);

    if (diff === 0) {
      showPopup("purple", "🤝", "ÉGALITÉ !", "Aucun gagnant, personne ne perd de points.", endDuel);
    } else {
      showPopup(
        "purple",
        "🍆",
        "RÉSULTAT DU DUEL !",
        `${winnerName} gagne ! ${loserName} perd ${diff} pts sur son score principal.`,
        endDuel
      );
    }
  }

  function finishDuelTurn(bust) {
    if (duelStep === "p1") {
      const player = players.find((p) => p.id === duelChallengerId);
      const mult = player?.boost || generalBoostRound ? 2 : 1;
      const score = bust ? 0 : duelTurnScore * mult;
      setDuelP1Score(score);
      resetDuelTurnState();
      setDuelStep("p2");
    } else if (duelStep === "p2") {
      const player = players.find((p) => p.id === duelOpponentId);
      const mult = player?.boost || generalBoostRound ? 2 : 1;
      const score = bust ? 0 : duelTurnScore * mult;
      resolveDuel(duelP1Score, score);
    }
  }

  function endDuel() {
    setDuelStep(null);
    setDuelChallengerId(null);
    setDuelOpponentId(null);
    setDuelP1Score(null);
    setDuelResult(null);
    setPhase("playing");
  }

  function confirmAnulingus(targetId) {
    const chooser = players.find((p) => p.id === anulingusChooserId);
    const targetPlayer = players.find((p) => p.id === targetId);
    if (!chooser || !targetPlayer) return;

    // Only the scores earned during THIS round are swapped, not the career
    // totals: each player's total is shifted by the difference between the two
    // round scores.
    const roundNumber = anulingusRoundNumber ?? (anulingusRoundIndex ?? 0) + 1;
    const roundScore = (name) =>
      history
        .filter((h) => h.round === roundNumber && !h.special && h.playerName === name)
        .reduce((s, h) => s + h.points, 0);

    const a = roundScore(chooser.name);
    const b = roundScore(targetPlayer.name);
    const delta = b - a;

    if (delta !== 0) {
      setPlayers((ps) =>
        ps.map((p) => {
          if (p.id === chooser.id) return { ...p, total: p.total + delta };
          if (p.id === targetPlayer.id) return { ...p, total: p.total - delta };
          return p;
        })
      );
    }
    setHistory((h) => [
      ...h,
      {
        round: roundNumber,
        playerName: `${chooser.name} ↔ ${targetPlayer.name}`,
        points: 0,
        bust: false,
        eventKind: "anulingus",
        special: `👅 Anulingus — ${chooser.name} échange son score de manche (${a} pts) avec ${targetPlayer.name} (${b} pts)`,
      },
    ]);
    setAnulingusChooserId(null);
    setAnulingusRoundNumber(null);
    // Don't clear anulingusRoundIndex here: the round-decision effect may have
    // already armed a NEW Anulingus for the round that just started, and wiping
    // it would silently cancel it. That effect clears stale indexes itself.
    roundEndTakeoverRef.current = false;
    setPhase("playing");
    showPopup(
      "purple",
      "👅",
      "ÉCHANGE EFFECTUÉ !",
      `${chooser.name} repart avec ${b} pts pour cette manche et ${targetPlayer.name} avec ${a} pts.`
    );
  }

  function anulingusRoundScore(name) {
    if (!name) return 0;
    const roundNumber = anulingusRoundNumber ?? (anulingusRoundIndex ?? 0) + 1;
    return history
      .filter((h) => h.round === roundNumber && !h.special && h.playerName === name)
      .reduce((s, h) => s + h.points, 0);
  }

  function refuseAnulingus() {
    const chooser = players.find((p) => p.id === anulingusChooserId);
    setHistory((h) => [
      ...h,
      {
        round: (anulingusRoundIndex ?? 0) + 1,
        playerName: chooser ? chooser.name : "—",
        points: 0,
        bust: false,
        eventKind: "anulingus",
        special: `👅 Anulingus — ${chooser ? chooser.name : "Le joueur désigné"} a refusé l'échange`,
      },
    ]);
    setAnulingusChooserId(null);
    setAnulingusRoundNumber(null);
    // Don't clear anulingusRoundIndex here: the round-decision effect may have
    // already armed a NEW Anulingus for the round that just started, and wiping
    // it would silently cancel it. That effect clears stale indexes itself.
    roundEndTakeoverRef.current = false;
    setPhase("playing");
  }

  if (phase === "setup") {
    return (
      <div className="app">
        <div className="phone">
          <div className="setup-card">
            <div className="title-row">
              <span className="title-icon">🎲</span>
              <h1>Le Rico</h1>
            </div>
            <p className="subtitle">Configure la partie avant de lancer les dés.</p>

            <div className="field">
              <label>Nombre de joueurs</label>
              <div className="stepper">
                <button onClick={() => updatePlayerCount(-1)}>−</button>
                <span>{playerCount}</span>
                <button onClick={() => updatePlayerCount(1)}>+</button>
              </div>
            </div>

            <div className="field">
              <label>Nombre de dés (5 ou 6)</label>
              <div className="stepper">
                <button onClick={() => updateDiceCount(-1)}>−</button>
                <span>{diceCount}</span>
                <button onClick={() => updateDiceCount(1)}>+</button>
              </div>
            </div>

            <div className="field">
              <label>Noms des joueurs</label>
              <div className="names-grid">
                {names.map((nm, i) => (
                  <input
                    key={i}
                    value={nm}
                    placeholder={`Joueur ${i + 1}`}
                    onChange={(e) => {
                      const copy = [...names];
                      copy[i] = e.target.value;
                      setNames(copy);
                    }}
                  />
                ))}
              </div>
            </div>

            <div className="field">
              <label>Score à atteindre</label>
              <input
                type="text"
                inputMode="numeric"
                pattern="[0-9]*"
                className="target-input"
                value={targetStr}
                placeholder="3000"
                onChange={(e) => setTargetStr(e.target.value.replace(/[^0-9]/g, ""))}
              />
            </div>

            <div className="field">
              <label>Qui commence ?</label>
              <div className="starter-row">
                {names.map((nm, i) => (
                  <button
                    key={i}
                    className={"starter-chip" + (startIndex === i ? " active" : "")}
                    onClick={() => setStartIndex(i)}
                  >
                    {nm.trim() || `Joueur ${i + 1}`}
                  </button>
                ))}
              </div>
            </div>

            <div className="field">
              <label>🍆 Grosse bite (score x2 chaque manche)</label>
              <div className="starter-row">
                {names.map((nm, i) => (
                  <button
                    key={i}
                    className={"starter-chip boost-chip" + (boostedIndices.includes(i) ? " active" : "")}
                    onClick={() => toggleBoostedSetup(i)}
                  >
                    {nm.trim() || `Joueur ${i + 1}`}
                  </button>
                ))}
              </div>
            </div>

            <div className="features-panel">
              <div className="features-panel-head">
                <div className="features-panel-title">🎲 Mode Partouze</div>
                <div className="features-bulk">
                  <button className="bulk-btn" onClick={() => setAllPartouze(true)}>Tout cocher</button>
                  <button className="bulk-btn ghost" onClick={() => setAllPartouze(false)}>Tout décocher</button>
                </div>
              </div>

              <div className="field">
                <label>🎉 Grosse Bite</label>
                <label className="checkbox-field">
                  <input
                    type="checkbox"
                    checked={partoozeIndividual}
                    onChange={() => setPartoozeIndividual((m) => !m)}
                  />
                  Grosse Bite Surprise Individuelle
                </label>
                <label className="checkbox-field">
                  <input
                    type="checkbox"
                    checked={partoozeGeneral}
                    onChange={() => setPartoozeGeneral((m) => !m)}
                  />
                  Grosse Bite Surprise Générale
                </label>
              </div>

              <div className="field">
                <label>⛓️ Sadomazo</label>
                <label className="checkbox-field">
                  <input
                    type="checkbox"
                    checked={sadomazoIndividual}
                    onChange={() => setSadomazoIndividual((m) => !m)}
                  />
                  Sadomazo Individuelle
                </label>
                <label className="checkbox-field">
                  <input
                    type="checkbox"
                    checked={sadomazoGeneral}
                    onChange={() => setSadomazoGeneral((m) => !m)}
                  />
                  Sadomazo Générale
                </label>
              </div>

              <div className="field">
                <label>🤏 Petite Bite</label>
                <label className="checkbox-field">
                  <input
                    type="checkbox"
                    checked={petiteBiteEnabled}
                    onChange={() => setPetiteBiteEnabled((m) => !m)}
                  />
                  Petite Bite Surprise
                </label>
              </div>

              <div className="field">
                <label>🍆 Duel</label>
                <label className="checkbox-field">
                  <input type="checkbox" checked={duelEnabled} onChange={() => setDuelEnabled((m) => !m)} />
                  Qui a la Plus Grosse ?
                </label>
              </div>

              <div className="field">
                <label>💀 Mini-jeux de manche</label>
                <label className="checkbox-field">
                  <input type="checkbox" checked={gangbangEnabled} onChange={() => setGangbangEnabled((m) => !m)} />
                  GangBang
                </label>
                <label className="checkbox-field">
                  <input
                    type="checkbox"
                    checked={tournanteEnabled}
                    onChange={() => setTournanteEnabled((m) => !m)}
                  />
                  Tout le Monde S'encule !
                </label>
                <label className="checkbox-field">
                  <input
                    type="checkbox"
                    checked={anulingusEnabled}
                    onChange={() => setAnulingusEnabled((m) => !m)}
                  />
                  Anulingus
                </label>
              </div>

              <div className="field custom-chance-field">
                <label className="checkbox-field">
                  <input
                    type="checkbox"
                    checked={customChanceEnabled}
                    onChange={() => setCustomChanceEnabled((m) => !m)}
                  />
                  🎚️ Mode sur mesure (régler les probabilités moi-même)
                </label>
                {customChanceEnabled && (
                  <div className="custom-chance-controls">
                    <div className="custom-chance-row">
                      <span className="custom-chance-label">Généraux (par manche)</span>
                      <div className="stepper small">
                        <button onClick={() => updateRoundChance(-5)}>−</button>
                        <span>{customRoundChance}%</span>
                        <button onClick={() => updateRoundChance(5)}>+</button>
                      </div>
                    </div>
                    <div className="custom-chance-row">
                      <span className="custom-chance-label">Individuels (par tour)</span>
                      <div className="stepper small">
                        <button onClick={() => updateTurnChance(-5)}>−</button>
                        <span>{customTurnChance}%</span>
                        <button onClick={() => updateTurnChance(5)}>+</button>
                      </div>
                    </div>
                    <p className="custom-chance-hint">
                      Ce pourcentage est la chance globale qu'un événement se déclenche ; il se partage ensuite équitablement entre les features cochées ci-dessus.
                    </p>
                  </div>
                )}
              </div>
            </div>

            {setupError && <div className="error">{setupError}</div>}

            <button className="primary-btn start-btn" onClick={startGame}>
              Lancer la partie
            </button>
          </div>
        </div>
      </div>
    );
  }

  if (phase === "finished") {
    const sorted = [...players].sort((a, b) => b.total - a.total);
    const winnerNames = winner
      ? players.filter((p) => winner.ids.includes(p.id)).map((p) => p.name)
      : [];
    const minScore = Math.min(...players.map((p) => p.total));
    const loserIds = players
      .filter((p) => p.total === minScore && !winner?.ids.includes(p.id))
      .map((p) => p.id);

    const playerStats = computePlayerStats(players, history);
    const playedStats = playerStats.filter((s) => s.count > 0);
    const bestTurn = pickExtreme(playerStats, "best", "max");
    const bestAvg = pickExtreme(playedStats, "avg", "max");
